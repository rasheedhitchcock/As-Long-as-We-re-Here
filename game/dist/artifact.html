        ui.text(uctx, d.tool === 'stick' ? 'Bâton : rapide, mais gare à la racine.' : 'Doigts : lent, mais sans danger pour les radicelles.',
          DIGUI.stick.x + 2, DIGUI.stick.y - 12, { size: 18, italic: true, color: 'rgba(232,223,204,0.85)', shadow: true });
        // tirer
        const r = DIGUI.pull;
        if (d.ready) {
          const pulse = 0.5 + 0.5 * Math.sin(G.time * 4);
          uctx.save();
          uctx.shadowColor = `rgba(242,210,122,${0.4 + 0.4 * pulse})`; uctx.shadowBlur = 18;
          uctx.fillStyle = P.gold;
          rrect(uctx, r, 6); uctx.fill();
          uctx.restore();
          ui.text(uctx, 'Tirer la racine', r.x + r.w / 2, r.y + r.h / 2 + 1, { size: 24, color: P.ink, align: 'center', base: 'middle', bold: true });
          ui.text(uctx, 'T', r.x + r.w - 14, r.y + r.h / 2 + 1, { size: 15, color: 'rgba(31,26,23,0.5)', align: 'right', base: 'middle' });
        } else {
          ui.button(uctx, r, 'Tirer la racine', { size: 22, key: 'T', disabled: !ui.hover(r) });
          ui.text(uctx, 'Trop tôt : elle risque de casser.', r.x + r.w, r.y - 12, { size: 17, italic: true, color: '#E9A27A', align: 'right', shadow: true });
        }
        // anneau de l'outil
        const T = TOOLS[d.tool];
        uctx.save();
        uctx.strokeStyle = d.rub > 0.1 ? P.ember : 'rgba(232,223,204,0.5)';
        uctx.lineWidth = d.rub > 0.1 ? 2.5 : 1.5;
        uctx.setLineDash([5, 4]);
        uctx.beginPath(); uctx.arc(d.cur.x, d.cur.y, T.r * 0.85, 0, TAU); uctx.stroke();
        uctx.restore();
        if (d.rub > 0.1) ui.text(uctx, 'Doucement…', d.cur.x, d.cur.y + T.r + 22, { size: 18, italic: true, color: '#F2C9A0', align: 'center', shadow: true });
        if (!G.blocked) {
          ui.hint(uctx, this.kbd ? 'Flèches : déplacer · Espace : gratter · 1 / 2 : outil · T : tirer' : 'Maintiens et glisse pour gratter la terre', { y: 16, size: 19 });
        }
      }
      this.drawCaption(uctx);
      if (d.result) this.drawResult(uctx, d);
    },
    drawResult(uctx, d) {
      const r = d.result, R = RES.panel;
      const a = U.clamp(r.t * 3, 0, 1);
      uctx.save();
      uctx.globalAlpha = a;
      uctx.translate(R.x + R.w / 2, R.y + R.h / 2);
      uctx.rotate(-0.01);
      uctx.translate(-(R.x + R.w / 2), -(R.y + R.h / 2));
      uctx.shadowColor = 'rgba(0,0,0,0.5)'; uctx.shadowBlur = 18; uctx.shadowOffsetY = 4;
      uctx.fillStyle = '#EFE8D6';
      uctx.fillRect(R.x, R.y, R.w, R.h);
      uctx.shadowBlur = 0; uctx.shadowOffsetY = 0;
      // la racine, posée sur le papier
      const part = r.broken ? 'top' : 'all';
      const caps = d.root.caps.filter((c) => part === 'all' || c.part === part);
      let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
      for (const c of caps) {
        x0 = Math.min(x0, c.x1 - c.r1, c.x2 - c.r2); x1 = Math.max(x1, c.x1 + c.r1, c.x2 + c.r2);
        y0 = Math.min(y0, c.y1 - c.r1, c.y2 - c.r2); y1 = Math.max(y1, c.y1 + c.r1, c.y2 + c.r2);
      }
      for (const rl of d.root.rootlets) {
        if (part !== 'all' && rl.part !== part) continue;
        for (const [x, y] of rl.pts) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
      }
      const box = { x: R.x + 24, y: R.y + 30, w: 250, h: R.h - 60 };
      const sc = Math.min(box.w / (x1 - x0), box.h / (y1 - y0 + 20), 1.1);
      uctx.save();
      uctx.translate(box.x + box.w / 2, box.y + box.h / 2);
      uctx.scale(sc, sc);
      uctx.translate(-(x0 + x1) / 2, -(y0 + y1) / 2 + 10);
      const n = d.root.caps[0];
      uctx.strokeStyle = '#7A6A38'; uctx.lineWidth = 3; uctx.lineCap = 'round';
      uctx.beginPath(); uctx.moveTo(n.x1, n.y1); uctx.lineTo(n.x1 + 2, n.y1 - 22); uctx.stroke();
      drawRoot(uctx, d.root, d.marks, part, 0, 0, r.broken);
      uctx.restore();
      const tx = R.x + 300;
      ui.caps(uctx, `Racine ${d.index}`, tx, R.y + 50, { size: 14, color: 'rgba(31,26,23,0.55)', spacing: 3 });
      ui.text(uctx, r.label, tx, R.y + 108, { size: 52, kind: 'hand', color: r.broken ? '#8C2A1A' : '#2A3A5A' });
      ui.text(uctx, r.sub, tx, R.y + 152, { size: 21, italic: true, color: '#3A302A', maxW: 296, lineH: 27 });
      ui.caps(uctx, 'Qualité', tx, R.y + 268, { size: 12, color: 'rgba(31,26,23,0.55)' });
      ui.bar(uctx, tx, R.y + 280, 280, 10, r.q, { bg: 'rgba(31,26,23,0.15)', color: r.q >= 0.86 ? '#6E8A3A' : r.q >= 0.5 ? P.ochre : P.rust });
      uctx.restore();
      if (r.canGo) {
        uctx.save();
        uctx.globalAlpha = a;
        ui.button(uctx, RES.cont, 'Continuer', { hover: true, size: 23, key: 'Espace' });
        uctx.restore();
      }
    },
  });

  G.DEV = G.DEV || {};
  G.DEV.ginseng = () => G.play(G.Scenes.ginseng({}));
})();

// ---- src/scenes/haggle.js
'use strict';
// Mini-jeu « Le marchand de racines » : vendre le ginseng à M. Thornbury.
// On pousse sa chance : demander plus, montrer la qualité, faire mine de partir.
// Sa patience se lit à sa pipe et à ses gestes.
(function () {
  const G = window.G;
  const U = G.U;
  const I = G.input;
  const ui = G.ui;
  const A = G.art;
  const P = G.PAL;

  const LINES = {
    open: 'Voyons ça. Racines fraîches, pas séchées… Je t\'en donne {offer}.',
    up: ['Bon. {offer}, et c\'est bien parce que t\'as une bonne tête.', 'Tu marchandes comme ta grand-mère. {offer}.', 'Allez. {offer}.'],
    refuse: ['Tu me prends pour la Croix-Rouge ?', 'Non, petit. Ça vaut pas ça.', 'Ho. On se calme.'],
    last: 'Mon dernier prix, petit : {offer}. Après, je remonte dans mon camion.',
    show: 'Hm. Les radicelles sont intactes. Ça, c\'est du travail propre. Je peux monter un peu.',
    showBad: 'Je les ai vues, tes radicelles. Justement.',
    leaveBack: 'Attends, attends ! Reviens. {offer}, et on n\'en parle plus.',
    leaveGone: 'Comme tu veux. Pruitt t\'en donnera la moitié.',
    deal: 'Marché conclu.',
  };
  const fill = (s, offer) => s.replace('{offer}', U.money(offer));

  G.Scenes.haggle = (opts = {}) => G.makeScene({
    enter() {
      const roots = opts.roots && opts.roots.length ? opts.roots : [{ quality: 0.8 }, { quality: 0.6 }];
      this.roots = roots;
      this.avgQ = roots.reduce((a, r) => a + r.quality, 0) / roots.length;
      this.value = roots.reduce((a, r) => a + Math.round(100 + 90 * r.quality), 0);
      this.max = Math.round(this.value * U.rand(0.95, 1.05));
      this.offer = Math.round(this.value * 0.58 / 5) * 5;
      this.patience = 3;
      this.shown = false;
      this.final = false;
      this.phase = 'talk';
      this.line = fill(LINES.open, this.offer);
      this.lineT = 0;
      this.puff = 0;
      this.mood = 0; // 0 calme, 1 agacé, 2 à bout
      this.history = [];
      G.audio.amb(['wind', 'birds']);
    },
    say(s) { this.line = s; this.lineT = 0; },
    annoy() {
      this.patience--;
      this.mood = this.patience >= 2 ? 0 : this.patience === 1 ? 1 : 2;
      this.puff = 1;
      G.audio.sfx('knock');
    },
    ask(step) {
      if (this.final) {
        this.say(LINES.leaveGone);
        this.done(Math.round(this.value * 0.45 / 5) * 5, 'pruitt');
        return;
      }
      const want = this.offer + step;
      // Il accepte tant qu'on reste sous son plafond ; il rogne un peu la demande.
      if (want <= this.max && (step <= 15 || Math.random() < 0.75)) {
        const gain = step <= 15 ? step : Math.round(step * U.rand(0.5, 0.9) / 5) * 5;
        this.offer = Math.min(this.max, this.offer + Math.max(5, gain));
        this.say(fill(U.pick(LINES.up), this.offer));
        if (this.max - this.offer < 30 || step > 15) this.annoy();
        G.audio.sfx('coin');
      } else {
        this.say(U.pick(LINES.refuse));
        this.annoy();
      }
      if (this.patience <= 0 && !this.final) {
        this.final = true;
        this.say(fill(LINES.last, this.offer));
      }
    },
    show() {
      this.shown = true;
      if (this.avgQ >= 0.6) {
        this.max = Math.round(this.max * 1.12);
        this.patience = Math.min(3, this.patience + 1);
        this.mood = Math.max(0, this.mood - 1);
        this.say(LINES.show);
      } else {
        this.max = Math.round(this.max * 0.95);
        this.say(LINES.showBad);
        this.annoy();
      }
    },
    leave() {
      if (!this.final && this.patience >= 2 && this.offer < this.max) {
        this.offer = Math.min(this.max, Math.round((this.offer + (this.max - this.offer) * 0.6) / 5) * 5);
        this.final = true;
        this.say(fill(LINES.leaveBack, this.offer));
        G.audio.sfx('coin');
      } else {
        this.say(LINES.leaveGone);
        this.done(Math.round(this.value * 0.45 / 5) * 5, 'pruitt');
      }
    },
    done(cents, to) {
      this.phase = 'done';
      this.result = { cents, soldTo: to };
      if (to === 'thornbury') { this.say(LINES.deal); G.audio.sfx('coin'); }
      G.after(2.2, () => this.finish(this.result));
    },
    buttons() {
      const b = [
        { id: 'accept', t: `Accepter ${U.money(this.offer)}` },
        { id: 'ask10', t: 'Demander 10 ¢ de plus' },
        { id: 'ask50', t: 'Demander 50 ¢ de plus' },
      ];
      if (!this.shown) b.push({ id: 'show', t: 'Montrer les radicelles' });
      b.push({ id: 'leave', t: 'Remballer les racines' });
      return b.map((x, i) => Object.assign(x, { r: { x: 760, y: 300 + i * 62, w: 440, h: 52 }, key: String(i + 1) }));
    },
    update(dt) {
      this.lineT += dt;
      this.puff = Math.max(0, this.puff - dt * 0.6);
      if (this.phase !== 'talk' || G.blocked) return;
      const bs = this.buttons();
      bs.forEach((b, i) => {
        if (!ui.hit(b.r) && !I.hit('Digit' + (i + 1))) return;
        I.consume();
        G.audio.sfx('click');
        if (b.id === 'accept') this.done(this.offer, 'thornbury');
        if (b.id === 'ask10') this.ask(10);
        if (b.id === 'ask50') this.ask(50);
        if (b.id === 'show') this.show();
        if (b.id === 'leave') this.leave();
      });
    },
    draw(ctx) {
      G.places.town(ctx, 440, { time: 'day' });
      // caisse, balance suspendue et racines
      ctx.fillStyle = '#5A4128';
      ctx.fillRect(520, 580, 80, 50);
      ctx.strokeStyle = '#2B2420'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(470, 470); ctx.lineTo(470, 500); ctx.stroke();
      ctx.fillStyle = '#B8A16A';
      ctx.beginPath(); ctx.arc(470, 510, 14, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(450, 545); ctx.lineTo(490, 545); ctx.lineTo(480, 555); ctx.lineTo(460, 555); ctx.fill();
      ctx.strokeStyle = '#2B2420'; ctx.beginPath(); ctx.moveTo(470, 524); ctx.lineTo(452, 545); ctx.moveTo(470, 524); ctx.lineTo(488, 545); ctx.stroke();
      this.roots.forEach((r, i) => {
        ctx.strokeStyle = r.quality > 0.7 ? '#E2D2A8' : '#C9B482';
        ctx.lineWidth = 4;
        const x = 458 + i * 10;
        ctx.beginPath(); ctx.moveTo(x, 538); ctx.lineTo(x + 3, 548); ctx.stroke();
      });
      // M. Thornbury assis sur sa caisse, Henry debout
      const tapping = this.mood >= 1 ? Math.sin(G.time * (this.mood === 2 ? 12 : 6)) * 0.15 : 0;
      A.char(ctx, 'thornbury', 560, 640, { pose: 'sit', seatH: 48, dir: -1, carry: 'pipe', arms: [0.6, 1.3 + tapping] });
      A.char(ctx, 'henry', 360, 640, { dir: 1, rim: true });
      // fumée de pipe : plus épaisse quand il s'agace
      for (let i = 0; i < 3 + this.mood * 2; i++) {
        const k = (G.time * (0.3 + this.mood * 0.2) + i / (3 + this.mood * 2)) % 1;
        ctx.fillStyle = `rgba(210,204,190,${(0.25 + this.mood * 0.12) * (1 - k)})`;
        ctx.beginPath(); ctx.arc(520 - k * 20, 520 - k * 90, 5 + k * (10 + this.mood * 6), 0, Math.PI * 2); ctx.fill();
      }
      A.finish(ctx);
    },
    drawUI(c) {
      // ardoise de l'offre
      c.save();
      c.fillStyle = '#2A2E2C';
      c.beginPath(); c.roundRect(760, 150, 440, 120, 8); c.fill();
      c.strokeStyle = '#6E5640'; c.lineWidth = 8; c.stroke();
      ui.text(c, 'Offre de M. Thornbury', 790, 192, { size: 20, kind: 'hand', color: 'rgba(232,223,204,0.7)' });
      ui.text(c, U.money(this.offer), 790, 248, { size: 52, kind: 'hand', color: '#F0EBDD' });
      const moodTxt = ['Il tire sur sa pipe, tranquille.', 'Il tapote sa pipe sur la caisse.', 'Il range sa balance à moitié.'][this.mood];
      ui.text(c, moodTxt, 1180, 248, { size: 17, italic: true, align: 'right', color: this.mood === 2 ? '#E9A07A' : '#BFB4A0' });
      c.restore();
      // réplique
      c.fillStyle = 'rgba(18,14,12,0.88)';
      c.beginPath(); c.roundRect(70, 120, 640, 120, 8); c.fill();
      ui.caps(c, 'M. Thornbury', 96, 152, { size: 14, color: G.WHO.thornbury.color });
      ui.text(c, `« ${this.line} »`, 96, 188, { size: 23, italic: true, maxW: 590, lineH: 30 });
      if (this.phase === 'talk') this.buttons().forEach((b) => ui.button(c, b.r, b.t, { size: 21, align: 'left', key: b.key }));
      ui.text(c, `${this.roots.length} racine${this.roots.length > 1 ? 's' : ''} sur la balance`, 470, 600, { size: 16, italic: true, align: 'center', shadow: true });
      ui.drawHud(c);
    },
  });

  G.DEV = G.DEV || {};
  G.DEV.haggle = () => G.play(G.Scenes.haggle({ roots: [{ quality: 0.9 }, { quality: 0.75 }, { quality: 0.5 }] }));
})();

// ---- src/scenes/applebutter.js
'use strict';
// Mini-jeu « Touiller en rythme » : la nuit du beurre de pommes chez les Napier.
// Wes joue le reel, Henry touille la bassine de cuivre sur le temps.
// Un essai, puis trois couplets de 32 temps (96, 112 puis 128 bpm).
// Contrôles : clic, toucher ou Espace quand le cercle touche la palette.
// Horloge : celle du Web Audio (handle.timeOf comparé à ctx.currentTime, latence
// de sortie compensée) ; repli sur le temps de jeu quand il n'y a pas de son.
(function () {
  const G = window.G, U = G.U, I = G.input, ui = G.ui, P = G.PAL;

  // ------------------------------------------------------------------ réglages
  const WIN_PERFECT = 0.07;   // ± secondes
  const WIN_GOOD = 0.14;
  const WIN_EARLY = 0.22;     // au-delà, l'appui ne vise aucune note
  const INPUT_LAG = 0.008;    // l'appui n'est lu qu'à l'image suivante
  const COUNT_IN = 2;         // « Un, deux… »
  const GROUND = 612;
  const KET = { x: 600, rimY: 528, rx: 92, ry: 20, depth: 54 };
  const SURF = { x: KET.x, y: KET.rimY + 5, rx: KET.rx - 11, ry: KET.ry - 6 };
  const EIGHT = { ax: 42, ay: 18 };             // amplitude du huit dans la bassine
  const STEM = 40;                              // pale verticale visible au-dessus du beurre
  const TARGET = { x: KET.x, y: SURF.y - 16, r: 21, r0: 110 };
  const SPOT = { henry: 416, nora: 322, near: 382 };
  const FEET = { front: 612, back: 600 };
  const SIL = '#110C0A';                        // silhouettes à contre-jour du feu

  const range = (a, b, s = 1) => { const o = []; for (let v = a; v <= b + 1e-9; v += s) o.push(v); return o; };
  // Couplet 1 : un temps sur deux. Couplet 2 : chaque temps. Couplet 3 : chaque temps
  // et quelques contretemps (jamais plus d'une croche isolée de suite).
  const COUPLETS = [
    { bpm: 96, beats: range(0, 30, 2), name: 'Premier couplet' },
    { bpm: 112, beats: range(0, 30, 1), name: 'Deuxième couplet' },
    { bpm: 128, beats: range(0, 30, 1).concat([7.5, 15.5, 19.5, 21.5, 23.5, 25.5, 27.5]).sort((a, b) => a - b), name: 'Dernier couplet' },
  ];
  const TRIAL = { bpm: 90, beats: [0, 2, 4, 6], end: 8 };

  // Wes s'accorde : doubles cordes à vide, une basse à la guitare.
  const trialDef = () => {
    const A = G.audio;
    return {
      bpm: TRIAL.bpm, len: 9, vol: 0.85, loop: false,
      tracks: [
        { inst: 'fiddle', vol: 0.075, notes: A.seq('A3+E4:2 D4+A4:2 A3+E4:2 D4+A4:2') },
        { inst: 'guitar', vol: 0.45, notes: [[0, A.midi('D3'), 1], [2, A.midi('A2'), 1], [4, A.midi('D3'), 1], [6, A.midi('A2'), 1]] },
      ],
    };
  };
  // Même chanson, sans boucle, éventuellement reprise à partir d'un temps donné.
  const fromBeat = (def, from) => ({
    bpm: def.bpm, len: Math.max(1, def.len - from), vol: def.vol, loop: false,
    tracks: def.tracks.map((tr) => ({
      inst: tr.inst, vol: tr.vol,
      notes: tr.notes.filter((n) => n[0] >= from - 1e-6).map((n) => [n[0] - from, n[1], n[2]]),
    })),
  });
  // Interpolation douce entre images clés [[temps, valeur], ...].
  const kf = (r, keys) => {
    if (r <= keys[0][0]) return keys[0][1];
    for (let i = 1; i < keys.length; i++) {
      if (r <= keys[i][0]) {
        const [a, va] = keys[i - 1], [b, vb] = keys[i];
        return U.lerp(va, vb, U.smooth((r - a) / (b - a)));
      }
    }
    return keys[keys.length - 1][1];
  };
  const mix = (c1, c2, k) => c1.map((v, i) => Math.round(U.lerp(v, c2[i], k)));
  const NUM = ['Zéro', 'Un', 'Deux', 'Trois'];

  // ------------------------------------------------------------------ décor fixe
  function drawSky(cx, w, h) {
    G.art.sky(cx, w, h, [[0, '#080B16'], [0.34, '#111830'], [0.6, '#1F2540'], [0.78, '#352B38'], [1, '#2A1D18']]);
    const mx = 1012, my = 92;
    const g = cx.createRadialGradient(mx, my, 10, mx, my, 160);
    g.addColorStop(0, 'rgba(220,214,190,0.22)');
    g.addColorStop(1, 'rgba(220,214,190,0)');
    cx.fillStyle = g;
    cx.fillRect(mx - 160, my - 160, 320, 320);
    cx.fillStyle = '#E6DEC4';
    cx.beginPath(); cx.arc(mx, my, 19, 0, Math.PI * 2); cx.fill();
    cx.fillStyle = 'rgba(160,150,128,0.35)';
    cx.beginPath(); cx.arc(mx - 6, my - 4, 5, 0, Math.PI * 2); cx.fill();
    cx.beginPath(); cx.arc(mx + 7, my + 6, 3.5, 0, Math.PI * 2); cx.fill();
  }

  function drawLand(cx, w, h) {
    const A = G.art;
    const far = A.makeRidge(51, w, 372, 28, 170);
    A.ridge(cx, far, '#1A2034', h);
    A.dots(cx, 52, 240, 0, w, (x) => [A.ridgeY(far, x) - 16, A.ridgeY(far, x) + 8], ['#1A2032', '#1F2539', '#181C2B'], 4, 9);
    const near = A.makeRidge(83, w, 446, 20, 130);
    A.ridge(cx, near, '#13151D', h);
    A.dots(cx, 84, 260, 0, w, (x) => [A.ridgeY(near, x) - 20, A.ridgeY(near, x) + 6], ['#14151B', '#1A181D', '#1E1919'], 5, 11);
    // sol de la cour
    const g = cx.createLinearGradient(0, 520, 0, h);
    g.addColorStop(0, '#1A1411');
    g.addColorStop(0.4, '#1C1510');
    g.addColorStop(1, '#0F0B09');
    cx.fillStyle = g;
    cx.beginPath();
    cx.moveTo(0, 560);
    cx.quadraticCurveTo(w * 0.5, 540, w, 566);
    cx.lineTo(w, h); cx.lineTo(0, h);
    cx.fill();
    // la maison des Napier, fenêtres allumées
    A.campHouse(cx, -24, 590, { w: 244, h: 100, stilt: 22, lit: true, smoke: false, wall: '#2A231E', roof: '#20232B', pitch: 48 });
    // grand chêne à droite
    A.tree(cx, 1222, 600, 330, '#100D0B', ['#2C1C14', '#38211A', '#23170F', '#1A120E'], 9);
    // touffes d'herbe sèche
    const rnd = U.rng(1932);
    cx.strokeStyle = '#0E0A08';
    cx.lineWidth = 2;
    for (let i = 0; i < 70; i++) {
      const x = rnd() * w, y = 622 + rnd() * 96;
      for (let k = -2; k <= 2; k++) {
        cx.beginPath(); cx.moveTo(x + k * 2, y); cx.lineTo(x + k * 4 + (rnd() - 0.5) * 4, y - 6 - rnd() * 10); cx.stroke();
      }
    }
    // table de planches avec les pots, à droite
    cx.fillStyle = '#1A130E';
    cx.fillRect(1150, 556, 116, 7);
    cx.fillRect(1156, 563, 5, 44);
    cx.fillRect(1256, 563, 5, 44);
    for (let i = 0; i < 6; i++) {
      const jx = 1160 + i * 15, jy = 556;
      cx.fillStyle = i < 4 ? '#4A2210' : 'rgba(150,140,120,0.25)';
      cx.beginPath(); cx.roundRect(jx, jy - 18, 11, 18, 2); cx.fill();
      cx.fillStyle = '#2A2420';
      cx.fillRect(jx - 1, jy - 21, 13, 3);
    }
  }

  // Les étoiles (scintillement calculé à chaque image).
  const STARS = (() => {
    const rnd = U.rng(714);
    const out = [];
    for (let i = 0; i < 150; i++) {
      const x = rnd() * G.W, y = rnd() * rnd() * 380;
      if (Math.hypot(x - 1012, y - 92) < 40) continue;
      out.push({ x, y, s: 0.6 + rnd() * 1.4, p: rnd() * 6.28, f: 0.6 + rnd() * 2 });
    }
    return out;
  })();

  // ------------------------------------------------------------------ scène
  G.Scenes.applebutter = (opts = {}) => G.makeScene({
    enter() {
      G.audio.amb(['fire', 'night']);
      this.state = 'intro';
      this.seg = null;
      this.couplet = -1;
      this.stats = { perfects: 0, goods: 0, misses: 0, total: COUPLETS.reduce((s, c) => s + c.beats.length, 0) };
      this.trialHits = 0;
      this.gauge = 0;
      this.gaugeShown = 0;
      this.burned = false;
      this.streak = 0;
      this.take = null;
      this.ph = 0;
      this.stroke = null;
      this.jolt = 0;
      this.pops = [];
      this.sparks = [];
      this.smoke = [];
      this.bubbles = [];
      this.ripples = [];
      this.msg = null;
      this.says = null;
      this.mbeat = 0;
      this.groove = 0;
      this.lastSfx = -1;
      this.lastReal = performance.now();
      this.hiccup = false;
      this.demoN = 0;
      this.pos = { henry: { x: SPOT.henry, foot: FEET.front, phase: 0, walk: false }, nora: { x: SPOT.nora, foot: FEET.back, phase: 0, walk: false } };
      this.heads = {};
      this.result = null;
      this.waiter = null;
      this.flow().catch((err) => { console.error(err); G.fatal = String(err && err.stack || err); });
    },

    exit() {
      if (this.seg && this.seg.clk && this.seg.clk.handle) this.seg.clk.handle.stop(0.3);
    },

    // -------------------------------------------------------------- déroulé
    async flow() {
      await this.waitPress(0.4);
      G.audio.sfx('click');
      // Essai : Wes s'accorde, Henry touille quatre fois.
      for (let k = 0; k < 3; k++) {
        this.state = 'trial';
        this.trialHits = 0;
        await this.playSeg({ kind: 'trial', bpm: TRIAL.bpm, beats: TRIAL.beats, end: TRIAL.end, def: trialDef });
        const ok = this.trialHits >= 2;
        this.state = 'trialMsg';
        this.showMsg(ok ? 'C\'est ça. Wes attaque le reel !' : k < 2 ? 'Pas tout à fait. Encore une fois.' : 'Ça viendra en touillant. On y va !', 1.9);
        await G.wait(1.9);
        if (ok) break;
      }
      // Trois couplets, de plus en plus vite.
      for (let i = 0; i < COUPLETS.length; i++) {
        const c = COUPLETS[i];
        this.couplet = i;
        this.state = 'couplet';
        await this.playSeg({ kind: 'couplet', bpm: c.bpm, beats: c.beats, end: 32, def: () => G.audio.reel(c.bpm), index: i });
        if (i < COUPLETS.length - 1) {
          this.state = 'interlude';
          this.gauge = Math.min(this.gauge, 0.5);
          if (opts.interlude) await opts.interlude(i);
          await G.card('Plus vite !', i === 0 ? 'Wes accélère.' : 'Wes donne tout ce qu\'il a.', {
            dur: 1.9, bgAlpha: 0.55, size: 60, eyebrow: COUPLETS[i + 1].name,
          });
        }
      }
      this.state = 'end';
      this.result = this.computeResult();
      this.endT = this.t;
      await this.waitPress(1.2);
      G.audio.sfx('click');
      this.finish(this.result);
    },

    // Attend un appui (clic, toucher ou Espace) hors dialogue.
    waitPress(guard) {
      return new Promise((res) => { this.waiter = { res, t0: this.t + guard }; });
    },

    showMsg(text, dur) { this.msg = { text, t0: this.t, dur }; },

    computeResult() {
      const s = this.stats;
      const score = U.clamp((s.perfects + 0.6 * s.goods) / Math.max(1, s.total), 0, 1);
      let jars = score >= 0.75 ? 3 : score >= 0.45 ? 2 : 1;
      if (this.burned) jars = Math.min(jars, 2);
      return { score: Math.round(score * 1000) / 1000, perfects: s.perfects, goods: s.goods, misses: s.misses, jars, burned: this.burned };
    },

    // -------------------------------------------------------------- horloge
    // Une « portion » de musique : l'essai ou un couplet, avec sa grille de notes.
    playSeg(spec) {
      return new Promise((resolve) => {
        const seg = Object.assign({}, spec, {
          spb: 60 / spec.bpm,
          notes: spec.beats.map((b) => ({ b, owner: 'henry', res: null })),
          resolve, paused: false, done: false, beat: -COUNT_IN, clk: null,
        });
        this.seg = seg;
        this.take = null;
        this.startClock(seg, 0);
      });
    },

    startClock(seg, from) {
      const ac = G.audio.ctx;
      const lead = COUNT_IN * seg.spb + 0.2;
      const clk = { from, spb: seg.spb, audio: false, handle: null, vt: 0, t0: lead, lat: 0 };
      if (ac && ac.state === 'running') {
        const h = G.audio.song(fromBeat(seg.def(), from), { delay: lead, fadeIn: 0.25, xfade: 0.2 });
        if (h) {
          clk.audio = true;
          clk.handle = h;
          clk.lat = U.clamp(ac.outputLatency || ac.baseLatency || 0, 0, 0.15);
          // Wes tape du pied : « Un, deux… »
          for (let k = COUNT_IN; k >= 1; k--) {
            const d = h.timeOf(-k) - ac.currentTime;
            if (d > -0.01) G.audio.sfx('tick', Math.max(0, d));
          }
        }
      }
      seg.clk = clk;
      seg.paused = false;
      seg.beat = from - COUNT_IN;
    },
    now(clk) { return clk.audio ? G.audio.ctx.currentTime - clk.lat : clk.vt; },
    timeOf(clk, b) { return clk.audio ? clk.handle.timeOf(b - clk.from) : clk.t0 + (b - clk.from) * clk.spb; },
    beatOf(clk) { return clk.from + (this.now(clk) - this.timeOf(clk, clk.from)) / clk.spb; },

    // Dialogue, onglet caché ou contexte audio suspendu : on coupe la musique
    // et on reprendra au début de la mesure de la prochaine note.
    pauseSeg(seg) {
      if (seg.clk && seg.clk.handle) seg.clk.handle.stop(0.15);
      seg.paused = true;
      seg.pauseT = G.time;
      const next = seg.notes.find((n) => !n.res);
      seg.resumeFrom = next ? Math.max(0, Math.floor(next.b / 4) * 4) : null;
    },

    endSeg(seg) {
      if (seg.done) return;
      seg.done = true;
      if (seg.clk && seg.clk.handle) seg.clk.handle.stop(seg.kind === 'trial' ? 0.5 : 1.2);
      if (this.seg === seg) this.seg = null;
      this.take = null;
      seg.resolve();
    },

    updateSeg(seg, dt) {
      if (seg.paused) {
        if (!G.blocked && G.time - seg.pauseT > 0.3) {
          if (seg.resumeFrom == null) this.endSeg(seg);
          else this.startClock(seg, seg.resumeFrom);
        }
        return;
      }
      const clk = seg.clk;
      const ac = G.audio.ctx;
      if (G.blocked || (clk.audio && (this.hiccup || !ac || ac.state !== 'running'))) { this.pauseSeg(seg); return; }
      if (!clk.audio) clk.vt += dt;
      const now = this.now(clk);
      seg.beat = this.beatOf(clk);

      // Appui du joueur : la note la plus proche dans le temps.
      if (I.confirm()) {
        const tp = now - INPUT_LAG;
        let best = null, bd = 1e9;
        for (const n of seg.notes) {
          if (n.res || n.owner !== 'henry') continue;
          const d = tp - this.timeOf(clk, n.b);
          if (Math.abs(d) < Math.abs(bd)) { best = n; bd = d; }
        }
        if (best && Math.abs(bd) <= WIN_EARLY) {
          const ad = Math.abs(bd);
          this.judge(seg, best, ad <= WIN_PERFECT ? 'perfect' : ad <= WIN_GOOD ? 'good' : 'miss');
        } else this.jolt = Math.max(this.jolt, 0.5);
      }
      // Notes passées : ratées, ou jouées par Mrs. Napier.
      for (const n of seg.notes) {
        if (n.res) continue;
        const t = this.timeOf(clk, n.b);
        if (n.owner === 'nora') {
          if (now >= t) { n.res = 'nora'; this.startStroke(this.gapAfter(seg, n)); this.burst(3); }
        } else if (n.owner === 'skip') {
          if (now >= t) n.res = 'skip';
        } else if (now > t + WIN_GOOD) this.judge(seg, n, 'miss');
      }
      // Mrs. Napier : la jauge redescend pendant qu'elle touille.
      const rel = this.takeRel();
      if (rel != null) {
        if (rel >= 2 && rel <= 10) this.gauge = Math.min(this.gauge, U.lerp(1, 0.25, (rel - 2) / 8));
        if (rel >= 10 && !this.take.back) {
          this.take.back = true;
          this.says = { who: 'nora', text: 'À toi.', t0: this.t, dur: 1.6 };
        }
      }
      if (seg.beat >= seg.end && seg.notes.every((n) => n.res)) this.endSeg(seg);
    },

    gapAfter(seg, n) {
      const next = seg.notes.find((m) => m.b > n.b + 1e-6);
      return (next ? next.b - n.b : 2) * seg.spb;
    },

    judge(seg, n, kind) {
      n.res = kind;
      const trial = seg.kind === 'trial';
      if (kind === 'miss') {
        this.streak = 0;
        this.pop('Raté', '#D58E66');
        this.sfx('fail', 0.17);
        this.jolt = 1;
        if (!trial) {
          this.stats.misses++;
          this.gauge = Math.min(1, this.gauge + 0.2);
          G.audio.sfx('burn', 0.06);
          this.puff(this.gauge);
          if (this.gauge >= 1 && !this.takeActive()) this.startTake(seg);
        }
        return;
      }
      if (trial) this.trialHits++;
      else {
        if (kind === 'perfect') this.stats.perfects++; else this.stats.goods++;
        this.gauge = Math.max(0, this.gauge - (kind === 'perfect' ? 0.09 : 0.05));
      }
      this.streak++;
      this.pop(kind === 'perfect' ? 'Parfait' : 'Bien', kind === 'perfect' ? P.rim : P.paper);
      G.audio.sfx(kind, 0, 0.25); // discret, à chaque réussite, sous la musique
      this.startStroke(this.gapAfter(seg, n));
      this.burst(kind === 'perfect' ? 6 : 3);
    },

    // Bruitages espacés : à 128 bpm, un arpège de banjo à chaque temps
    // couvrirait le violon. Les réussites rapprochées restent muettes (le
    // jugement s'affiche quand même) ; un raté s'entend toujours.
    sfx(name, gap) {
      if (G.time - this.lastSfx < gap) return;
      this.lastSfx = G.time;
      G.audio.sfx(name);
    },

    // « Donne, petit. Regarde. » : Mrs. Napier prend la palette deux mesures.
    startTake(seg) {
      const b0 = seg.beat;
      this.take = { seg, b0, back: false };
      this.burned = true;
      this.streak = 0;
      for (const n of seg.notes) {
        if (n.res) continue;
        const r = n.b - b0;
        if (r < 2 || (r >= 10 && r < 11.5)) n.owner = 'skip';
        else if (r < 10) n.owner = 'nora';
      }
      this.says = { who: 'nora', text: 'Donne, petit. Regarde.', t0: this.t, dur: 2.6 };
    },
    takeRel() { return this.take && this.seg === this.take.seg ? this.seg.beat - this.take.b0 : null; },
    takeActive() { const r = this.takeRel(); return r != null && r < 12; },

    // -------------------------------------------------------------- palette
    // Un huit complet si on a le temps, sinon une seule boucle.
    startStroke(gap) {
      const full = gap >= 0.42;
      const base = Math.round(this.ph * 2) / 2;
      this.stroke = { from: this.ph, to: base + (full ? 1 : 0.5), t0: G.time, dur: U.clamp(gap * 0.88, 0.16, full ? 1.0 : 0.45) };
    },
    paddle() {
      const th = this.ph * Math.PI * 2;
      const idle = Math.sin(G.time * 1.3) * 1.5;
      const jolt = this.jolt * Math.sin(G.time * 70) * 3;
      const ex = EIGHT.ax * Math.sin(th) + idle + jolt;
      const ey = EIGHT.ay * Math.sin(th) * Math.cos(th);
      return { ex, ey, sx: SURF.x + ex, sy: SURF.y + ey, jx: SURF.x + ex, jy: SURF.y + ey - STEM };
    },
    // Épaule d'une silhouette debout (même calcul que G.art.person).
    shoulder(id, x, foot, dir, lean) {
      const h = G.CHARS[id].h;
      const hipY = -h * 0.46, tl = h * 0.37;
      const nx = Math.sin(lean) * tl, ny = hipY - Math.cos(lean) * tl;
      return { x: x + (nx + Math.sin(lean) * h * 0.02) * dir, y: foot + ny + h * 0.1, L: h * 0.35 };
    },
    // Le manche part de la pale et passe dans les deux mains.
    grips(sh, J, dir) {
      const Q = { x: sh.x + dir * sh.L * 0.3, y: sh.y + sh.L * 0.78 };
      let ux = Q.x - J.x, uy = Q.y - J.y;
      const len = Math.hypot(ux, uy) || 1;
      ux /= len; uy /= len;
      const R = sh.L * 0.97;
      const wx = J.x - sh.x, wy = J.y - sh.y;
      const b = ux * wx + uy * wy, c = wx * wx + wy * wy - R * R;
      const disc = b * b - c;
      const r = disc > 0 ? Math.sqrt(disc) : 0;
      const s1 = -b - r, s2 = -b + r;
      const front = { x: J.x + ux * s1, y: J.y + uy * s1 };
      const back = { x: J.x + ux * s2, y: J.y + uy * s2 };
      const T = { x: J.x + ux * (s2 + 20), y: J.y + uy * (s2 + 20) };
      const ang = (p) => Math.atan2((p.x - sh.x) * dir, p.y - sh.y);
      return { arms: [ang(back), ang(front)], T };
    },

    // -------------------------------------------------------------- particules
    pop(text, color) { this.pops = [{ text, color, t0: this.t }]; },
    burst(n) {
      for (let i = 0; i < n; i++) this.spark(true);
    },
    spark(bright) {
      const side = Math.random() < 0.5 ? -1 : 1;
      this.sparks.push({
        x: KET.x + side * U.rand(60, 104), y: KET.rimY + U.rand(10, 40),
        vx: side * U.rand(4, 26) + U.rand(-8, 8), vy: -U.rand(50, bright ? 170 : 120),
        life: U.rand(1.0, bright ? 2.6 : 2.0), age: 0, s: U.rand(0.9, bright ? 2.4 : 1.8), w: U.rand(0, 6.28),
      });
    },
    puff(g) {
      for (let i = 0; i < 5; i++) this.smoke.push(this.smokeP(Math.min(1, g + 0.35), true));
    },
    smokeP(g, big) {
      const c = mix([214, 204, 188], [30, 24, 20], Math.pow(g, 0.7));
      return {
        x: SURF.x + U.rand(-48, 48), y: SURF.y - 4, vx: U.rand(-5, 5) + 3, vy: -U.rand(16, 32),
        r: U.rand(12, big ? 28 : 18), age: 0, life: U.rand(2.4, 4), c, a: U.lerp(0.2, 0.66, g),
      };
    },

    // -------------------------------------------------------------- mise à jour
    update(dt) {
      const real = performance.now();
      this.hiccup = real - this.lastReal > 400;
      this.lastReal = real;

      // Appui attendu (écran-consigne, écran de fin).
      if (this.waiter && !G.blocked && this.t >= this.waiter.t0 && I.confirm()) {
        I.consume();
        const w = this.waiter;
        this.waiter = null;
        w.res();
      }
      if (this.seg) this.updateSeg(this.seg, dt);

      // Temps musical pour animer la compagnie.
      const playing = this.seg && !this.seg.paused && this.seg.beat >= this.seg.clk.from - 0.05;
      if (playing) this.mbeat = this.seg.beat;
      else this.mbeat += dt * 0.6;
      this.groove = U.lerp(this.groove, playing ? 1 : 0, 1 - Math.pow(0.02, dt));

      // Démonstration sur l'écran-consigne : la palette touille seule.
      if (this.state === 'intro') {
        const n = Math.floor((this.t - 0.4) / 1.5);
        if (n > this.demoN && this.t > 0.4) { this.demoN = n; this.startStroke(1.3); }
      }

      // Palette
      if (this.stroke) {
        const s = this.stroke;
        const k = U.clamp((G.time - s.t0) / s.dur, 0, 1);
        this.ph = U.lerp(s.from, s.to, U.smooth(k));
        if (k >= 1) { this.ph = s.to - Math.floor(s.to); this.stroke = null; }
        if (Math.random() < dt * 22) { const pd = this.paddle(); this.ripples.push({ x: pd.sx, y: pd.sy, age: 0 }); }
      }
      this.jolt = Math.max(0, this.jolt - dt * 3);
      this.gaugeShown = U.lerp(this.gaugeShown, this.gauge, 1 - Math.pow(0.01, dt));

      // Henry et Mrs. Napier (passage de la palette).
      const rel = this.takeRel();
      const r = rel == null ? -1 : rel;
      const tg = {
        henry: { x: kf(r, [[1.6, SPOT.henry], [2.6, SPOT.nora + 8], [10, SPOT.nora + 8], [10.6, SPOT.near - 10], [11.2, SPOT.henry]]),
          foot: kf(r, [[1.6, FEET.front], [2.6, FEET.back], [10, FEET.back], [11.2, FEET.front]]) },
        nora: { x: kf(r, [[0, SPOT.nora], [1.6, SPOT.near], [2.2, SPOT.henry], [10.6, SPOT.henry], [11.8, SPOT.nora]]),
          foot: kf(r, [[1.6, FEET.back], [2.2, FEET.front], [10.6, FEET.front], [11.8, FEET.back]]) },
      };
      if (rel == null) { tg.henry = { x: SPOT.henry, foot: FEET.front }; tg.nora = { x: SPOT.nora, foot: FEET.back }; }
      for (const id of ['henry', 'nora']) {
        const p = this.pos[id];
        // Pendant la reprise, on suit les images clés ; sinon chacun regagne sa place.
        let nx = tg[id].x, nf = tg[id].foot;
        if (rel == null) {
          const step = 140 * dt;
          nx = p.x + U.clamp(nx - p.x, -step, step);
          nf = p.foot + U.clamp(nf - p.foot, -step * 0.2, step * 0.2);
        }
        const dx = nx - p.x;
        p.walk = Math.abs(dx) > 0.25;
        p.phase = (p.phase + Math.abs(dx) / 120) % 1;
        p.x = nx;
        p.foot = nf;
      }
      if (rel != null) this.stirrer = rel >= 1.9 && rel < 10.8 ? 'nora' : 'henry';
      else this.stirrer = Math.abs(this.pos.nora.x - SPOT.henry) < Math.abs(this.pos.henry.x - SPOT.henry) ? 'nora' : 'henry';

      // Particules
      const g = this.gaugeShown;
      if (Math.random() < dt * (16 + 10 * this.groove)) this.spark(false);
      if (Math.random() < dt * (5 + 16 * g)) this.smoke.push(this.smokeP(g, g > 0.6));
      if (Math.random() < dt * (3 + 4 * g)) {
        const a = Math.random() * Math.PI * 2, d = Math.sqrt(Math.random()) * 0.8;
        this.bubbles.push({ x: SURF.x + Math.cos(a) * SURF.rx * d, y: SURF.y + Math.sin(a) * SURF.ry * d, age: 0, life: U.rand(0.5, 1.1), r: U.rand(2.5, 5) });
      }
      for (const s of this.sparks) {
        s.age += dt;
        s.x += (s.vx + Math.sin(s.w + s.age * 5) * 14) * dt;
        s.y += s.vy * dt;
        s.vy *= 1 - dt * 0.35;
      }
      for (const s of this.smoke) { s.age += dt; s.x += s.vx * dt; s.y += s.vy * dt; s.r += dt * 14; }
      for (const b of this.bubbles) b.age += dt;
      for (const rp of this.ripples) rp.age += dt;
      const alive = (arr) => arr.filter((p) => p.age < (p.life || 0.7));
      this.sparks = alive(this.sparks);
      this.smoke = alive(this.smoke);
      this.bubbles = alive(this.bubbles);
      this.ripples = alive(this.ripples);
      this.pops = this.pops.filter((p) => this.t - p.t0 < 0.8);
      if (this.says && this.t - this.says.t0 > this.says.dur) this.says = null;
      if (this.msg && this.t - this.msg.t0 > this.msg.dur) this.msg = null;
    },

    // -------------------------------------------------------------- dessin
    draw(ctx) {
      const A = G.art;
      const t = G.time;
      const fl = 0.85 + 0.1 * Math.sin(t * 7.3) + 0.05 * Math.sin(t * 17.1 + 1);

      A.blit(ctx, A.cached('ab-sky', G.W, G.H, drawSky), 0, 0);
      for (const s of STARS) {
        ctx.globalAlpha = 0.35 + 0.45 * (0.5 + 0.5 * Math.sin(t * s.f + s.p));
        ctx.fillStyle = '#E8E2CF';
        ctx.fillRect(s.x, s.y, s.s, s.s);
      }
      ctx.globalAlpha = 1;
      A.blit(ctx, A.cached('ab-land', G.W, G.H, drawLand), 0, 0);

      // Lueurs : fenêtres, lanternes, et surtout le feu.
      A.glow(ctx, 18, 518, 70, '#F2B65A', 0.35);
      A.glow(ctx, 150, 518, 70, '#F2B65A', 0.35);
      A.glow(ctx, 1252, 548, 90, P.lamp, 0.45);
      A.glow(ctx, KET.x, 590, 560, '#E07A2E', 0.34 * fl);
      A.glow(ctx, KET.x, 600, 260, '#FFA850', 0.32 * fl);
      // lanterne posée sur la table
      ctx.fillStyle = '#151210';
      ctx.fillRect(1243, 540, 14, 4);
      ctx.fillStyle = P.lamp;
      ctx.beginPath(); ctx.ellipse(1250, 550, 6, 8, 0, 0, Math.PI * 2); ctx.fill();

      // La compagnie
      const pad = this.paddle();
      const cast = this.cast(pad);
      for (const c of cast) this.shadow(ctx, c);
      const back = cast.filter((c) => c.foot < 607).sort((a, b) => a.foot - b.foot);
      const front = cast.filter((c) => c.foot >= 607).sort((a, b) => a.foot - b.foot);
      for (const c of back) this.drawChar(ctx, c);
      this.drawFireAndKettle(ctx, pad, fl);
      for (const c of front) this.drawChar(ctx, c);
      this.drawHandle(ctx, pad);

      // Étincelles et fumée
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (const s of this.sparks) {
        const k = s.age / s.life;
        ctx.globalAlpha = (1 - k) * (0.6 + 0.4 * Math.sin(s.age * 30 + s.w));
        ctx.fillStyle = k < 0.4 ? '#FFD27A' : '#F08A3A';
        ctx.fillRect(s.x, s.y, s.s, s.s);
      }
      ctx.restore();
      for (const s of this.smoke) {
        const k = s.age / s.life;
        const a = s.a * Math.min(1, k * 4) * (1 - k);
        const gr = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r);
        gr.addColorStop(0, `rgba(${s.c[0]},${s.c[1]},${s.c[2]},${a.toFixed(3)})`);
        gr.addColorStop(1, `rgba(${s.c[0]},${s.c[1]},${s.c[2]},0)`);
        ctx.fillStyle = gr;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
      }
      // voile chaud sur toute la cour
      A.glow(ctx, KET.x, 560, 420, '#E58A3A', 0.07 * fl);
      A.finish(ctx);
    },

    // Positions et poses de chacun.
    cast(pad) {
      const g = this.groove, mb = this.mbeat;
      const hop = (o) => Math.abs(Math.sin(Math.PI * (mb + o))) * g;
      const clap = Math.abs(Math.sin(Math.PI * mb)) * g;
      const bow = Math.sin(Math.PI * mb);
      const list = [
        { id: 'abner', x: 92, foot: 596, o: { dir: 1, carry: 'lantern', arms: [0.02, 0.62], lean: 0.035 * Math.sin(Math.PI * mb) * g, seed: 1 } },
        { id: 'hattie', x: 196, foot: 604, o: { dir: 1, pose: 'sit', seatH: 30, carry: 'pipe', seed: 2 }, stump: true },
        { id: 'napierKid', x: 770, foot: 615 - hop(0) * 8, o: { dir: -1, arms: [-0.3 - hop(0) * 1.6, 0.3 + hop(0) * 2.2], seed: 5 } },
        { id: 'napierGirl', x: 842, foot: 609 - hop(0.5) * 6, o: { dir: -1, arms: [U.lerp(0.1, 1.9 - 0.45 * clap, g), U.lerp(0.25, 1.9 + 0.3 * clap, g)], seed: 6 } },
        { id: 'ida', x: 962, foot: 603, o: { dir: -1, arms: [U.lerp(0.1, 1.95 - 0.4 * clap, g), U.lerp(0.3, 1.95 + 0.25 * clap, g)], lean: 0.04 * g, seed: 3 } },
        { id: 'wes', x: 1104, foot: 606, o: { dir: -1, carry: 'fiddle', arms: [U.lerp(0.25, 1.3 + 0.38 * bow, g), U.lerp(0.5, 2.05, g)], lean: -0.05 * g + 0.03 * Math.sin(Math.PI * mb * 0.5) * g, seed: 4 } },
      ];
      // Henry et Mrs. Napier : celui qui touille tient la palette.
      this.grip = null;
      for (const id of ['henry', 'nora']) {
        const p = this.pos[id];
        const o = { dir: 1, seed: id === 'henry' ? 7 : 8, rim: id === 'henry' };
        if (p.walk) { o.pose = 'walk'; o.phase = p.phase; }
        if (this.stirrer === id) {
          o.lean = 0.16 + 0.06 * (pad.ex / EIGHT.ax);
          o.pose = 'stand';
          const sh = this.shoulder(id, p.x, p.foot, 1, o.lean);
          const gr = this.grips(sh, { x: pad.jx, y: pad.jy }, 1);
          o.arms = gr.arms;
          this.grip = gr;
        }
        list.push({ id, x: p.x, foot: p.foot, o });
      }
      if (!this.grip) {
        // Personne ne tient la palette (fin) : elle reste appuyée sur le bord.
        this.grip = { T: { x: pad.jx - 190, y: pad.jy - 30 } };
      }
      return list;
    },

    shadow(ctx, c) {
      const away = c.x < KET.x ? -1 : 1;
      const d = Math.abs(c.x - KET.x);
      const k = U.clamp(1 - d / 900, 0.25, 1);
      ctx.fillStyle = `rgba(6,4,3,${(0.45 * k).toFixed(3)})`;
      ctx.beginPath();
      ctx.ellipse(c.x + away * 26, c.foot + 1, 34 + 14 * k, 5, 0, 0, Math.PI * 2);
      ctx.fill();
    },

    drawChar(ctx, c) {
      if (c.stump) {
        ctx.fillStyle = '#211812';
        ctx.fillRect(c.x - 10, c.foot - 30, 26, 30);
        ctx.fillStyle = '#3A2A1C';
        ctx.beginPath(); ctx.ellipse(c.x + 3, c.foot - 30, 13, 4, 0, 0, Math.PI * 2); ctx.fill();
      }
      const r = G.art.char(ctx, c.id, c.x, c.foot, Object.assign({ color: SIL }, c.o));
      this.heads[c.id] = r.head;
    },

    flame(ctx, x, base, w, h, sway) {
      ctx.beginPath();
      ctx.moveTo(x - w, base);
      ctx.quadraticCurveTo(x - w * 0.9, base - h * 0.55, x + sway, base - h);
      ctx.quadraticCurveTo(x + w * 0.9, base - h * 0.55, x + w, base);
      ctx.closePath();
      ctx.fill();
    },

    drawFireAndKettle(ctx, pad, fl) {
      const { x, rimY, rx, ry, depth } = KET;
      const t = G.time;
      const base = GROUND - 6;
      // pieds du trépied
      ctx.strokeStyle = '#120F0D';
      ctx.lineCap = 'round';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(x + 6, rimY + depth - 4); ctx.lineTo(x + 10, GROUND - 14);
      ctx.stroke();
      // flammes de fond
      const tongues = [-70, -48, -26, -6, 14, 34, 56, 74];
      const layers = [['#B8441A', 1, 0.9], ['#EA7A2A', 0.68, 0.95], ['#FFC861', 0.36, 1]];
      for (const [col, sc, al] of layers) {
        ctx.fillStyle = col;
        ctx.globalAlpha = al;
        tongues.forEach((ox, i) => {
          const hh = (34 + (i % 3) * 8) * (0.75 + 0.2 * Math.sin(t * 7 + i * 1.7) + 0.12 * Math.sin(t * 13.3 + i * 2.3));
          this.flame(ctx, x + ox, base, 14 * sc + 4, hh * (0.4 + 0.6 * sc) + 6, Math.sin(t * 5 + i) * 5);
        });
      }
      ctx.globalAlpha = 1;
      // bûches
      ctx.save();
      for (const [lx, ly, a, len] of [[x - 34, base + 2, -0.16, 128], [x + 30, base + 4, 0.19, 120]]) {
        ctx.save();
        ctx.translate(lx, ly); ctx.rotate(a);
        ctx.fillStyle = '#24170F';
        ctx.fillRect(-len / 2, -7, len, 13);
        ctx.fillStyle = `rgba(240,120,40,${(0.55 * fl).toFixed(3)})`;
        ctx.fillRect(-len / 2 + 14, -7, len - 28, 2.5);
        ctx.restore();
      }
      ctx.restore();

      // corps de la bassine (cuivre), éclairé par en dessous
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(x, rimY, rx, depth, 0, 0, Math.PI);
      ctx.closePath();
      const g = ctx.createLinearGradient(0, rimY, 0, rimY + depth);
      g.addColorStop(0, '#6E3519');
      g.addColorStop(0.5, '#5A2913');
      g.addColorStop(1, '#B85A26');
      ctx.fillStyle = g;
      ctx.fill();
      ctx.clip();
      const sh = ctx.createLinearGradient(x - rx, 0, x + rx, 0);
      sh.addColorStop(0, 'rgba(0,0,0,0.35)');
      sh.addColorStop(0.3, 'rgba(255,170,90,0.12)');
      sh.addColorStop(0.42, 'rgba(255,190,120,0.22)');
      sh.addColorStop(0.55, 'rgba(0,0,0,0)');
      sh.addColorStop(1, 'rgba(0,0,0,0.4)');
      ctx.fillStyle = sh;
      ctx.fillRect(x - rx, rimY, rx * 2, depth + 2);
      G.art.glow(ctx, x, rimY + depth + 6, 70, '#FF9A40', 0.5 * fl);
      ctx.restore();
      // anneau et pieds avant du trépied
      ctx.strokeStyle = '#120F0D';
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.ellipse(x, rimY + 18, rx * 0.93, ry * 0.9, 0, 0.05, Math.PI - 0.05); ctx.stroke();
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(x - rx * 0.86, rimY + 24); ctx.lineTo(x - rx - 16, GROUND - 2);
      ctx.moveTo(x + rx * 0.86, rimY + 24); ctx.lineTo(x + rx + 16, GROUND - 2);
      ctx.stroke();
      // petites flammes devant, qui lèchent le fond
      ctx.fillStyle = '#EA7A2A';
      ctx.globalAlpha = 0.85;
      [-30, 2, 28].forEach((ox, i) => this.flame(ctx, x + ox, base + 2, 9, 18 + 8 * Math.sin(t * 9 + i * 2), Math.sin(t * 6 + i) * 3));
      ctx.fillStyle = '#FFC861';
      [-30, 2, 28].forEach((ox, i) => this.flame(ctx, x + ox, base + 2, 4, 9 + 5 * Math.sin(t * 9 + i * 2), Math.sin(t * 6 + i) * 2));
      ctx.globalAlpha = 1;

      // intérieur et beurre
      ctx.fillStyle = '#26130A';
      ctx.beginPath(); ctx.ellipse(x, rimY, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
      const gs = this.gaugeShown;
      const cIn = mix([128, 60, 24], [70, 32, 14], gs), cOut = mix([74, 33, 13], [36, 17, 8], gs);
      const bg = ctx.createRadialGradient(SURF.x - 10, SURF.y - 3, 4, SURF.x, SURF.y, SURF.rx);
      bg.addColorStop(0, `rgb(${cIn})`);
      bg.addColorStop(1, `rgb(${cOut})`);
      ctx.save();
      ctx.beginPath(); ctx.ellipse(SURF.x, SURF.y, SURF.rx, SURF.ry, 0, 0, Math.PI * 2);
      ctx.fillStyle = bg;
      ctx.fill();
      ctx.clip();
      // reflet de lune et de feu sur la pâte
      ctx.fillStyle = 'rgba(255,190,120,0.10)';
      ctx.beginPath(); ctx.ellipse(SURF.x - 24, SURF.y - 4, 30, 4, -0.05, 0, Math.PI * 2); ctx.fill();
      // bulles
      for (const b of this.bubbles) {
        const k = b.age / b.life;
        if (k < 0.8) {
          const rr = b.r * U.easeOut(k / 0.8);
          ctx.fillStyle = 'rgba(40,18,8,0.55)';
          ctx.beginPath(); ctx.ellipse(b.x, b.y, rr, rr * 0.6, 0, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = 'rgba(210,130,70,0.35)';
          ctx.beginPath(); ctx.ellipse(b.x - rr * 0.3, b.y - rr * 0.25, rr * 0.35, rr * 0.2, 0, 0, Math.PI * 2); ctx.fill();
        } else {
          const q = (k - 0.8) / 0.2;
          ctx.strokeStyle = `rgba(200,120,60,${(0.4 * (1 - q)).toFixed(3)})`;
          ctx.lineWidth = 1;
          ctx.beginPath(); ctx.ellipse(b.x, b.y, b.r * (1 + q), b.r * 0.6 * (1 + q), 0, 0, Math.PI * 2); ctx.stroke();
        }
      }
      // remous laissés par la palette
      for (const rp of this.ripples) {
        const k = rp.age / 0.7;
        ctx.strokeStyle = `rgba(190,110,55,${(0.45 * (1 - k)).toFixed(3)})`;
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.ellipse(rp.x, rp.y, 5 + k * 16, (5 + k * 16) * 0.3, 0, 0, Math.PI * 2); ctx.stroke();
      }
      // taches qui attachent
      if (gs > 0.3) {
        ctx.fillStyle = `rgba(12,6,3,${((gs - 0.3) * 0.7).toFixed(3)})`;
        for (const [ox, oy, rr] of [[-50, 4, 12], [38, -3, 10], [-12, 7, 9], [58, 5, 7]]) {
          ctx.beginPath(); ctx.ellipse(SURF.x + ox, SURF.y + oy, rr, rr * 0.35, 0, 0, Math.PI * 2); ctx.fill();
        }
      }
      ctx.restore();
      // bord arrière
      ctx.strokeStyle = '#8E4C25';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(x, rimY, rx, ry, 0, Math.PI, Math.PI * 2); ctx.stroke();

      // pale verticale qui plonge dans le beurre
      ctx.lineCap = 'butt';
      ctx.strokeStyle = '#3A2918';
      ctx.lineWidth = 7;
      ctx.beginPath(); ctx.moveTo(pad.jx, pad.jy); ctx.lineTo(pad.sx, pad.sy); ctx.stroke();
      ctx.strokeStyle = 'rgba(200,120,60,0.55)';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(pad.jx + 3, pad.jy + 2); ctx.lineTo(pad.sx + 3, pad.sy); ctx.stroke();
      ctx.fillStyle = 'rgba(60,26,10,0.9)';
      ctx.beginPath(); ctx.ellipse(pad.sx, pad.sy, 8, 2.6, 0, 0, Math.PI * 2); ctx.fill();
      ctx.lineCap = 'round';

      // bord avant, cuivre éclairé
      ctx.strokeStyle = '#C47E46';
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.ellipse(x, rimY, rx, ry, 0, 0.02, Math.PI - 0.02); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,214,150,0.35)';
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.ellipse(x, rimY - 1, rx - 1, ry - 1, 0, 0.35, 1.25); ctx.stroke();
      // anses
      ctx.strokeStyle = '#2A1A10';
      ctx.lineWidth = 3;
      for (const s of [-1, 1]) {
        ctx.beginPath(); ctx.arc(x + s * (rx + 2), rimY + 6, 7, s > 0 ? -1.2 : Math.PI - 1.9, s > 0 ? 1.9 : Math.PI + 1.2); ctx.stroke();
      }
    },

    // Le long manche, de la pale aux mains de celui qui touille.
    drawHandle(ctx, pad) {
      const T = this.grip.T;
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#33241A';
      ctx.lineWidth = 6;
      ctx.beginPath(); ctx.moveTo(T.x, T.y); ctx.lineTo(pad.jx, pad.jy); ctx.stroke();
      ctx.strokeStyle = 'rgba(214,130,64,0.5)';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(T.x + 2, T.y + 2.5); ctx.lineTo(pad.jx + 1, pad.jy + 2.5); ctx.stroke();
      ctx.fillStyle = '#2A1D14';
      ctx.beginPath(); ctx.arc(pad.jx, pad.jy, 4.5, 0, Math.PI * 2); ctx.fill();
    },

    // -------------------------------------------------------------- interface
    drawUI(uctx) {
      const seg = this.seg;
      const st = this.state;
      if (st === 'intro') this.drawIntro(uctx);
      if (seg && !seg.paused) this.drawRings(uctx, seg);
      else if (st === 'trial' || st === 'trialMsg' || st === 'couplet') this.drawTarget(uctx, 0);

      // consignes
      if (st === 'trial') {
        ui.hint(uctx, 'Essai : clique ou appuie sur Espace quand le cercle touche la palette.');
        ui.text(uctx, 'Wes accorde son violon.', G.W / 2, 84, { size: 18, italic: true, align: 'center', color: 'rgba(232,223,204,0.6)' });
      } else if (st === 'couplet' && this.couplet === 0 && seg && seg.beat < 10) {
        ui.hint(uctx, 'Clique ou appuie sur Espace quand le cercle touche la palette.');
      }
      if (seg && !seg.paused) this.drawCount(uctx, seg);
      if (this.msg) {
        const k = this.t - this.msg.t0;
        const a = Math.min(1, k * 4) * Math.min(1, (this.msg.dur - k) * 3);
        ui.text(uctx, this.msg.text, G.W / 2, 330, { size: 34, italic: true, align: 'center', base: 'middle', alpha: Math.max(0, a), shadow: true });
      }

      // jugements
      for (const p of this.pops) {
        const k = (this.t - p.t0) / 0.8;
        ui.text(uctx, p.text, TARGET.x, TARGET.y - 44 - U.easeOut(k) * 26, {
          size: p.text === 'Parfait' ? 26 : 23, italic: true, align: 'center', base: 'middle', color: p.color, alpha: 1 - k * k, shadow: true,
        });
      }

      // couplet, jauge « Ça attache », série
      if (st === 'couplet') {
        ui.caps(uctx, `Couplet ${this.couplet + 1} / 3`, 32, 42, { size: 14, color: 'rgba(232,223,204,0.62)' });
        ui.text(uctx, `${COUPLETS[this.couplet].bpm} temps à la minute`, 32, 64, { size: 16, italic: true, color: 'rgba(232,223,204,0.42)' });
        this.drawGauge(uctx);
      }

      // bulle de Mrs. Napier
      if (this.says && this.heads.nora) {
        const k = this.t - this.says.t0;
        const a = Math.min(1, k * 5) * Math.min(1, (this.says.dur - k) * 4);
        this.bubble(uctx, this.says.text, this.heads.nora.x, this.heads.nora.y - 30, Math.max(0, a));
      }
      if (st === 'end') this.drawEnd(uctx);
    },

    drawTarget(uctx, glow) {
      uctx.save();
      uctx.strokeStyle = `rgba(232,223,204,${(0.42 + 0.4 * glow).toFixed(3)})`;
      uctx.lineWidth = 2;
      uctx.beginPath(); uctx.arc(TARGET.x, TARGET.y, TARGET.r, 0, Math.PI * 2); uctx.stroke();
      if (glow > 0) {
        uctx.fillStyle = `rgba(242,210,122,${(0.14 * glow).toFixed(3)})`;
        uctx.beginPath(); uctx.arc(TARGET.x, TARGET.y, TARGET.r, 0, Math.PI * 2); uctx.fill();
      }
      uctx.restore();
    },

    // Cercles d'approche : un par note, qui se resserre sur la palette.
    drawRings(uctx, seg) {
      const clk = seg.clk;
      const now = this.now(clk);
      const app = U.clamp(seg.spb * 1.7, 0.75, 1.1);
      let glow = 0;
      uctx.save();
      for (const n of seg.notes) {
        if (n.res || n.owner !== 'henry') continue;
        const dt = this.timeOf(clk, n.b) - now;
        if (dt > app || dt < -WIN_GOOD) continue;
        const k = U.clamp(dt / app, 0, 1);
        const r = TARGET.r + k * (TARGET.r0 - TARGET.r);
        const a = Math.min(1, (1 - k) * 3) * (dt < 0 ? 1 + dt / WIN_GOOD : 1);
        const off = Math.abs(n.b % 1) > 0.01;
        uctx.strokeStyle = off ? `rgba(232,150,90,${(0.9 * a).toFixed(3)})` : `rgba(242,210,122,${(0.9 * a).toFixed(3)})`;

        uctx.beginPath(); uctx.arc(TARGET.x, TARGET.y, r, 0, Math.PI * 2); uctx.stroke();
        if (Math.abs(dt) < WIN_PERFECT) glow = Math.max(glow, 1 - Math.abs(dt) / WIN_PERFECT);
      }
      uctx.restore();
      this.drawTarget(uctx, glow);

    // « Un… deux… » avant chaque départ.
    drawCount(uctx, seg) {
      const from = seg.clk.from;
      const b = seg.beat;

        size: 44 + (1 - k) * 8, italic: true, align: 'center', base: 'middle', alpha: 1 - k * 0.6, shadow: true, color: P.paper,
      });

    drawGauge(uctx) {

      const pulse = g > 0.7 ? 0.5 + 0.5 * Math.sin(this.t * 9) : 0;

      const c = g < 0.5 ? mix([217, 164, 65], [227, 122, 44], g * 2) : mix([227, 122, 44], [150, 40, 22], (g - 0.5) * 2);
      ui.bar(uctx, x, y, w, h, g, { color: `rgb(${c})`, bg: 'rgba(232,223,204,0.16)' });

    bubble(uctx, text, x, y, alpha) {
      uctx.save();
      uctx.globalAlpha = alpha;
      uctx.font = ui.font(21, 'serif', 'italic');
      const w = uctx.measureText(text).width + 30;

      ui.text(uctx, text, bx + w / 2, by + 19, { size: 21, italic: true, color: P.ink, align: 'center', base: 'middle' });
      uctx.restore();
    },

    drawIntro(uctx) {
      const a = U.clamp((this.t - 0.2) * 2.5, 0, 1);
      // anneau de démonstration
      const k = ((this.t - 0.4) % 1.5) / 1.5;
      if (this.t > 0.4) {
        uctx.save();
        uctx.globalAlpha = a;
        uctx.strokeStyle = `rgba(242,210,122,${(0.85 * Math.min(1, k * 3)).toFixed(3)})`;
        uctx.lineWidth = 2 + k * 1.5;
        uctx.beginPath(); uctx.arc(TARGET.x, TARGET.y, TARGET.r + (1 - k) * (TARGET.r0 - TARGET.r), 0, Math.PI * 2); uctx.stroke();
        uctx.restore();
        this.drawTarget(uctx, k > 0.92 ? (k - 0.92) / 0.08 : 0);
      }
      const pw = 700, ph = 214, px = G.W / 2 - pw / 2, py = 74;
      uctx.save();
      uctx.globalAlpha = a;
      uctx.fillStyle = 'rgba(18,14,12,0.86)';
      uctx.beginPath(); uctx.roundRect(px, py, pw, ph, 10); uctx.fill();
      uctx.strokeStyle = 'rgba(232,223,204,0.16)';
      uctx.lineWidth = 1;
      uctx.stroke();
      ui.caps(uctx, 'Touiller en rythme', G.W / 2, py + 40, { size: 15, align: 'center', color: P.rim, spacing: 4 });
      ui.text(uctx, 'Toute la nuit, on touille sans s\'arrêter, sinon ça attache au fond.', G.W / 2, py + 84, {
        size: 21, italic: true, align: 'center', color: '#D8CFBC',
      });
      ui.text(uctx, 'Clique ou appuie sur Espace quand le cercle touche la palette.', G.W / 2, py + 140, { size: 25, align: 'center' });
      const blink = 0.55 + 0.45 * Math.sin(this.t * 3.2);
      ui.text(uctx, 'Clique ou appuie sur Espace pour un essai', G.W / 2, py + 186, { size: 18, italic: true, align: 'center', color: P.rim, alpha: blink });
      uctx.restore();
    },

    drawEnd(uctx) {
      const r = this.result;
      if (!r) return;
      const k = U.clamp((this.t - this.endT) * 2, 0, 1);
      const pw = 560, ph = 300, px = G.W / 2 - pw / 2, py = 70;
      uctx.save();
      uctx.globalAlpha = k;
      uctx.fillStyle = 'rgba(18,14,12,0.88)';
      uctx.beginPath(); uctx.roundRect(px, py, pw, ph, 10); uctx.fill();
      uctx.strokeStyle = 'rgba(232,223,204,0.16)';
      uctx.lineWidth = 1;
      uctx.stroke();
      ui.caps(uctx, 'Au petit jour', G.W / 2, py + 40, { size: 15, align: 'center', color: P.rim, spacing: 4 });
      // les pots
      for (let i = 0; i < 3; i++) {

        const full = i < r.jars;
        uctx.fillStyle = full ? '#7A3A17' : 'rgba(232,223,204,0.08)';
        uctx.strokeStyle = full ? 'rgba(232,223,204,0.55)' : 'rgba(232,223,204,0.25)';
        uctx.lineWidth = 1.5;
        uctx.beginPath(); uctx.roundRect(jx - 20, jy + 8, 40, 50, 7); uctx.fill(); uctx.stroke();
        uctx.fillStyle = full ? '#C9A26A' : 'rgba(232,223,204,0.2)';
        uctx.fillRect(jx - 22, jy, 44, 9);
        if (full) {
          uctx.fillStyle = 'rgba(255,200,140,0.18)';
          uctx.fillRect(jx - 14, jy + 14, 6, 36);
        }
      }
      const jarsTxt = `${NUM[r.jars]} pot${r.jars > 1 ? 's' : ''} de beurre de pommes`;
      ui.text(uctx, jarsTxt, G.W / 2, py + 168, { size: 27, align: 'center' });
      ui.text(uctx, `Parfait : ${r.perfects}   ·   Bien : ${r.goods}   ·   Raté : ${r.misses}`, G.W / 2, py + 206, {
        size: 19, italic: true, align: 'center', color: '#D8CFBC',
      });
      if (r.burned) {
        ui.text(uctx, 'Ça a attaché un moment : Mrs. Napier a dû reprendre la palette.', G.W / 2, py + 238, {
          size: 17, italic: true, align: 'center', color: 'rgba(227,150,100,0.85)',
        });
      }
      if (this.t - this.endT > 1.2) {
        const blink = 0.55 + 0.45 * Math.sin(this.t * 3.2);
        ui.text(uctx, 'Clique ou appuie sur Espace', G.W / 2, py + ph - 22, { size: 17, italic: true, align: 'center', color: P.rim, alpha: blink });
      }
      uctx.restore();
    },
  });

  G.DEV = G.DEV || {};
  G.DEV.applebutter = () => G.play(G.Scenes.applebutter({
    interlude: async (i) => G.say('nora', i === 0 ? 'Pas mal, le petit Caudill !' : 'Wes, accélère, on va voir ce qu\'il a dans le ventre.'),
  }));
})();

// ---- src/scenes/moonshine.js
'use strict';
// « La livraison » : mini-jeu d'infiltration, la nuit.
// Henry porte une caisse de six bocaux de moonshine pour Dow Slone, à travers les
// bois, jusqu'au vieux hangar du carreau de la mine. En contrebas, sur la route,
// un agent fédéral de la Prohibition rôde avec sa lanterne.
//
//   G.Scenes.moonshine({ onArrive: async (résultat, scène) => {} })
//   → promesse résolue par { jars, broken, caught, seconds }
//
// Commandes : → ou D avancer, ← ou Q reculer, ↓, S ou Maj se baisser (maintenu),
// Espace, clic ou toucher pour rattraper un bocal et sauter de pierre en pierre.
// À l'écran : « Reculer » et « Avancer » (maintenus), « Se baisser » (bascule).
(function () {
  const G = window.G, U = G.U, I = G.input, ui = G.ui, P = G.PAL;
  const W = G.W, H = G.H, TAU = Math.PI * 2;

  // ================================================================== le terrain
  const WORLD = 3700;
  const CHUNK = 740;
  const NCHUNK = Math.ceil(WORLD / CHUNK);
  const TRAIL = 420;                 // hauteur moyenne du sentier (pieds d'Henry)
  const ROAD = 666;                  // pieds de l'agent, sur la route en contrebas
  const START_X = 150;
  const CPS = [START_X, 1040, 2340, 3060]; // départ, puis les trois points de passage
  const SAFE_X = 3330;               // au-delà, l'agent ne voit plus Henry
  const ARRIVE_X = 3392;
  const HENRY_STOP = 3440;
  const HANGAR_X = 3492;
  const LIGE_HOME = 3540, LIGE_MEET = 3486;
  const SPEED = 66, CROUCH_SPEED = 36;
  const AG_H = (G.CHARS.revenuer && G.CHARS.revenuer.h) || 166;
  const BEAM_HW = 92;                // demi-largeur de la tache de lumière sur le sentier
  const PF = { far: 0.08, mid: 0.22, trees: 0.5 };

  const CREEK = { x0: 1950, x1: 2290, mid: 2120 };
  const STONES = [
    { x: 2018, period: 1.7, phase: 0.15 },
    { x: 2086, period: 1.45, phase: 0.85 },
    { x: 2154, period: 1.9, phase: 0.4 },
    { x: 2222, period: 1.6, phase: 1.15 },
  ];
  const STABLE = 0.42;               // part du cycle où la pierre ne bouge pas
  const HOP = 0.36;
  const LOGS = [950, 2540];          // troncs couchés : un bocal glisse
  const SLIP = 0.22, WIN = 0.8;
  const TRUNKS = [
    { x: 480, w: 88 }, { x: 650, w: 96 }, { x: 1120, w: 92 },
    { x: 1835, w: 100 }, { x: 2620, w: 92 }, { x: 2995, w: 96 },
  ];
  const ROCKS = [{ x: 1600, w: 150, h: 146 }, { x: 3145, w: 146, h: 142 }];
  const FERNS = [[222, 332], [730, 862], [1348, 1472], [2356, 2470], [2832, 2932], [3282, 3352]];
  const LEAVES = [[530, 612], [1180, 1320], [1665, 1785], [2668, 2752], [3195, 3268]];
  const STICKS = [400, 1500, 1730, 2712, 3240];
  const DOG_X = 2790, DOG_R = 430;
  const FARM_X = 2690, FARM_W = 176;
  const CROUCH_KEYS = ['ArrowDown', 'KeyS', 'ShiftLeft', 'ShiftRight', 'KeyC'];

  const BTN = {
    back: { x: 20, y: 622, w: 132, h: 80 },
    fwd: { x: 162, y: 622, w: 214, h: 80 },
    crouch: { x: W - 20 - 232, y: 622, w: 232, h: 80 },
  };

  // ------------------------------------------------------------------ relief
  const trailBase = (x) => TRAIL + 12 * Math.sin(x / 280 + 0.6) + 6 * Math.sin(x / 113 + 2.1);
  function creekDip(x) {
    const a = CREEK.x0 - 170, b = CREEK.x0 - 10, c = CREEK.x1 + 10, d = CREEK.x1 + 170;
    if (x <= a || x >= d) return 0;
    if (x < b) return 24 * U.smooth((x - a) / (b - a));
    if (x > c) return 24 * U.smooth((d - x) / (d - c));
    return 24;
  }
  function trailY(x) {
    const y = trailBase(x) + creekDip(x);
    const k = U.smooth(U.clamp((x - 3240) / 140, 0, 1)); // le carreau de la mine est plat
    return y * (1 - k) + (TRAIL + 8) * k;
  }
  function logBump(x) {
    for (const lx of LOGS) {
      const d = Math.abs(x - lx);
      if (d < 34) return -20 * (0.5 + 0.5 * Math.cos(Math.PI * d / 34));
    }
    return 0;
  }
  const footY = (x) => trailY(x) + logBump(x);
  const upY = (x) => 340 + 14 * Math.sin(x / 390 + 1.3) + 8 * Math.sin(x / 141);
  const WATER_Y = trailY(CREEK.mid) + 16;

  const inRanges = (x, list) => list.some(([a, b]) => x >= a && x <= b);
  const onLeaves = (x) => inRanges(x, LEAVES);
  function coverAt(x, crouched) {
    for (const t of TRUNKS) if (Math.abs(x - t.x) < t.w / 2 - 8) return 'trunk';
    for (const r of ROCKS) if (Math.abs(x - r.x) < r.w / 2 - 14) return 'rock';
    if (crouched) for (const [a, b] of FERNS) if (x >= a + 8 && x <= b - 8) return 'ferns';
    return null;
  }

  // ------------------------------------------------------------------ la lanterne
  // Position de la lanterne selon la hauteur du bras (lift : 0 baissé, 1 levé).
  function lanternPos(a) {
    const ang = U.lerp(0.14, 2.45, U.smooth(U.clamp(a.lift, 0, 1)));
    const shY = -0.73 * AG_H;
    const hx = Math.sin(ang) * 0.35 * AG_H, hy = shY + Math.cos(ang) * 0.35 * AG_H;
    return { x: a.x + a.dir * hx, y: ROAD + hy + AG_H * 0.03 + 11, ang };
  }
  const beamTarget = (x) => ({ x, y: trailY(x) - 62 });
  function inBeam(L, T, px, py) {
    const dx = T.x - L.x, dy = T.y - L.y, d = Math.hypot(dx, dy);
    const half = Math.atan2(BEAM_HW, d);
    const ex = px - L.x, ey = py - L.y;
    if (Math.hypot(ex, ey) > d * 1.5) return false;
    let da = Math.atan2(ey, ex) - Math.atan2(dy, dx);
    da = Math.atan2(Math.sin(da), Math.cos(da));
    return Math.abs(da) < half;
  }
  function evalPath(p, t) {
    if (t <= p[0][0]) return p[0][1];
    for (let i = 0; i < p.length - 1; i++) {
      const [t0, x0] = p[i], [t1, x1] = p[i + 1];
      if (t <= t1) return t1 > t0 ? U.lerp(x0, x1, U.smooth((t - t0) / (t1 - t0))) : x1;
    }
    return p[p.length - 1][1];
  }
  function stoneState(i, t) {
    const s = STONES[i];
    const u = (((t + s.phase) % s.period) + s.period) % s.period / s.period;
    if (u < STABLE) return { stable: true, rot: 0, dy: 0, u };
    const k = (u - STABLE) / (1 - STABLE);
    const env = Math.sin(Math.PI * k);
    return { stable: false, rot: Math.sin(k * TAU * 2) * 0.24 * env, dy: Math.abs(Math.sin(k * TAU * 2)) * 3 * env, u };
  }
  // Un peu d'indulgence : la pierre compte encore comme stable un court instant.
  const stoneStable = (i, t) => {
    const st = stoneState(i, t);
    return st.stable || st.u > 1 - 0.05 / STONES[i].period || st.u < STABLE + 0.08 / STONES[i].period;
  };
  const stoneTop = (i, t) => WATER_Y - 10 + stoneState(i, t).dy;

  const camFor = (x) => U.clamp(x - W * 0.4, 0, WORLD - W);

  function mix(c1, c2, k) {
    const a = parseInt(c1.slice(1), 16), b = parseInt(c2.slice(1), 16);
    const ch = (s) => Math.round(U.lerp((a >> s) & 255, (b >> s) & 255, k));
    return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
  }

  // ================================================================== décor peint (caches)
  function fillBetween(cx, xa, xb, topFn, botFn, style, step = 8) {
    cx.beginPath();
    cx.moveTo(xa, topFn(xa));
    for (let x = xa; x < xb; x += step) cx.lineTo(x, topFn(x));
    cx.lineTo(xb, topFn(xb));
    for (let x = xb; x > xa; x -= step) cx.lineTo(x, botFn(x));
    cx.lineTo(xa, botFn(xa));
    cx.closePath();
    cx.fillStyle = style;
    cx.fill();
  }
  function strokeAlong(cx, xa, xb, fn, style, width, step = 8) {
    cx.beginPath();
    cx.moveTo(xa, fn(xa));
    for (let x = xa; x < xb; x += step) cx.lineTo(x, fn(x));
    cx.lineTo(xb, fn(xb));
    cx.strokeStyle = style;
    cx.lineWidth = width;
    cx.stroke();
  }

  function drawSky(cx) {
    G.art.sky(cx, W, H, [[0, '#060b17'], [0.35, '#0f1b31'], [0.62, '#1f2f4d'], [1, '#22324f']]);
    const rnd = U.rng(42);
    for (let i = 0; i < 160; i++) {
      const x = rnd() * W, y = rnd() * 320, big = rnd() < 0.08;
      cx.globalAlpha = (0.2 + rnd() * 0.6) * (1 - y / 420);
      cx.fillStyle = '#dfe6f0';
      cx.beginPath(); cx.arc(x, y, big ? 1.4 : 0.8, 0, TAU); cx.fill();
    }
    cx.globalAlpha = 1;
    const mx = 1010, my = 112;
    const g = cx.createRadialGradient(mx, my, 20, mx, my, 330);
    g.addColorStop(0, 'rgba(205,218,240,0.34)');
    g.addColorStop(0.25, 'rgba(160,182,220,0.12)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    cx.fillStyle = g;
    cx.fillRect(0, 0, W, H);
    cx.fillStyle = '#EDEAD9';
    cx.beginPath(); cx.arc(mx, my, 34, 0, TAU); cx.fill();
    cx.fillStyle = 'rgba(150,152,160,0.28)';
    for (const [dx, dy, r] of [[-10, -8, 9], [8, 6, 7], [-4, 13, 5], [12, -12, 4], [-15, 8, 4]]) {
      cx.beginPath(); cx.arc(mx + dx, my + dy, r, 0, TAU); cx.fill();
    }
  }

  function drawFarRidge(cx, w) {
    const r = G.art.makeRidge(11, w, 226, 32, 130);
    G.art.ridge(cx, r, '#1a2742', H);
    cx.save();
    cx.beginPath();
    cx.moveTo(r[0][0], r[0][1]);
    for (let i = 1; i < r.length - 1; i++) {
      cx.quadraticCurveTo(r[i][0], r[i][1], (r[i][0] + r[i + 1][0]) / 2, (r[i][1] + r[i + 1][1]) / 2);
    }
    cx.strokeStyle = 'rgba(150,172,210,0.16)';
    cx.lineWidth = 2;
    cx.stroke();
    cx.restore();
    const g = cx.createLinearGradient(0, 240, 0, 330);
    g.addColorStop(0, 'rgba(70,90,124,0)');
    g.addColorStop(1, 'rgba(70,90,124,0.4)');
    cx.fillStyle = g;
    cx.fillRect(0, 240, w, 100);
  }

  function drawMidRidge(cx, w) {
    const r = G.art.makeRidge(23, w, 274, 24, 110);
    G.art.ridge(cx, r, '#131d32', H);
    G.art.dots(cx, 7, Math.round(w / 2.4), 0, w, (x) => { const y = G.art.ridgeY(r, x); return [y - 6, y + 30]; },
      ['#152036', '#111b2f', '#18253e'], 3, 7, 0.8, 1);
    const g = cx.createLinearGradient(0, 290, 0, 360);
    g.addColorStop(0, 'rgba(60,80,112,0)');
    g.addColorStop(1, 'rgba(60,80,112,0.35)');
    cx.fillStyle = g;
    cx.fillRect(0, 290, w, 80);
  }

  function drawFarTrees(cx, w) {
    const rnd = U.rng(55);
    for (let x = 0; x < w; x += 20 + rnd() * 46) {
      const tw = 3 + rnd() * 9, base = 338 + rnd() * 26, k = rnd();
      cx.fillStyle = mix('#22304a', '#172338', k);
      cx.beginPath();
      cx.moveTo(x - tw / 2, base);
      cx.lineTo(x - tw * 0.28, -10);
      cx.lineTo(x + tw * 0.28, -10);
      cx.lineTo(x + tw / 2, base);
      cx.fill();
      cx.strokeStyle = cx.fillStyle;
      cx.lineWidth = 1.5;
      for (let b = 0; b < 3; b++) {
        const by = 40 + rnd() * 220, s = rnd() < 0.5 ? -1 : 1;
        cx.beginPath(); cx.moveTo(x, by); cx.lineTo(x + s * (14 + rnd() * 26), by - 18 - rnd() * 26); cx.stroke();
      }
    }
    const g = cx.createLinearGradient(0, 250, 0, 372);
    g.addColorStop(0, 'rgba(64,84,116,0)');
    g.addColorStop(1, 'rgba(64,84,116,0.5)');
    cx.fillStyle = g;
    cx.fillRect(0, 250, w, 130);
  }

  // Troncs du fond, sur la pente du haut : du décor, pas des abris.
  const BG_TRUNKS = (() => {
    const rnd = U.rng(901);
    const out = [];
    for (let x = -40; x < WORLD + 60; x += 30 + rnd() * 58) {
      const d = rnd(), seed = Math.floor(rnd() * 1e6), skip = rnd();
      if (x > FARM_X - 40 && x < FARM_X + FARM_W + 40) continue;
      if (x > 3290 && skip < 0.8) continue;
      if (Math.abs(x - CREEK.mid) < 80) continue;
      out.push({ x, d, w: U.lerp(4, 17, d * d), seed });
    }
    return out.sort((a, b) => a.d - b.d);
  })();
  function bgTrunk(cx, t) {
    const base = U.lerp(upY(t.x) + 6, trailY(t.x) - 12, t.d);
    const rnd = U.rng(t.seed);
    const lean = (rnd() - 0.5) * 8;
    cx.fillStyle = mix('#1f2c45', '#0b111b', t.d);
    cx.beginPath();
    cx.moveTo(t.x - t.w / 2 - 2, base);
    cx.lineTo(t.x - t.w * 0.3 + lean, -10);
    cx.lineTo(t.x + t.w * 0.3 + lean, -10);
    cx.lineTo(t.x + t.w / 2 + 2, base);
    cx.fill();
    cx.strokeStyle = cx.fillStyle;
    cx.lineWidth = Math.max(1, t.w * 0.18);
    for (let b = 0; b < 2; b++) {
      const by = 30 + rnd() * 200, s = rnd() < 0.5 ? -1 : 1;
      cx.beginPath(); cx.moveTo(t.x + lean * (1 - by / base), by); cx.lineTo(t.x + s * (16 + rnd() * 30), by - 20 - rnd() * 30); cx.stroke();
    }
    if (t.d > 0.35) {
      cx.strokeStyle = `rgba(140,165,205,${0.08 + 0.14 * t.d})`;
      cx.lineWidth = 1.5;
      cx.beginPath(); cx.moveTo(t.x + t.w / 2, base - 4); cx.lineTo(t.x + t.w * 0.28 + lean, -10); cx.stroke();
    }
  }

  function drawLeaves(cx, a, b) {
    const taper = (x) => Math.sin(Math.PI * U.clamp((x - a) / (b - a), 0, 1));
    fillBetween(cx, a - 6, b + 6, (x) => trailY(x) - 2 - 4 * taper(x), (x) => trailY(x) + 9, 'rgba(128,104,68,0.5)', 4);
    const rnd = U.rng(a * 13 + 7);
    const n = Math.round((b - a) * 2.2);
    for (let i = 0; i < n; i++) {
      const x = a - 8 + rnd() * (b - a + 16), dy = rnd(), c = Math.floor(rnd() * 6), rx = rnd(), ry = rnd(), rot = rnd(), al = rnd(), keep = rnd();
      if (keep > 0.25 + 0.75 * taper(x)) continue;
      cx.globalAlpha = 0.72 + al * 0.28;
      cx.fillStyle = ['#8a7550', '#7d6a48', '#a48c5e', '#6b5a3e', '#94603a', '#b3955f'][c];
      cx.beginPath();
      cx.ellipse(x, trailY(x) - 5 * taper(x) + dy * 14, 2.3 + rx * 2.6, 1.2 + ry * 1.3, rot * Math.PI, 0, TAU);
      cx.fill();
    }
    cx.globalAlpha = 1;
  }

  function drawStick(cx, x) {
    const y = trailY(x) + 3;
    cx.save();
    cx.lineCap = 'round';
    cx.strokeStyle = '#7d7262';
    cx.lineWidth = 2.6;
    cx.beginPath(); cx.moveTo(x - 20, y - 3); cx.lineTo(x + 22, y + 5); cx.stroke();
    cx.strokeStyle = '#a19582';
    cx.lineWidth = 3.6;
    cx.beginPath(); cx.moveTo(x - 32, y + 3); cx.lineTo(x + 30, y - 3); cx.stroke();
    cx.lineWidth = 2;
    for (const [x1, y1, x2, y2] of [[-12, 1.5, -22, -10], [4, -0.5, 12, -13], [15, -1.5, 27, 4], [-22, 2, -33, -5], [-4, 0, -8, -9]]) {
      cx.beginPath(); cx.moveTo(x + x1, y + y1); cx.lineTo(x + x2, y + y2); cx.stroke();
    }
    cx.restore();
  }

  function drawLog(cx, x) {
    const y = trailY(x) + 8;
    cx.save();
    cx.translate(x, y);
    cx.rotate(-0.05);
    cx.fillStyle = '#17120e';
    cx.beginPath(); cx.roundRect(-44, -28, 88, 28, 12); cx.fill();
    cx.strokeStyle = 'rgba(8,6,4,0.8)';
    cx.lineWidth = 1.5;
    for (const yy of [-21, -14, -8]) { cx.beginPath(); cx.moveTo(-36, yy); cx.lineTo(38, yy + 1); cx.stroke(); }
    cx.strokeStyle = 'rgba(160,180,210,0.4)';
    cx.lineWidth = 2;
    cx.beginPath(); cx.moveTo(-34, -27); cx.lineTo(36, -27); cx.stroke();
    cx.fillStyle = '#6e5e48';
    cx.beginPath(); cx.ellipse(-44, -14, 7.5, 14, 0, 0, TAU); cx.fill();
    cx.strokeStyle = '#4a3d2e';
    cx.lineWidth = 1;
    for (const k of [0.7, 0.4]) { cx.beginPath(); cx.ellipse(-44, -14, 7.5 * k, 14 * k, 0, 0, TAU); cx.stroke(); }
    cx.fillStyle = '#26352a';
    for (const [mx, mw] of [[-20, 14], [8, 10], [24, 8]]) { cx.beginPath(); cx.ellipse(mx, -27, mw, 3, 0, 0, TAU); cx.fill(); }
    cx.strokeStyle = '#17120e';
    cx.lineWidth = 4;
    cx.lineCap = 'round';
    cx.beginPath(); cx.moveTo(14, -26); cx.lineTo(24, -44); cx.stroke();
    cx.restore();
  }

  function drawCreekStatic(cx) {
    const { x0, x1, mid } = CREEK;
    const wy = WATER_Y;
    // le ruisseau qui descend de la pente du haut
    cx.fillStyle = '#132336';
    cx.beginPath();
    cx.moveTo(mid - 70, wy + 2);
    cx.quadraticCurveTo(mid - 26, wy - 24, mid - 10, upY(mid) + 6);
    cx.lineTo(mid + 6, upY(mid) + 6);
    cx.quadraticCurveTo(mid + 24, wy - 24, mid + 70, wy + 2);
    cx.fill();
    cx.strokeStyle = 'rgba(160,190,220,0.18)';
    cx.lineWidth = 1.2;
    for (const [k, w] of [[0.3, 8], [0.6, 14], [0.85, 22]]) {
      const y = U.lerp(upY(mid) + 6, wy, k);
      cx.beginPath(); cx.moveTo(mid - w, y); cx.lineTo(mid + w * 0.6, y + 1); cx.stroke();
    }
    // berges
    cx.fillStyle = '#0a0f17';
    cx.beginPath();
    cx.moveTo(x0 - 40, trailY(x0 - 40) + 4); cx.lineTo(x0 + 6, trailY(x0) + 2); cx.lineTo(x0 + 22, wy + 16); cx.lineTo(x0 - 40, wy + 40);
    cx.fill();
    cx.beginPath();
    cx.moveTo(x1 + 40, trailY(x1 + 40) + 4); cx.lineTo(x1 - 6, trailY(x1) + 2); cx.lineTo(x1 - 22, wy + 16); cx.lineTo(x1 + 40, wy + 40);
    cx.fill();
    // la cascade jusqu'à la route
    const gs = cx.createLinearGradient(0, wy, 0, ROAD);
    gs.addColorStop(0, '#1b2f46');
    gs.addColorStop(1, '#132236');
    cx.fillStyle = gs;
    cx.beginPath();
    cx.moveTo(x0 + 14, wy + 12);
    cx.bezierCurveTo(x0 + 70, wy + 60, mid - 120, wy + 70, mid - 70, wy + 130);
    cx.bezierCurveTo(mid - 40, wy + 170, mid - 110, ROAD - 70, mid - 92, ROAD - 8);
    cx.lineTo(mid + 92, ROAD - 8);
    cx.bezierCurveTo(mid + 70, ROAD - 80, mid + 40, wy + 170, mid + 64, wy + 130);
    cx.bezierCurveTo(mid + 110, wy + 70, x1 - 70, wy + 60, x1 - 14, wy + 12);
    cx.closePath();
    cx.fill();
    // petites chutes d'écume
    cx.strokeStyle = 'rgba(170,198,222,0.28)';
    cx.lineWidth = 2;
    for (const [fy, fw] of [[wy + 40, 120], [wy + 128, 60], [ROAD - 70, 70]]) {
      cx.beginPath(); cx.moveTo(mid - fw / 2, fy); cx.quadraticCurveTo(mid, fy + 6, mid + fw / 2, fy); cx.stroke();
    }
    G.art.dots(cx, 61, 70, x0 - 10, x1 + 10, (x) => {
      const k = Math.abs(x - mid) / ((x1 - x0) / 2);
      return [wy + 30 + (1 - k) * 160, ROAD - 20];
    }, ['#0b1119', '#0e151f', '#121b27'], 5, 13, 0.9, 1);
    // l'eau du gué
    cx.fillStyle = '#1d3349';
    cx.fillRect(x0 + 4, wy - 1, x1 - x0 - 8, 15);
    cx.fillStyle = 'rgba(150,180,210,0.25)';
    cx.fillRect(x0 + 6, wy - 1, x1 - x0 - 12, 1.5);
  }

  function drawFarm(cx) {
    const x0 = FARM_X, w = FARM_W, base = 394, wallH = 60;
    cx.fillStyle = '#0f1622';
    cx.beginPath(); cx.ellipse(x0 + w / 2, base + 4, w * 0.7, 12, 0, 0, TAU); cx.fill();
    cx.fillStyle = '#131b28';
    cx.fillRect(x0, base - wallH, w, wallH);
    cx.strokeStyle = 'rgba(80,98,128,0.32)';
    cx.lineWidth = 1.5;
    for (let y = base - wallH + 7; y < base; y += 8) { cx.beginPath(); cx.moveTo(x0, y); cx.lineTo(x0 + w, y); cx.stroke(); }
    cx.fillStyle = '#0c111a';
    cx.beginPath(); cx.moveTo(x0 - 14, base - wallH + 4); cx.lineTo(x0 + w * 0.5, base - wallH - 40); cx.lineTo(x0 + w + 14, base - wallH + 4); cx.fill();
    cx.strokeStyle = 'rgba(160,182,215,0.4)';
    cx.lineWidth = 2;
    cx.beginPath(); cx.moveTo(x0 + w * 0.5, base - wallH - 40); cx.lineTo(x0 + w + 14, base - wallH + 4); cx.stroke();
    cx.fillStyle = '#161e2b';
    cx.fillRect(x0 + w - 42, base - wallH - 50, 18, 46);
    cx.fillStyle = '#4c3418';
    cx.fillRect(x0 + 32, base - wallH + 18, 26, 21);
    cx.fillStyle = '#131b28';
    cx.fillRect(x0 + 44, base - wallH + 18, 2, 21);
    cx.fillRect(x0 + 32, base - wallH + 28, 26, 2);
    cx.fillStyle = '#080b10';
    cx.fillRect(x0 + 100, base - 44, 22, 44);
    // clôture à perches le long du sentier
    cx.strokeStyle = '#141c28';
    cx.lineCap = 'round';
    for (let x = 2596; x <= 2950; x += 46) {
      const y = trailY(x) - 4;
      cx.lineWidth = 4;
      cx.beginPath(); cx.moveTo(x, y); cx.lineTo(x - 1, y - 34); cx.stroke();
      if (x + 46 <= 2950) {
        const y2 = trailY(x + 46) - 4;
        cx.lineWidth = 2.5;
        cx.beginPath(); cx.moveTo(x, y - 28); cx.lineTo(x + 46, y2 - 20); cx.stroke();
        cx.beginPath(); cx.moveTo(x, y - 16); cx.lineTo(x + 46, y2 - 11); cx.stroke();
      }
    }
    // niche
    const kx = DOG_X + 54, ky = trailY(DOG_X + 54) - 2;
    cx.fillStyle = '#0d131c';
    cx.beginPath(); cx.moveTo(kx - 24, ky); cx.lineTo(kx - 24, ky - 22); cx.lineTo(kx, ky - 40); cx.lineTo(kx + 24, ky - 22); cx.lineTo(kx + 24, ky); cx.fill();
    cx.fillStyle = '#04060a';
    cx.beginPath(); cx.moveTo(kx - 9, ky); cx.lineTo(kx - 9, ky - 16); cx.arc(kx, ky - 16, 9, Math.PI, 0); cx.lineTo(kx + 9, ky); cx.fill();
    cx.strokeStyle = 'rgba(160,182,215,0.35)';
    cx.lineWidth = 1.5;
    cx.beginPath(); cx.moveTo(kx, ky - 40); cx.lineTo(kx + 24, ky - 22); cx.stroke();
  }

  function drawYardBack(cx) {
    // terril
    cx.fillStyle = '#0d121b';
    cx.beginPath();
    cx.moveTo(3520, trailY(3520) + 4);
    cx.quadraticCurveTo(3590, 300, 3650, 258);
    cx.quadraticCurveTo(3700, 250, 3760, 290);
    cx.lineTo(3760, H); cx.lineTo(3520, H);
    cx.fill();
    // chevalement en bois
    const bx = 3318, top = 146, base = 392;
    cx.strokeStyle = '#0a0e16';
    cx.lineCap = 'butt';
    cx.lineWidth = 7;
    for (const [x1, x2] of [[bx, bx + 16], [bx + 84, bx + 68]]) { cx.beginPath(); cx.moveTo(x1, base); cx.lineTo(x2, top + 52); cx.stroke(); }
    cx.lineWidth = 3;
    for (let y = base - 30; y > top + 60; y -= 56) {
      const k1 = (base - y) / (base - top - 52), k2 = (base - y + 56) / (base - top - 52);
      const l1 = bx + 16 * k1, r1 = bx + 84 - 16 * k1, l2 = bx + 16 * Math.min(1, k2), r2 = bx + 84 - 16 * Math.min(1, k2);
      cx.beginPath(); cx.moveTo(l1, y); cx.lineTo(r1, y); cx.moveTo(l1, y); cx.lineTo(r2, y - 56); cx.moveTo(r1, y); cx.lineTo(l2, y - 56); cx.stroke();
    }
    cx.fillStyle = '#0b0f17';
    cx.fillRect(bx - 6, top, 96, 56);
    cx.beginPath(); cx.moveTo(bx - 12, top + 2); cx.lineTo(bx + 42, top - 26); cx.lineTo(bx + 96, top + 2); cx.fill();
