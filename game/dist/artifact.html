<style>
  /* Écran unique, sombre : le jeu se dessine dans deux canvas superposés. */
  :root { --bg: #0d0b0a; --fg: #e8dfcc; --muted: #9b917f; color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); overflow: hidden; }
  body { font-family: 'EB Garamond', Georgia, serif; }
  canvas { position: absolute; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  #rotate { position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); padding: 10px 14px;
    background: rgba(31, 26, 23, 0.92); color: var(--fg); font-style: italic; font-size: 17px; text-align: center; border-radius: 8px; pointer-events: none; display: none; }
  @media (orientation: portrait) and (max-width: 760px) { #rotate { display: block; } }

<canvas id="scene" aria-label="Tant qu'on est là, épisode 1"></canvas>
<canvas id="ui"></canvas>
<p id="rotate">Tourne ton téléphone à l'horizontale pour jouer en grand.</p>
<script>
// ---- src/core.js
'use strict';
// Noyau : canvas, boucle, entrées, scènes asynchrones, superpositions, minuteries.
(function () {
  const G = (window.G = window.G || {});
  G.W = 1280;
  G.H = 720;
  G.Scenes = G.Scenes || {};

  // ------------------------------------------------------------------ utilitaires
  const U = (G.U = {
    clamp: (v, a, b) => (v < a ? a : v > b ? b : v),
    lerp: (a, b, t) => a + (b - a) * t,
    inv: (a, b, v) => (v - a) / (b - a),
    smooth: (t) => t * t * (3 - 2 * t),
    easeOut: (t) => 1 - Math.pow(1 - t, 3),
    easeIn: (t) => t * t * t,
    easeInOut: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
    rand: (a, b) => a + Math.random() * (b - a),
    randi: (a, b) => Math.floor(a + Math.random() * (b - a + 1)),
    pick: (arr) => arr[Math.floor(Math.random() * arr.length)],
    dist: (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by),
    inRect: (p, r) => p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h,
    // Générateur pseudo-aléatoire déterministe (xorshift) pour les décors.
    rng(seed) {
      let s = seed >>> 0 || 1;
      return () => {
        s ^= s << 13; s >>>= 0;
        s ^= s >>> 17;
        s ^= s << 5; s >>>= 0;
        return s / 4294967296;
      };
    },
    // Montants en cents → « 40 ¢ » ou « 1,25 $ ».
    money(c) {
      c = Math.round(c);
      if (Math.abs(c) < 100) return `${c} ¢`;
      const d = (c / 100).toFixed(2).replace('.', ',');
      return `${d} $`;
    },
  });

  // ------------------------------------------------------------------ canvas
  // Deux canvas superposés : « scene » reçoit le filtre de couleur de l'Espoir,
  // « ui » (dialogues, interface, fondus) reste net et non filtré.
  const sceneCanvas = document.getElementById('scene');
  const uiCanvas = document.getElementById('ui');
  G.ctx = sceneCanvas.getContext('2d');
  G.uctx = uiCanvas.getContext('2d');
  G.dpr = 1;
  G.view = { x: 0, y: 0, w: G.W, h: G.H, scale: 1 };

  function resize() {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const scale = Math.min(vw / G.W, vh / G.H);
    const w = Math.floor(G.W * scale);
    const h = Math.floor(G.H * scale);
    const x = Math.floor((vw - w) / 2);
    const y = Math.floor((vh - h) / 2);
    G.dpr = Math.min(window.devicePixelRatio || 1, 2);
    for (const c of [sceneCanvas, uiCanvas]) {
      c.style.left = x + 'px';
      c.style.top = y + 'px';
      c.style.width = w + 'px';
      c.style.height = h + 'px';
      c.width = Math.round(w * G.dpr);
      c.height = Math.round(h * G.dpr);
    }
    G.view = { x, y, w, h, scale };
    const k = scale * G.dpr;
    G.ctx.setTransform(k, 0, 0, k, 0, 0);
    G.uctx.setTransform(k, 0, 0, k, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ------------------------------------------------------------------ entrées
  const I = (G.input = {
    x: G.W / 2, y: G.H / 2,
    down: false, pressed: false, released: false,
    keys: new Set(), kp: new Set(),
    mouse: true, // faux après un toucher : pas de survol à afficher
    key: (c) => I.keys.has(c),
    hit: (c) => I.kp.has(c),
    // Appui « valider » : clic, Espace, Entrée ou E.
    confirm: () => I.pressed || I.kp.has('Space') || I.kp.has('Enter') || I.kp.has('KeyE'),
    consume() { I.pressed = false; I.released = false; I.kp.clear(); },
  });
  function toLogical(e) {
    I.x = ((e.clientX - G.view.x) / G.view.w) * G.W;
    I.y = ((e.clientY - G.view.y) / G.view.h) * G.H;
  }
  uiCanvas.addEventListener('pointerdown', (e) => {
    toLogical(e);
    I.mouse = e.pointerType === 'mouse';
    I.down = true;
    I.pressed = true;
    try { uiCanvas.setPointerCapture(e.pointerId); } catch (_) { /* rien */ }
    G.audio && G.audio.unlock();
    e.preventDefault();
  });
  uiCanvas.addEventListener('pointermove', (e) => {
    toLogical(e);
    if (e.pointerType === 'mouse') I.mouse = true;
  });
  const up = (e) => {
    toLogical(e);
    if (I.down) I.released = true;
    I.down = false;
  };
  uiCanvas.addEventListener('pointerup', up);
  uiCanvas.addEventListener('pointercancel', up);
  uiCanvas.addEventListener('contextmenu', (e) => e.preventDefault());
  const BLOCK = ['Space', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'];
  window.addEventListener('keydown', (e) => {
    if (BLOCK.includes(e.code)) e.preventDefault();
    if (!e.repeat) I.kp.add(e.code);
    I.keys.add(e.code);
    G.audio && G.audio.unlock();
  });
  window.addEventListener('keyup', (e) => I.keys.delete(e.code));
  window.addEventListener('blur', () => { I.keys.clear(); I.down = false; });

  // ------------------------------------------------------------------ minuteries (temps de jeu)
  G.time = 0;
  const timers = [];
  G.after = (sec, fn) => timers.push({ t: G.time + sec, fn });
  G.wait = (sec) => new Promise((res) => G.after(sec, res));
  // Attend un appui « valider ».
  G.waitConfirm = () => new Promise((res) => {
    const o = { modal: true, update() { if (I.confirm()) { I.consume(); G.popOverlay(o); res(); } }, draw() {} };
    G.pushOverlay(o);
  });

  // ------------------------------------------------------------------ superpositions
  // Une superposition « modale » (dialogue, choix) capte les entrées : la scène
  // continue de s'animer mais ne reçoit plus les appuis (G.blocked vaut vrai).
  G.overlays = [];
  G.pushOverlay = (o) => { G.overlays.push(o); return o; };
  G.popOverlay = (o) => { const i = G.overlays.indexOf(o); if (i >= 0) G.overlays.splice(i, 1); };
  G.blocked = false;

  // ------------------------------------------------------------------ scènes
  // Une scène est un objet { enter(), update(dt), draw(ctx), drawUI(uctx), exit() }.
  // G.play(scene) l'affiche (avec un fondu) et renvoie une promesse résolue
  // quand la scène appelle this.finish(résultat).
  G.scene = null;
  G.fade = { a: 1, target: 0, speed: 2.4, color: '#0d0b0a' };

  G.makeScene = (obj) => {
    obj.t = 0;
    obj.finish = (result) => {
      if (obj._done) return;
      obj._done = true;
      obj._resolve && obj._resolve(result);
    };
    return obj;
  };

  let pending = null;
  G.play = (scene, opts = {}) => new Promise((res) => {
    if (!scene.finish) G.makeScene(scene);
    scene._resolve = res;
    pending = { scene, fadeSpeed: opts.fade || 2.4, color: opts.color || '#0d0b0a' };
    G.fade.color = pending.color;
    G.fade.speed = pending.fadeSpeed;
    G.fade.target = 1;
  });

  function swapIfReady() {
    if (!pending || G.fade.a < 0.999) return;
    const old = G.scene;
    if (old && old.exit) old.exit();
    G.scene = pending.scene;
    pending = null;
    G.scene.t = 0;
    if (G.scene.enter) G.scene.enter();
    G.fade.target = 0;
  }

  // ------------------------------------------------------------------ Espoir → couleur
  // Le filtre CSS ne s'applique qu'au canvas de scène.
  let satCur = 1, sepCur = 0, filterStr = '';
  function updateFilter(dt) {
    const e = G.state ? G.espoir() : 1;
    const override = G.scene && G.scene.colorOverride;
    const satT = override ? override.sat : 0.32 + 0.78 * e;
    const sepT = override ? override.sepia : (1 - e) * 0.62;
    const k = 1 - Math.pow(0.15, dt);
    satCur = U.lerp(satCur, satT, k);
    sepCur = U.lerp(sepCur, sepT, k);
    const s = `saturate(${satCur.toFixed(3)}) sepia(${sepCur.toFixed(3)})`;
    if (s !== filterStr) { filterStr = s; sceneCanvas.style.filter = s; }
  }
  G.snapColor = () => {
    const e = G.espoir();
    satCur = 0.32 + 0.78 * e;
    sepCur = (1 - e) * 0.62;
  };

  // ------------------------------------------------------------------ boucle
  let last = performance.now();
  G.frame = 0;
  function loop(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05;
    if (dt < 0) dt = 0;
    if (G.timeScale) dt *= G.timeScale;
    G.time += dt;
    G.frame++;

    for (let i = timers.length - 1; i >= 0; i--) {
      if (timers[i].t <= G.time) { const t = timers.splice(i, 1)[0]; t.fn(); }
    }

    // Fondu
    G.fade.a = G.fade.a < G.fade.target
      ? Math.min(G.fade.target, G.fade.a + dt * G.fade.speed)
      : Math.max(G.fade.target, G.fade.a - dt * G.fade.speed);
    swapIfReady();

    // Les superpositions passent avant la scène et consomment les entrées.
    const top = G.overlays[G.overlays.length - 1];
    G.blocked = G.overlays.some((o) => o.modal) || G.fade.a > 0.4;
    for (let i = G.overlays.length - 1; i >= 0; i--) {
      const o = G.overlays[i];
      if (o.update) o.update(dt, o === top);
    }
    if (G.blocked) I.consume();

    const ctx = G.ctx;
    const uctx = G.uctx;
    if (G.scene) {
      G.scene.t += dt;
      if (G.scene.update) G.scene.update(dt);
    }
    ctx.save();
    ctx.fillStyle = '#0d0b0a';
    ctx.fillRect(0, 0, G.W, G.H);
    if (G.scene && G.scene.draw) G.scene.draw(ctx);
    ctx.restore();

    uctx.clearRect(0, 0, G.W, G.H);
    uctx.save();
    if (G.scene && G.scene.drawUI) G.scene.drawUI(uctx);
    uctx.restore();
    for (const o of G.overlays) { uctx.save(); if (o.draw) o.draw(uctx); uctx.restore(); }
    if (G.ui && G.ui.drawToasts) G.ui.drawToasts(uctx, dt);
    if (G.fade.a > 0) {
      uctx.globalAlpha = G.fade.a;
      uctx.fillStyle = G.fade.color;
      uctx.fillRect(0, 0, G.W, G.H);
      uctx.globalAlpha = 1;
    }

    updateFilter(dt);
    I.pressed = false;
    I.released = false;
    I.kp.clear();
    requestAnimationFrame(loop);
  }

  G.start = (main) => {
    requestAnimationFrame((t) => { last = t; requestAnimationFrame(loop); });
    Promise.resolve().then(main).catch((err) => {
      console.error(err);
      G.fatal = String(err && err.stack || err);
    });
  };
})();

// ---- src/state.js
'use strict';
// État de la partie : famille, argent, nourriture, choix. Sauvegarde locale.
(function () {
  const G = window.G;

  // Fiche des huit membres. h = taille de la silhouette en pixels.
  G.FAMILY = ['kenneth', 'ida', 'hattie', 'clay', 'wes', 'henry', 'ruth', 'pearl'];
  G.NEED = { kenneth: 2, ida: 2, hattie: 2, clay: 2, wes: 2, henry: 2, ruth: 2, pearl: 1 }; // en demi-bols

  const MORALE = ['Brisé', 'Abattu', 'Triste', 'Serein', 'Content'];
  const HUNGER = ['Rassasié', 'Faim', 'Affamé', 'Épuisé', 'Mourant'];
  G.moraleLabel = (m) => MORALE[Math.max(0, Math.min(4, Math.round(m)))];
  G.hungerLabel = (h) => HUNGER[Math.max(0, Math.min(4, Math.round(h)))];

  function fresh() {
    const fam = {};
    for (const id of G.FAMILY) fam[id] = { hunger: 1, morale: 2.6 };
    fam.kenneth.morale = 2.2;
    fam.clay.morale = 2.2;
    fam.pearl.morale = 3;
    return {
      ep: 1,
      cp: 0,               // dernier point de sauvegarde atteint
      money: 0,            // cagnotte du loyer, en cents
      rent: 800,           // loyer dû samedi
      ardoise: 1740,       // dette au magasin de la compagnie
      creditLimit: 2500,
      pantry: [],          // [{ id, name, halves, tag }] : demi-bols de nourriture
      fam,
      flags: {},
      log: [],             // faits marquants pour le résumé de fin d'épisode
      startedAt: Date.now(),
      playSeconds: 0,
    };
  }

  G.state = fresh();
  G.newGame = () => { G.state = fresh(); G.snapColor && G.snapColor(); };

  // Espoir : moyenne du moral de la famille, ramenée entre 0 et 1.
  G.espoir = () => {
    const s = G.state;
    let sum = 0;
    for (const id of G.FAMILY) sum += s.fam[id].morale;
    return Math.max(0, Math.min(1, sum / G.FAMILY.length / 4));
  };

  G.flag = (k) => !!G.state.flags[k];
  G.setFlag = (k, v = true) => { G.state.flags[k] = v; };

  // Change le moral d'un ou plusieurs membres : G.mood({ ida: +0.5, all: -0.2 }).
  G.mood = (changes) => {
    for (const [k, v] of Object.entries(changes)) {
      const ids = k === 'all' ? G.FAMILY : [k];
      for (const id of ids) {
        const m = G.state.fam[id];
        if (m) m.morale = Math.max(0, Math.min(4, m.morale + v));
      }
    }
  };

  G.addMoney = (c, why) => {
    G.state.money += c;
    if (why) G.ui && G.ui.toast(`${c >= 0 ? '+' : ''}${G.U.money(c)} · ${why}`);
  };

  // Garde-manger
  G.addFood = (id, name, halves, tag) => {
    G.state.pantry.push({ id, name, halves, tag });
    G.ui && G.ui.toast(`+ ${name}`);
  };
  G.pantryHalves = () => G.state.pantry.reduce((a, f) => a + f.halves, 0);
  G.pantryTags = () => new Set(G.state.pantry.filter((f) => f.halves > 0).map((f) => f.tag));
  // Prend n demi-bols, en vidant d'abord les aliments périssables (poisson).
  G.takeFood = (n) => {
    const order = ['poisson', 'verdure', 'haricots', 'gras', 'grain', 'lait', 'sucre'];
    const items = [...G.state.pantry].sort((a, b) => order.indexOf(a.tag) - order.indexOf(b.tag));
    const used = new Set();
    let left = n;
    for (const it of items) {
      if (left <= 0) break;
      const k = Math.min(it.halves, left);
      it.halves -= k;
      left -= k;
      if (k > 0) used.add(it.tag);
    }
    G.state.pantry = G.state.pantry.filter((f) => f.halves > 0);
    return { taken: n - left, tags: used };
  };

  G.log = (text) => G.state.log.push(text);

  // ------------------------------------------------------------------ sauvegarde
  const KEY = 'tqel-episode1-v1';
  G.save = () => {
    try { localStorage.setItem(KEY, JSON.stringify(G.state)); } catch (_) { /* stockage indisponible */ }
  };
  G.loadSave = () => {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return null;
      const s = JSON.parse(raw);
      return s && s.ep === 1 ? s : null;
    } catch (_) { return null; }
  };
  G.clearSave = () => { try { localStorage.removeItem(KEY); } catch (_) { /* rien */ } };
  G.checkpoint = (n) => {
    if (G.state.cp < n) G.state.cp = n;
    G.save();
  };
})();

// ---- src/art.js
'use strict';
// Dessin : palettes, silhouettes animées, décors, texture de papier, vignettage.
(function () {
  const G = window.G;
  const U = G.U;
  const A = (G.art = {});

  G.PAL = {
    ink: '#1F1A17', paper: '#E8DFCC', sil: '#2B2420', silDark: '#1C1714',
    rust: '#7A2E1A', ochre: '#B8732A', gold: '#D9A441', tobacco: '#5C4A33', octSky: '#9AA5A0',
    coal: '#1C1D21', slate: '#3B4654', frost: '#7D8A96', snow: '#D8D4C8', ember: '#E37A2C',
    moss: '#5E7A3A', sprout: '#A3BE6E',
    wood: '#7E6045', woodDark: '#4A3826', beam: '#2E241B', tin: '#3B4654',
    lamp: '#F6CF78', water: '#6F8FA0', rim: '#F2D27A',
    autumn: ['#7A2E1A', '#B8732A', '#D9A441', '#9C4A22', '#C98F3A', '#5E7A3A'],
  };
  const P = G.PAL;

  // ------------------------------------------------------------------ silhouettes
  // Préréglages des personnages. h : taille en pixels.
  G.CHARS = {
    henry: { h: 134, hat: 'cap', name: 'Henry' },
    kenneth: { h: 168, hat: 'felt', name: 'Papa' },
    ida: { h: 146, hat: 'bun', skirt: true, name: "M'man" },
    hattie: { h: 116, hat: 'bonnet', skirt: true, stoop: 0.22, name: 'Granny' },
    clay: { h: 162, hat: 'cap', name: 'Clay' },
    wes: { h: 166, thin: 0.35, name: 'Wes' },
    ruth: { h: 112, hat: 'braids', skirt: true, name: 'Ruth' },
    pearl: { h: 72, hat: 'bow', skirt: true, name: 'Pearl' },
    otis: { h: 136, hat: 'newsboy', name: 'Otis' },
    pruitt: { h: 156, hat: 'visor', apron: true, belly: 0.2, name: 'Mr. Pruitt' },
    dow: { h: 174, hat: 'felt', thin: 0.45, beard: true, name: 'Dow Slone' },
    nora: { h: 142, hat: 'bonnet', skirt: true, name: 'Mrs. Napier' },
    napierKid: { h: 88, name: 'un petit Napier' },
    napierGirl: { h: 98, skirt: true, hat: 'braids', name: 'une petite Napier' },
    abner: { h: 160, hat: 'felt', beard: true, name: 'Abner Napier' },
    super: { h: 164, hat: 'bowler', coat: true, belly: 0.25, name: 'M. Garvey' },
    whitcomb: { h: 160, hat: 'fedora', coat: true, name: 'M. Whitcomb' },
    thornbury: { h: 152, hat: 'felt', belly: 0.35, coat: true, name: 'M. Thornbury' },
    farris: { h: 162, hat: 'fedora', coat: true, name: 'M. Farris' },
    revenuer: { h: 166, hat: 'felt', coat: true, name: "l'agent" },
    worker1: { h: 160, hat: 'cap', name: 'un ouvrier' },
    worker2: { h: 166, hat: 'felt', name: 'un ouvrier' },
    worker3: { h: 156, hat: 'cap', thin: 0.2, name: 'un ouvrier' },
  };

  // Construit une liste de primitives, puis les dessine (deux passes si contour).
  A.person = (ctx, x, foot, o) => {
    const base = typeof o.char === 'string' ? G.CHARS[o.char] || {} : {};
    o = Object.assign({}, base, o);
    const h = o.h || 140;
    const d = o.dir || 1;
    const prims = [];
    const L = (x1, y1, x2, y2, w) => prims.push({ k: 'l', x1, y1, x2, y2, w });
    const C = (cx, cy, r) => prims.push({ k: 'c', cx, cy, r });
    const E = (cx, cy, rx, ry, rot) => prims.push({ k: 'e', cx, cy, rx, ry, rot: rot || 0 });
    const Pg = (pts) => prims.push({ k: 'p', pts });

    // Celui qui parle : la tête bouge, la main fait des gestes.
    const sid = G.speaking;
    const talking = !!sid && !o.silent && (o.char === sid || (G.WHO_CHAR && G.WHO_CHAR[sid] === o.char));
    const tk = talking ? G.time * 1 + (o.seed || 0) : 0;
    const thin = o.thin || 0;
    const r = h * 0.08;
    const t = h * 0.17 * (1 - 0.28 * thin) * (1 + (o.belly || 0) * 0.5);
    const pose = o.pose || 'stand';
    const ph = o.phase || 0;
    const sw = pose === 'walk' ? Math.sin(ph * Math.PI * 2) : 0;
    const seed = o.seed || 0;
    let bob = pose === 'walk'
      ? -Math.abs(Math.cos(ph * Math.PI * 2)) * h * 0.014
      : Math.sin(G.time * 1.6 + seed) * h * 0.004;
    let stoop = o.stoop || 0;
    let lean = stoop + (o.lean || 0);

    let hip, neck;
    const torsoLen = h * 0.37;
    if (pose === 'sit') {
      const sh = o.seatH != null ? o.seatH : h * 0.27;
      hip = { x: 0, y: -sh };
      L(hip.x, hip.y, h * 0.24, hip.y, h * 0.085);
      L(h * 0.24, hip.y, h * 0.25, -2, h * 0.07);
    } else if (pose === 'crouch' || pose === 'kneel') {
      hip = { x: -h * 0.03, y: -h * 0.27 + bob };
      lean += pose === 'kneel' ? 0.75 : 0.55;
      L(hip.x, hip.y, h * 0.15, -h * 0.2, h * 0.08);
      L(h * 0.15, -h * 0.2, h * 0.07, -2, h * 0.07);
      if (pose === 'kneel') {
        L(hip.x, hip.y, -h * 0.02, -h * 0.03, h * 0.08);
        L(-h * 0.02, -h * 0.03, -h * 0.24, -2, h * 0.07);
      } else {
        L(hip.x, hip.y, -h * 0.1, -h * 0.13, h * 0.08);
        L(-h * 0.1, -h * 0.13, -h * 0.07, -2, h * 0.07);
      }
    } else {
      hip = { x: 0, y: -h * 0.46 + bob };
      const legLen = h * 0.445;
      for (const a of [-sw * 0.42, sw * 0.42]) {
        const fx = Math.sin(a) * legLen;
        const fy = Math.min(-2, hip.y + Math.cos(a) * legLen);
        L(hip.x + (o.skirt ? 0 : 0), hip.y + (o.skirt ? h * 0.3 : 0), fx, fy, h * (o.skirt ? 0.05 : 0.075));
      }
    }
    neck = { x: hip.x + Math.sin(lean) * torsoLen, y: hip.y - Math.cos(lean) * torsoLen };

    // jupe / tablier
    if (o.skirt && pose !== 'sit' && pose !== 'crouch' && pose !== 'kneel') {
      const top = hip.y - h * 0.08;
      const hem = -h * 0.08;
      const s = sw * h * 0.025;
      Pg([[hip.x - h * 0.085, top], [hip.x + h * 0.085, top], [h * 0.16 + s, hem], [-h * 0.15 + s, hem]]);
    } else if (o.skirt && pose === 'sit') {
      Pg([[hip.x - h * 0.08, hip.y - h * 0.05], [h * 0.3, hip.y - h * 0.03], [h * 0.33, -h * 0.12], [h * 0.17, -h * 0.12], [h * 0.1, hip.y + h * 0.04]]);
    }
    if (o.coat && pose !== 'sit') {
      Pg([[hip.x - h * 0.1, hip.y - h * 0.2], [hip.x + h * 0.1, hip.y - h * 0.2], [hip.x + h * 0.12, hip.y + h * 0.12], [hip.x - h * 0.12, hip.y + h * 0.12]]);
    }
    // torse
    const tx = Math.sin(lean), ty = -Math.cos(lean);
    L(hip.x + tx * h * 0.02, hip.y + ty * h * 0.02, neck.x - tx * t * 0.45, neck.y - ty * t * 0.45, t);
    if (o.apron) Pg([[hip.x + h * 0.06, hip.y - h * 0.22], [hip.x + h * 0.1, hip.y - h * 0.22], [hip.x + h * 0.11, hip.y + h * 0.16], [hip.x + h * 0.05, hip.y + h * 0.16]]);

    // bras : angles depuis la verticale (positif = vers l'avant)
    const sh = { x: neck.x + tx * h * 0.02, y: neck.y + h * 0.1 };
    let arms = o.arms;
    if (!arms) {
      if (pose === 'walk') arms = [-sw * 0.5, sw * 0.5];
      else if (pose === 'sit') arms = [0.7, 1.0];
      else if (pose === 'crouch' || pose === 'kneel') arms = [1.4, 1.7];
      else arms = [-0.06, 0.1];
    }
    if (talking) {
      arms = arms.slice();
      const g = Math.sin(tk * 4.2) * 0.22 + Math.sin(tk * 7.1) * 0.08;
      arms[1] = (arms[1] || 0) + (pose === 'walk' ? 0 : 0.45 + g);
    }
    const armLen = h * 0.35;
    const hands = [];
    for (const a of arms) {
      const hx = sh.x + Math.sin(a) * armLen;
      const hy = sh.y + Math.cos(a) * armLen;
      L(sh.x, sh.y, hx, hy, h * 0.055);
      hands.push({ x: hx, y: hy });
    }

    // tête
    const hx = neck.x + tx * r * 0.9 + h * 0.012 + (talking ? Math.sin(tk * 3.3) * h * 0.006 : 0);
    const hy = neck.y - r * 1.05 + (talking ? -Math.abs(Math.sin(tk * 8.5)) * h * 0.008 : 0);
    C(hx, hy, r);
    if (o.beard) E(hx + r * 0.35, hy + r * 0.75, r * 0.55, r * 0.5, 0.3);
    switch (o.hat) {
      case 'felt':
      case 'fedora':
        E(hx, hy - r * 0.45, r * 1.75, r * 0.3);
        Pg([[hx - r * 0.95, hy - r * 0.5], [hx + r * 0.95, hy - r * 0.5], [hx + r * 0.85, hy - r * 1.45], [hx - r * 0.85, hy - r * 1.45]]);
        break;
      case 'bowler':
        E(hx, hy - r * 0.5, r * 1.4, r * 0.25);
        E(hx, hy - r * 0.95, r * 0.95, r * 0.75);
        break;
      case 'cap':
      case 'newsboy':
        E(hx - r * 0.05, hy - r * 0.5, r * (o.hat === 'newsboy' ? 1.2 : 1.05), r * 0.62);
        E(hx + r * 0.95, hy - r * 0.35, r * 0.8, r * 0.2);
        break;
      case 'visor':
        E(hx + r * 0.8, hy - r * 0.55, r * 1.0, r * 0.2, -0.15);
        break;
      case 'bonnet':
        C(hx - r * 0.25, hy - r * 0.15, r * 1.2);
        E(hx + r * 0.7, hy - r * 0.05, r * 0.4, r * 1.25);
        break;
      case 'bun':
        C(hx - r * 0.9, hy - r * 0.45, r * 0.55);
        break;
      case 'braids':
        L(hx - r * 0.85, hy, hx - r * 1.25, hy + r * 2.0, r * 0.42);
        break;
      case 'bow':
        E(hx - r * 0.3, hy - r * 1.0, r * 0.55, r * 0.3, 0.4);
        break;
      default:
        break;
    }

    // accessoires portés
    const front = hands[1] || hands[0];
    const acc = [];
    if (o.carry === 'pails') {
      const swing = Math.sin(G.time * 5 + ph * 6) * 0.15;
      for (let i = 0; i < (o.pails != null ? o.pails : 3); i++) {
        const ax = front.x + i * h * 0.06 - h * 0.05;
        const ay = front.y + h * 0.02;
        acc.push({ k: 'pail', x: ax + Math.sin(swing + i) * 3, y: ay, s: h * 0.075 });
      }
    } else if (o.carry === 'crate') {
      acc.push({ k: 'crate', x: front.x - h * 0.06, y: front.y - h * 0.08, s: h });
    } else if (o.carry === 'sack') {
      acc.push({ k: 'sack', x: sh.x - h * 0.1, y: sh.y - h * 0.05, s: h });
    } else if (o.carry === 'fiddle') {
      acc.push({ k: 'fiddle', x: neck.x + h * 0.08, y: neck.y + h * 0.03, s: h, bow: hands[0] });
    } else if (o.carry === 'pipe') {
      acc.push({ k: 'pipe', x: hx + r * 1.0, y: hy + r * 0.45, s: h });
    } else if (o.carry === 'book') {
      acc.push({ k: 'book', x: front.x, y: front.y, s: h });
    } else if (o.carry === 'rod') {
      acc.push({ k: 'rod', x: front.x, y: front.y, s: h, angle: o.rodAngle || -0.9 });
    } else if (o.carry === 'lantern') {
      acc.push({ k: 'lantern', x: front.x, y: front.y + h * 0.03, s: h });
    } else if (o.carry === 'stick') {
      acc.push({ k: 'stick', x: front.x, y: front.y, s: h });
    } else if (o.carry === 'basket') {
      acc.push({ k: 'basket', x: front.x, y: front.y, s: h });
    }

    const col = o.color || P.sil;
    ctx.save();
    ctx.translate(x, foot);
    if (d < 0) ctx.scale(-1, 1);
    if (o.tilt) ctx.rotate(o.tilt);
    if (o.alpha != null) ctx.globalAlpha *= o.alpha;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    const pass = (color, extra) => {
      ctx.fillStyle = color;
      ctx.strokeStyle = color;
      for (const p of prims) {
        if (p.k === 'l') {
          ctx.lineWidth = p.w + extra * 2;
          ctx.beginPath(); ctx.moveTo(p.x1, p.y1); ctx.lineTo(p.x2, p.y2); ctx.stroke();
        } else if (p.k === 'c') {
          ctx.beginPath(); ctx.arc(p.cx, p.cy, p.r + extra, 0, Math.PI * 2); ctx.fill();
        } else if (p.k === 'e') {
          ctx.beginPath(); ctx.ellipse(p.cx, p.cy, p.rx + extra, p.ry + extra, p.rot, 0, Math.PI * 2); ctx.fill();
        } else if (p.k === 'p') {
          ctx.beginPath();
          p.pts.forEach(([px, py], i) => (i ? ctx.lineTo(px, py) : ctx.moveTo(px, py)));
          ctx.closePath();
          ctx.fill();
          if (extra) { ctx.lineWidth = extra * 2; ctx.stroke(); }
        }
      }
    };
    if (o.rim) pass(o.rim === true ? P.rim : o.rim, 2.2);
    pass(col, 0);
    for (const a of acc) drawAcc(ctx, a, col);
    ctx.restore();
    return { head: { x: x + hx * d, y: foot + hy }, hand: { x: x + front.x * d, y: foot + front.y }, top: foot + hy - r * 1.5 };
  };

  function drawAcc(ctx, a, col) {
    ctx.save();
    switch (a.k) {
      case 'pail': {
        ctx.fillStyle = '#6E6A64';
        ctx.strokeStyle = '#3a3632';
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(a.x, a.y + a.s * 0.5); ctx.stroke();
        ctx.beginPath();
        ctx.roundRect(a.x - a.s * 0.5, a.y + a.s * 0.5, a.s, a.s * 0.9, 2);
        ctx.fill(); ctx.stroke();
        break;
      }
      case 'crate': {
        ctx.fillStyle = '#5C4A33';
        ctx.fillRect(a.x - a.s * 0.12, a.y, a.s * 0.24, a.s * 0.1);
        ctx.fillStyle = 'rgba(205,215,220,0.85)';
        for (let i = 0; i < 3; i++) {
          ctx.beginPath();
          ctx.roundRect(a.x - a.s * 0.1 + i * a.s * 0.075, a.y - a.s * 0.06, a.s * 0.055, a.s * 0.07, 2);
          ctx.fill();
        }
        break;
      }
      case 'sack': {
        ctx.fillStyle = '#B8A782';
        ctx.beginPath(); ctx.ellipse(a.x, a.y, a.s * 0.09, a.s * 0.12, -0.4, 0, Math.PI * 2); ctx.fill();
        break;
      }
      case 'fiddle': {
        ctx.fillStyle = P.rust;
        ctx.beginPath(); ctx.ellipse(a.x, a.y, a.s * 0.075, a.s * 0.04, -0.35, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#3a1a10'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(a.x + a.s * 0.05, a.y - a.s * 0.02); ctx.lineTo(a.x + a.s * 0.17, a.y - a.s * 0.07); ctx.stroke();
        if (a.bow) {
          ctx.strokeStyle = P.paper; ctx.lineWidth = 1.2;
          ctx.beginPath(); ctx.moveTo(a.bow.x - a.s * 0.12, a.bow.y - a.s * 0.1); ctx.lineTo(a.bow.x + a.s * 0.12, a.bow.y + a.s * 0.1); ctx.stroke();
        }
        break;
      }
      case 'pipe': {
        ctx.strokeStyle = col; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(a.x - a.s * 0.02, a.y); ctx.lineTo(a.x + a.s * 0.05, a.y + a.s * 0.01); ctx.stroke();
        ctx.fillStyle = col; ctx.fillRect(a.x + a.s * 0.045, a.y - a.s * 0.025, a.s * 0.025, a.s * 0.035);
        const puff = (G.time * 0.4) % 1;
        ctx.fillStyle = `rgba(220,214,200,${0.35 * (1 - puff)})`;
        ctx.beginPath(); ctx.arc(a.x + a.s * 0.06 + puff * 8, a.y - a.s * 0.05 - puff * 30, 3 + puff * 8, 0, Math.PI * 2); ctx.fill();
        break;
      }
      case 'book':
        ctx.fillStyle = '#8C3B2A';
        ctx.fillRect(a.x - a.s * 0.05, a.y - a.s * 0.06, a.s * 0.09, a.s * 0.065);
        break;
      case 'rod':
        ctx.strokeStyle = '#3a2c1e'; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(a.x + Math.cos(a.angle) * a.s * 1.2, a.y + Math.sin(a.angle) * a.s * 1.2); ctx.stroke();
        break;
      case 'lantern':
        ctx.fillStyle = '#151515'; ctx.fillRect(a.x - 5, a.y, 10, 4);
        ctx.fillStyle = P.lamp; ctx.beginPath(); ctx.ellipse(a.x, a.y + 11, 5, 7, 0, 0, Math.PI * 2); ctx.fill();
        break;
      case 'stick':
        ctx.strokeStyle = '#3a2c1e'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(a.x, a.y - a.s * 0.1); ctx.lineTo(a.x + a.s * 0.05, a.y + a.s * 0.35); ctx.stroke();
        break;
      case 'basket':
        ctx.fillStyle = '#8C6A48';
        ctx.beginPath(); ctx.ellipse(a.x, a.y + a.s * 0.04, a.s * 0.07, a.s * 0.045, 0, 0, Math.PI); ctx.fill();
        break;
      default: break;
    }
    ctx.restore();
  }

  // Raccourci : dessine un personnage par son identifiant.
  A.char = (ctx, id, x, foot, o = {}) => A.person(ctx, x, foot, Object.assign({ char: id }, o));

  // ------------------------------------------------------------------ hors-écran et cache
  const cache = new Map();
  A.canvas = (w, h, scale = 1) => {
    const c = document.createElement('canvas');
    c.width = Math.round(w * scale);
    c.height = Math.round(h * scale);
    const cx = c.getContext('2d');
    cx.setTransform(scale, 0, 0, scale, 0, 0);
    return { c, cx, w, h };
  };
  // Dessine une fois, réutilise ensuite (décors statiques).
  A.cached = (key, w, h, draw, scale) => {
    if (cache.has(key)) return cache.get(key);
    const s = scale || Math.min(G.dpr, 1.5);
    const o = A.canvas(w, h, s);
    draw(o.cx, w, h);
    cache.set(key, o);
    return o;
  };
  A.blit = (ctx, o, x, y) => ctx.drawImage(o.c, x, y, o.w, o.h);
  A.clearCache = (prefix) => { for (const k of cache.keys()) if (!prefix || k.startsWith(prefix)) cache.delete(k); };

  // Tuile de grain (papier / photo).
  let grainTile = null;
  A.grainTile = () => {
    if (grainTile) return grainTile;
    const o = A.canvas(256, 256, 1);
    const img = o.cx.createImageData(256, 256);
    const rnd = U.rng(77);
    for (let i = 0; i < img.data.length; i += 4) {
      const v = 128 + (rnd() - 0.5) * 90 + (rnd() - 0.5) * 40;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
      img.data[i + 3] = 255;
    }
    o.cx.putImageData(img, 0, 0);
    grainTile = o.c;
    return grainTile;
  };
  // Texture peinte : grain en « overlay » sur une zone.
  A.texture = (ctx, w, h, strength = 0.18) => {
    ctx.save();
    ctx.globalAlpha = strength;
    ctx.globalCompositeOperation = 'overlay';
    ctx.fillStyle = ctx.createPattern(A.grainTile(), 'repeat');
    ctx.fillRect(0, 0, w, h);
    ctx.restore();
  };
  // Grain animé plein écran + vignettage, à appeler en fin de draw().
  A.finish = (ctx, opts = {}) => {
    const g = A.grainTile();
    ctx.save();
    ctx.globalAlpha = opts.grain != null ? opts.grain : 0.045;
    ctx.globalCompositeOperation = 'overlay';
    const ox = (G.frame * 37) % 256, oy = (G.frame * 91) % 256;
    ctx.translate(-ox, -oy);
    ctx.fillStyle = ctx.createPattern(g, 'repeat');
    ctx.fillRect(0, 0, G.W + 256, G.H + 256);
    ctx.restore();
    const v = A.cached('vignette', G.W, G.H, (cx, w, h) => {
      const gr = cx.createRadialGradient(w / 2, h / 2, h * 0.35, w / 2, h / 2, h * 0.95);
      gr.addColorStop(0, 'rgba(0,0,0,0)');
      gr.addColorStop(1, 'rgba(10,6,4,0.62)');
      cx.fillStyle = gr;
      cx.fillRect(0, 0, w, h);
    }, 0.5);
    ctx.save();
    ctx.globalAlpha = opts.vignette != null ? opts.vignette : 1;
    A.blit(ctx, v, 0, 0);
    ctx.restore();
  };

  // ------------------------------------------------------------------ éléments de décor
  A.sky = (ctx, w, h, stops) => {
    const g = ctx.createLinearGradient(0, 0, 0, h);
    stops.forEach(([o, c]) => g.addColorStop(o, c));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
  };

  // Crête lissée remplie jusqu'en bas. pts : [[x, y], ...]
  A.ridge = (ctx, pts, color, bottom) => {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(pts[0][0], bottom);
    ctx.lineTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length - 1; i++) {
      const mx = (pts[i][0] + pts[i + 1][0]) / 2;
      const my = (pts[i][1] + pts[i + 1][1]) / 2;
      ctx.quadraticCurveTo(pts[i][0], pts[i][1], mx, my);
    }
    const lp = pts[pts.length - 1];
    ctx.lineTo(lp[0], lp[1]);
    ctx.lineTo(lp[0], bottom);
    ctx.closePath();
    ctx.fill();
  };
  // Hauteur d'une crête en x (interpolation linéaire, suffisante pour placer des arbres).
  A.ridgeY = (pts, x) => {
    for (let i = 0; i < pts.length - 1; i++) {
      const [x1, y1] = pts[i], [x2, y2] = pts[i + 1];
      if (x >= x1 && x <= x2) return y1 + (y2 - y1) * (x - x1) / (x2 - x1);
    }
    return pts[pts.length - 1][1];
  };
  // Génère une crête aléatoire régulière.
  A.makeRidge = (seed, w, yBase, amp, step = 140) => {
    const rnd = U.rng(seed);
    const pts = [];
    for (let x = -step; x <= w + step; x += step) pts.push([x, yBase + (rnd() - 0.5) * amp * 2]);
    return pts;
  };
  // Feuillage en touches de couleur.
  A.dots = (ctx, seed, n, xa, xb, yFn, colors, rmin, rmax, amin = 0.6, amax = 0.95) => {
    const rnd = U.rng(seed);
    for (let i = 0; i < n; i++) {
      const x = xa + rnd() * (xb - xa);
      const [y1, y2] = yFn(x);
      const y = y1 + rnd() * (y2 - y1);
      ctx.globalAlpha = amin + rnd() * (amax - amin);
      ctx.fillStyle = colors[Math.floor(rnd() * colors.length)];
      ctx.beginPath();
      ctx.arc(x, y, rmin + rnd() * (rmax - rmin), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  };
  // Arbre : tronc effilé et houppier en touches.
  A.tree = (ctx, x, ground, h, trunk, leaves, seed) => {
    ctx.fillStyle = trunk;
    ctx.beginPath();
    ctx.moveTo(x - h * 0.035, ground);
    ctx.lineTo(x - h * 0.012, ground - h * 0.75);
    ctx.lineTo(x + h * 0.012, ground - h * 0.75);
    ctx.lineTo(x + h * 0.035, ground);
    ctx.fill();
    ctx.strokeStyle = trunk;
    ctx.lineWidth = h * 0.012;
    ctx.beginPath();
    ctx.moveTo(x, ground - h * 0.5); ctx.lineTo(x - h * 0.15, ground - h * 0.7);
    ctx.moveTo(x, ground - h * 0.6); ctx.lineTo(x + h * 0.14, ground - h * 0.82);
    ctx.stroke();
    if (leaves && leaves.length) {
      A.dots(ctx, seed || x, Math.round(h * 0.45), x - h * 0.3, x + h * 0.3,
        (px) => { const k = 1 - Math.abs(px - x) / (h * 0.3); return [ground - h * (0.6 + 0.4 * k), ground - h * (0.55 - 0.1 * k)]; },
        leaves, h * 0.03, h * 0.07);
    }
  };

  // Maison de compagnie vue de l'extérieur, sur pilotis. x = bord gauche, ground = sol.
  A.campHouse = (ctx, x, ground, o = {}) => {
    const w = o.w || 230, wallH = o.h || 110, stilt = o.stilt || 26;
    const floor = ground - stilt;
    ctx.fillStyle = P.beam;
    for (let i = 0; i < 4; i++) ctx.fillRect(x + 8 + i * (w - 24) / 3, floor, 7, stilt);
    ctx.fillStyle = o.wall || '#6E5640';
    ctx.fillRect(x, floor - wallH, w, wallH);
    ctx.strokeStyle = 'rgba(30,22,16,0.45)';
    ctx.lineWidth = 2;
    for (let bx = x + 12; bx < x + w; bx += 16) { ctx.beginPath(); ctx.moveTo(bx, floor - wallH); ctx.lineTo(bx, floor); ctx.stroke(); }
    ctx.fillStyle = o.roof || P.tin;
    ctx.beginPath();
    ctx.moveTo(x - 14, floor - wallH + 4);
    ctx.lineTo(x + w / 2, floor - wallH - (o.pitch || 52));
    ctx.lineTo(x + w + 14, floor - wallH + 4);
    ctx.fill();
    // porche
    ctx.fillStyle = P.beam;
    ctx.fillRect(x - 6, floor - 4, w + 12, 6);
    ctx.fillRect(x + 6, floor - wallH + 18, 5, wallH - 18);
    ctx.fillRect(x + w - 11, floor - wallH + 18, 5, wallH - 18);
    // porte et fenêtres
    ctx.fillStyle = '#2E241B';
    ctx.fillRect(x + w * 0.42, floor - wallH * 0.68, w * 0.14, wallH * 0.68);
    const lit = o.lit;
    for (const wx of [x + w * 0.14, x + w * 0.68]) {
      ctx.fillStyle = lit ? '#F2B65A' : '#2a2a2c';
      ctx.fillRect(wx, floor - wallH * 0.7, w * 0.16, wallH * 0.36);
      ctx.strokeStyle = P.beam; ctx.lineWidth = 3;
      ctx.strokeRect(wx, floor - wallH * 0.7, w * 0.16, wallH * 0.36);
    }
    // tuyau de poêle
    ctx.fillStyle = '#151518';
    ctx.fillRect(x + w * 0.7, floor - wallH - 70, 8, 44);
    if (o.smoke !== false) {
      for (let i = 0; i < 4; i++) {
        const k = ((G.time * 0.25 + i * 0.25) % 1);
        ctx.fillStyle = `rgba(200,194,182,${0.4 * (1 - k)})`;
        ctx.beginPath(); ctx.arc(x + w * 0.7 + 4 + k * 30, floor - wallH - 74 - k * 60, 5 + k * 12, 0, Math.PI * 2); ctx.fill();
      }
    }
  };

  // Le sol en planches d'une passerelle ou d'un perron.
  A.boards = (ctx, x, y, w, h, color) => {
    ctx.fillStyle = color || '#4A3826';
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = 'rgba(20,14,10,0.5)';
    ctx.lineWidth = 1;
    for (let bx = x + 14; bx < x + w; bx += 14) { ctx.beginPath(); ctx.moveTo(bx, y); ctx.lineTo(bx, y + h); ctx.stroke(); }
  };

  // Lueur radiale (lampe, poêle, lanterne).
  A.glow = (ctx, x, y, r, color, alpha = 0.5) => {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, color);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  };
})();

// ---- src/ui.js
'use strict';
// Interface : texte, boutons, notifications, carnet d'Henry, consignes.
(function () {
  const G = window.G;
  const U = G.U;
  const I = G.input;
  const ui = (G.ui = {});

  G.FONT = {
    serif: "'EB Garamond', Georgia, 'Times New Roman', serif",
    hand: "'Caveat', 'Segoe Print', 'Bradley Hand', cursive",
  };
  ui.font = (size, kind = 'serif', style = '') => `${style} ${size}px ${G.FONT[kind] || G.FONT.serif}`.trim();

  const wrapCache = new Map();
  ui.wrap = (ctx, str, maxW) => {
    const key = ctx.font + '|' + maxW + '|' + str;
    if (wrapCache.has(key)) return wrapCache.get(key);
    const out = [];
    for (const para of String(str).split('\n')) {
      const words = para.split(' ');
      let line = '';
      for (const w of words) {
        const test = line ? line + ' ' + w : w;
        if (ctx.measureText(test).width > maxW && line) { out.push(line); line = w; } else line = test;
      }
      out.push(line);
    }
    if (wrapCache.size > 600) wrapCache.clear();
    wrapCache.set(key, out);
    return out;
  };

  // Texte avec retour à la ligne. Renvoie la hauteur occupée.
  ui.text = (ctx, str, x, y, o = {}) => {
    const size = o.size || 22;
    const style = `${o.italic ? 'italic ' : ''}${o.bold ? '600 ' : ''}`;
    ctx.font = ui.font(size, o.kind || 'serif', style);
    ctx.fillStyle = o.color || G.PAL.paper;
    ctx.textAlign = o.align || 'left';
    ctx.textBaseline = o.base || 'alphabetic';
    const prevA = ctx.globalAlpha;
    if (o.alpha != null) ctx.globalAlpha = prevA * o.alpha;
    const lh = o.lineH || size * 1.28;
    const lines = o.maxW ? ui.wrap(ctx, str, o.maxW) : String(str).split('\n');
    if (o.shadow) { ctx.shadowColor = 'rgba(0,0,0,0.7)'; ctx.shadowBlur = 6; }
    lines.forEach((l, i) => ctx.fillText(l, x, y + i * lh));
    ctx.shadowBlur = 0;
    ctx.globalAlpha = prevA;
    return { h: lines.length * lh, lines };
  };

  // Petites capitales espacées (étiquettes).
  ui.caps = (ctx, str, x, y, o = {}) => {
    const size = o.size || 14;
    ctx.font = ui.font(size, 'serif', '600');
    ctx.fillStyle = o.color || G.PAL.paper;
    ctx.textAlign = 'left';
    ctx.textBaseline = o.base || 'alphabetic';
    const s = String(str).toUpperCase();
    const sp = o.spacing != null ? o.spacing : size * 0.18;
    let w = 0;
    for (const ch of s) w += ctx.measureText(ch).width + sp;
    w -= sp;
    let cx = o.align === 'center' ? x - w / 2 : o.align === 'right' ? x - w : x;
    const prevA = ctx.globalAlpha;
    if (o.alpha != null) ctx.globalAlpha = prevA * o.alpha;
    for (const ch of s) { ctx.fillText(ch, cx, y); cx += ctx.measureText(ch).width + sp; }
    ctx.globalAlpha = prevA;
    return w;
  };

  // ------------------------------------------------------------------ boutons
  ui.hover = (r) => I.mouse && U.inRect(I, r);
  // Clic dans un rectangle. overlay=true : utilisable depuis une superposition modale.
  ui.hit = (r, overlay = false) => (overlay || !G.blocked) && I.pressed && U.inRect(I, r);

  ui.button = (ctx, r, label, o = {}) => {
    const hov = o.hover != null ? o.hover : ui.hover(r);
    const disabled = !!o.disabled;
    ctx.save();
    if (o.style === 'paper') {
      ctx.fillStyle = disabled ? 'rgba(232,223,204,0.45)' : hov ? '#F3ECDB' : G.PAL.paper;
      ctx.strokeStyle = hov ? G.PAL.rust : 'rgba(31,26,23,0.5)';
    } else {
      ctx.fillStyle = disabled ? 'rgba(31,26,23,0.55)' : hov ? 'rgba(52,42,34,0.96)' : 'rgba(31,26,23,0.9)';
      ctx.strokeStyle = hov ? G.PAL.rim : 'rgba(232,223,204,0.35)';
    }
    ctx.lineWidth = hov ? 2 : 1;
    ctx.beginPath();
    ctx.roundRect(r.x, r.y, r.w, r.h, 6);
    ctx.fill();
    ctx.stroke();
    const color = o.style === 'paper' ? G.PAL.ink : disabled ? 'rgba(232,223,204,0.45)' : G.PAL.paper;
    ui.text(ctx, label, r.x + (o.align === 'left' ? 18 : r.w / 2), r.y + r.h / 2 + 1, {
      size: o.size || 22, color, align: o.align === 'left' ? 'left' : 'center', base: 'middle', italic: o.italic,
    });
    if (o.key) ui.text(ctx, o.key, r.x + r.w - 14, r.y + r.h / 2 + 1, { size: 15, color: 'rgba(232,223,204,0.45)', align: 'right', base: 'middle' });
    ctx.restore();
    return hov;
  };

  // ------------------------------------------------------------------ notifications
  const toasts = [];
  ui.toast = (text, o = {}) => toasts.push({ text, t: 0, life: o.life || 2.8, color: o.color });
  ui.drawToasts = (ctx, dt) => {
    let y = 66;
    for (let i = 0; i < toasts.length; i++) {
      const t = toasts[i];
      t.t += dt;
      const a = Math.min(1, t.t * 4) * Math.min(1, (t.life - t.t) * 2);
      ctx.save();
      ctx.globalAlpha = Math.max(0, a);
      ctx.font = ui.font(20, 'serif', 'italic');
      const w = ctx.measureText(t.text).width + 36;
      ctx.fillStyle = 'rgba(31,26,23,0.88)';
      ctx.beginPath();
      ctx.roundRect(G.W - w - 24, y, w, 38, 6);
      ctx.fill();
      ui.text(ctx, t.text, G.W - 24 - 18, y + 20, { size: 20, italic: true, align: 'right', base: 'middle', color: t.color || G.PAL.paper });
      ctx.restore();
      y += 46;
    }
    for (let i = toasts.length - 1; i >= 0; i--) if (toasts[i].t > toasts[i].life) toasts.splice(i, 1);
  };

  // ------------------------------------------------------------------ carnet d'Henry (HUD)
  // Petite page de cahier en haut à gauche : la date et l'objectif du moment.
  ui.notebook = (ctx, x, y, w, lines, o = {}) => {
    const lh = o.lineH || 26;
    const h = 18 + lines.length * lh + 6;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(o.rot != null ? o.rot : -0.012);
    ctx.shadowColor = 'rgba(0,0,0,0.45)';
    ctx.shadowBlur = 10;
    ctx.shadowOffsetY = 3;
    ctx.fillStyle = '#EFE8D6';
    ctx.fillRect(0, 0, w, h);
    ctx.shadowBlur = 0;
    ctx.shadowOffsetY = 0;
    ctx.strokeStyle = '#9AB0C0';
    ctx.lineWidth = 1;
    for (let i = 0; i < lines.length; i++) {
      ctx.beginPath(); ctx.moveTo(6, 22 + i * lh + 6); ctx.lineTo(w - 6, 22 + i * lh + 6); ctx.stroke();
    }
    ctx.strokeStyle = '#C0605A';
    ctx.beginPath(); ctx.moveTo(26, 0); ctx.lineTo(26, h); ctx.stroke();
    lines.forEach((l, i) => {
      const txt = typeof l === 'string' ? l : l.t;
      ui.text(ctx, txt, 34, 22 + i * lh, { size: (typeof l === 'object' && l.size) || 22, kind: 'hand', color: (typeof l === 'object' && l.color) || '#2A3A5A' });
    });
    ctx.restore();
    return h;
  };

  // HUD standard : date + objectif + cagnotte du loyer.
  G.hud = { date: '', goal: '', show: true, money: false };
  ui.drawHud = (ctx) => {
    if (!G.hud.show || !G.hud.date) return;
    const lines = [{ t: G.hud.date, size: 24 }];
    if (G.hud.goal) lines.push(G.hud.goal);
    if (G.hud.money) lines.push(`Loyer de samedi : ${U.money(G.state.money)} / ${U.money(G.state.rent)}`);
    ui.notebook(ctx, 22, 18, 380, lines);
  };

  // Consigne de mini-jeu en haut au centre.
  ui.hint = (ctx, text, o = {}) => {
    ctx.save();
    ctx.font = ui.font(o.size || 21, 'serif', 'italic');
    const w = ctx.measureText(text).width + 44;
    const x = G.W / 2 - w / 2, y = o.y || 20;
    ctx.fillStyle = 'rgba(20,16,13,0.82)';
    ctx.beginPath(); ctx.roundRect(x, y, w, 40, 20); ctx.fill();
    ui.text(ctx, text, G.W / 2, y + 21, { size: o.size || 21, italic: true, align: 'center', base: 'middle' });
    ctx.restore();
  };

  // Étiquette au-dessus d'un élément interactif.
  ui.tag = (ctx, text, x, y, o = {}) => {
    ctx.save();
    ctx.font = ui.font(18, 'serif', 'italic');
    const w = ctx.measureText(text).width + 24;
    const bob = Math.sin(G.time * 3) * 2;
    ctx.fillStyle = o.active ? 'rgba(242,210,122,0.95)' : 'rgba(232,223,204,0.88)';
    ctx.beginPath(); ctx.roundRect(x - w / 2, y - 30 + bob, w, 28, 14); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x - 6, y - 3 + bob); ctx.lineTo(x + 6, y - 3 + bob); ctx.lineTo(x, y + 4 + bob); ctx.fill();
    ui.text(ctx, text, x, y - 16 + bob, { size: 18, italic: true, color: G.PAL.ink, align: 'center', base: 'middle' });
    ctx.restore();
  };

  // Jauge horizontale simple.
  ui.bar = (ctx, x, y, w, h, v, o = {}) => {
    ctx.save();
    ctx.fillStyle = o.bg || 'rgba(20,16,13,0.75)';
    ctx.beginPath(); ctx.roundRect(x, y, w, h, h / 2); ctx.fill();
    ctx.fillStyle = o.color || G.PAL.gold;
    ctx.beginPath(); ctx.roundRect(x, y, Math.max(h, w * U.clamp(v, 0, 1)), h, h / 2); ctx.fill();
    ctx.restore();
  };
})();

// Chargement des polices (avec délai maximal : le jeu démarre quand même hors ligne).
(function () {
  const G = window.G;
  G.loadFonts = () => {
    if (!document.fonts || !document.fonts.load) return Promise.resolve();
    const loads = ['27px "EB Garamond"', 'italic 27px "EB Garamond"', '600 15px "EB Garamond"', '22px "Caveat"']
      .map((f) => document.fonts.load(f).catch(() => null));
    return Promise.race([Promise.all(loads), new Promise((r) => setTimeout(r, 2500))]);
  };
})();
