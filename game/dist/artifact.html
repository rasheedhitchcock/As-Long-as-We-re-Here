'use strict';
// Dialogues : répliques, narration, cartons, choix (éventuellement minutés), scripts.
(function () {
  const G = window.G;
  const U = G.U;
  const I = G.input;
  const ui = G.ui;
  const P = G.PAL;

  // Qui parle : nom affiché et couleur du nom.
  G.WHO = {
    henry: { name: 'Henry', color: '#F2D27A' },
    ida: { name: "M'man", color: '#E9B98A' },
    kenneth: { name: 'Papa', color: '#CBB89A' },
    hattie: { name: 'Granny', color: '#D9C3E3' },
    clay: { name: 'Clay', color: '#E58C6A' },
    wes: { name: 'Wes', color: '#AECBA2' },
    ruth: { name: 'Ruth', color: '#B7D0E6' },
    pearl: { name: 'Pearl', color: '#F3B7C3' },
    otis: { name: 'Otis', color: '#9FD6C9' },
    pruitt: { name: 'Mr. Pruitt', color: '#C6BFAE' },
    dow: { name: 'Dow Slone', color: '#D9A441' },
    nora: { name: 'Mrs. Napier', color: '#DDB49E' },
    abner: { name: 'Abner Napier', color: '#C9A98A' },
    kid: { name: 'Le petit Napier', color: '#E6C8A0' },
    garvey: { name: 'M. Garvey', color: '#ADB3B8' },
    whitcomb: { name: 'M. Whitcomb', color: '#B3C7DA' },
    thornbury: { name: 'M. Thornbury', color: '#CDB27C' },
    farris: { name: 'M. Farris', color: '#B4B4B4' },
    worker: { name: 'Un ouvrier', color: '#C2B49C' },
    crowd: { name: 'Les hommes', color: '#C2B49C' },
    agent: { name: "L'agent", color: '#B4B4B4' },
    old: { name: 'Henry, bien plus tard', color: '#E8DFCC' },
  };

  // Identifiants de dialogue qui ne correspondent pas à un identifiant de personnage.
  G.WHO_CHAR = { garvey: 'super', kid: 'napierKid', agent: 'revenuer' };
  G.speaking = null;

  const BOX = { x: 70, y: G.H - 178, w: G.W - 140, h: 164 };
  const CPS = 52; // caractères par seconde

  // ------------------------------------------------------------------ réplique
  G.say = (who, text, o = {}) => new Promise((resolve) => {
    const info = G.WHO[who] || { name: who, color: P.paper };
    const nar = who === 'nar';
    const ov = {
      modal: true,
      shown: 0,
      t: 0,
      update(dt, top) {
        if (!top) return;
        this.t += dt;
        this.shown = Math.min(text.length, this.shown + dt * (o.cps || CPS));
        // Le personnage « parle » tant que son texte s'affiche.
        G.speaking = !nar && this.shown < text.length ? who : null;
        const close = () => { G.speaking = null; G.popOverlay(ov); resolve(); };
        if (this.t > 0.12 && I.confirm()) {
          I.consume();
          if (this.shown < text.length) this.shown = text.length;
          else close();
        }
        if (o.auto && this.shown >= text.length && this.t > text.length / CPS + o.auto) close();
      },
      draw(ctx) {
        const a = Math.min(1, this.t * 6);
        ctx.globalAlpha = a;
        ctx.fillStyle = 'rgba(18,14,12,0.9)';
        ctx.beginPath(); ctx.roundRect(BOX.x, BOX.y, BOX.w, BOX.h, 8); ctx.fill();
        ctx.strokeStyle = 'rgba(232,223,204,0.18)';
        ctx.lineWidth = 1;
        ctx.stroke();
        let ty = BOX.y + 44;
        if (!nar) {
          ui.caps(ctx, info.name, BOX.x + 34, BOX.y + 32, { size: 15, color: info.color });
          ty = BOX.y + 68;
        } else ty = BOX.y + 50;
        ui.text(ctx, text.slice(0, Math.floor(this.shown)), BOX.x + 34, ty, {
          size: 26, maxW: BOX.w - 80, lineH: 33, italic: nar, color: nar ? '#D8CFBC' : P.paper,
        });
        if (this.shown >= text.length) {
          const b = Math.sin(G.time * 5) * 3;
          ctx.fillStyle = 'rgba(232,223,204,0.6)';
          ctx.beginPath();
          ctx.moveTo(BOX.x + BOX.w - 40, BOX.y + BOX.h - 30 + b);
          ctx.lineTo(BOX.x + BOX.w - 26, BOX.y + BOX.h - 30 + b);
          ctx.lineTo(BOX.x + BOX.w - 33, BOX.y + BOX.h - 21 + b);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      },
    };
    G.pushOverlay(ov);
  });

  // ------------------------------------------------------------------ narration plein écran
  // Le texte apparaît paragraphe par paragraphe sur un fond sombre.
  G.narrate = (text, o = {}) => new Promise((resolve) => {
    const paras = Array.isArray(text) ? text : [text];
    const ov = {
      modal: true, t: 0, i: 0, shown: 0, out: -1,
      update(dt, top) {
        if (!top) return;
        this.t += dt;
        if (this.out >= 0) {
          this.out += dt * 2.2;
          if (this.out >= 1) { G.popOverlay(ov); resolve(); }
          return;
        }
        const cur = paras[this.i];
        this.shown = Math.min(cur.length, this.shown + dt * (o.cps || 38));
        if (this.t > 0.25 && I.confirm()) {
          I.consume();
          if (this.shown < cur.length) this.shown = cur.length;
          else if (this.i < paras.length - 1) { this.i++; this.shown = 0; }
          else this.out = 0;
        }
      },
      draw(ctx) {
        const a = Math.min(1, this.t * 2.5) * (this.out >= 0 ? 1 - this.out : 1);
        ctx.globalAlpha = a * (o.dim != null ? o.dim : 0.86);
        ctx.fillStyle = '#0d0b0a';
        ctx.fillRect(0, 0, G.W, G.H);
        ctx.globalAlpha = a;
        // Les paragraphes déjà lus restent, plus pâles, au-dessus.
        let y = o.y || 230;
        for (let k = 0; k <= this.i; k++) {
          const full = paras[k];
          const s = k < this.i ? full : full.slice(0, Math.floor(this.shown));
          const r = ui.text(ctx, s, G.W / 2, y, {
            size: o.size || 31, italic: true, align: 'center', maxW: 860, lineH: 44,
            color: k < this.i ? 'rgba(232,223,204,0.45)' : P.paper,
          });
          ctx.globalAlpha = a;
          ctx.font = ui.font(o.size || 31, 'serif', 'italic');
          y += ui.wrap(ctx, full, 860).length * 44 + 26;
        }
        if (o.who) ui.caps(ctx, G.WHO[o.who] ? G.WHO[o.who].name : o.who, G.W / 2, (o.y || 230) - 60, { align: 'center', size: 15, color: 'rgba(232,223,204,0.55)' });
        if (paras[this.i] && this.shown >= paras[this.i].length) {
          ui.text(ctx, 'Clique ou appuie sur Espace', G.W / 2, G.H - 50, { size: 16, italic: true, align: 'center', color: 'rgba(232,223,204,0.35)' });
        }
        ctx.globalAlpha = 1;
      },
    };
    G.pushOverlay(ov);
  });

  // ------------------------------------------------------------------ carton (date, titre)
  G.card = (title, sub, o = {}) => new Promise((resolve) => {
    const dur = o.dur || 3.2;
    const ov = {
      modal: true, t: 0,
      update(dt, top) {
        this.t += dt;
        if (top && this.t > 0.6 && I.confirm()) { I.consume(); this.t = Math.max(this.t, dur - 0.5); }
        if (this.t >= dur) { G.popOverlay(ov); resolve(); }
      },
      draw(ctx) {
        const k = this.t < 0.6 ? this.t / 0.6 : this.t > dur - 0.6 ? (dur - this.t) / 0.6 : 1;
        ctx.globalAlpha = (o.bgAlpha != null ? o.bgAlpha : 1) * Math.min(1, k * 1.5);
        ctx.fillStyle = '#0d0b0a';
        ctx.fillRect(0, 0, G.W, G.H);
        ctx.globalAlpha = Math.max(0, k);
        if (o.eyebrow) ui.caps(ctx, o.eyebrow, G.W / 2, G.H / 2 - 66, { align: 'center', size: 16, color: 'rgba(232,223,204,0.6)', spacing: 5 });
        ui.text(ctx, title, G.W / 2, G.H / 2, { size: o.size || 54, align: 'center', base: 'middle', kind: o.kind || 'serif' });
        if (sub) ui.text(ctx, sub, G.W / 2, G.H / 2 + 56, { size: 24, italic: true, align: 'center', color: 'rgba(232,223,204,0.75)' });
        ctx.globalAlpha = 1;
      },
    };
    G.pushOverlay(ov);
  });

  // ------------------------------------------------------------------ choix
  // options : [{ t: 'texte', ... }]. o.timer : secondes avant le choix par défaut
  // (o.def, sinon la dernière option, souvent « Se taire »).
  G.choose = (options, o = {}) => new Promise((resolve) => {
    const n = options.length;
    const rowH = 54;
    const h = 30 + n * (rowH + 10) + (o.prompt ? 40 : 0);
    const y0 = G.H - h - 26;
    const rects = options.map((_, i) => ({ x: 170, y: y0 + (o.prompt ? 52 : 22) + i * (rowH + 10), w: G.W - 340, h: rowH }));
    let sel = -1;
    const ov = {
      modal: true, t: 0,
      update(dt, top) {
        if (!top) return;
        this.t += dt;
        if (this.t < 0.2) return;
        let pick = -1;
        for (let i = 0; i < n; i++) {
          if (ui.hit(rects[i], true)) pick = i;
          if (I.hit('Digit' + (i + 1)) || I.hit('Numpad' + (i + 1))) pick = i;
        }
        if (I.hit('ArrowDown')) sel = (sel + 1) % n;
        if (I.hit('ArrowUp')) sel = (sel - 1 + n) % n;
        if (sel >= 0 && (I.hit('Enter') || I.hit('Space'))) pick = sel;
        if (o.timer && this.t > o.timer + 0.2) pick = o.def != null ? o.def : n - 1;
        if (pick >= 0) {
          I.consume();
          G.popOverlay(ov);
          G.audio && G.audio.sfx('click');
          resolve(pick);
        }
      },
      draw(ctx) {
        const a = Math.min(1, this.t * 6);
        ctx.globalAlpha = a;
        ctx.fillStyle = 'rgba(18,14,12,0.9)';
        ctx.beginPath(); ctx.roundRect(140, y0, G.W - 280, h, 8); ctx.fill();
        if (o.prompt) ui.text(ctx, o.prompt, G.W / 2, y0 + 36, { size: 22, italic: true, align: 'center', color: '#D8CFBC' });
        if (o.timer) {
          const k = U.clamp(1 - (this.t - 0.2) / o.timer, 0, 1);
          ctx.fillStyle = k < 0.3 ? G.PAL.ember : G.PAL.gold;
          ctx.fillRect(140, y0, (G.W - 280) * k, 4);
        }
        options.forEach((op, i) => {
          const r = rects[i];
          const hov = ui.hover(r) || sel === i;
          ui.button(ctx, r, op.t, { hover: hov, align: 'left', size: 23, key: String(i + 1), italic: !!op.silent });
        });
        ctx.globalAlpha = 1;
      },
    };
    G.pushOverlay(ov);
  });

  // ------------------------------------------------------------------ scripts
  // Entrées possibles :
  //   ['ida', 'texte']           réplique
  //   'texte'                    narration dans la boîte
  //   { N: 'texte' | [...] }     narration plein écran
  //   { old: 'texte' }           voix du vieil Henry (plein écran)
  //   { c: [options], prompt, timer, def }  choix ; option : { t, set, mood, note, log, do, then, if }
  //   { if: cond, then: [...], else: [...] }  cond : 'flag', '!flag' ou fonction
  //   { do: fn }  { wait: s }  { set: {...} }  { mood: {...} }  { note: 'texte' }  { sfx: 'nom' }
  //   { card: 'titre', sub: '...' }
  const test = (cond) => {
    if (typeof cond === 'function') return !!cond(G.state);
    if (typeof cond === 'string') return cond[0] === '!' ? !G.flag(cond.slice(1)) : G.flag(cond);
    return !!cond;
  };
  G.test = test;

  const apply = (e) => {
    if (e.set) for (const [k, v] of Object.entries(e.set)) G.setFlag(k, v);
    if (e.mood) G.mood(e.mood);
    if (e.note) ui.toast(e.note, { color: G.PAL.rim });
    if (e.log) G.log(e.log);
  };

  G.run = async (script) => {
    for (const e of script) {
      if (e == null) continue;
      if (Array.isArray(e)) { await G.say(e[0], e[1]); continue; }
      if (typeof e === 'string') { await G.say('nar', e); continue; }
      if (e.N) { await G.narrate(e.N, e); continue; }
      if (e.old) { await G.narrate(e.old, { who: 'old' }); continue; }
      if (e.card) { await G.card(e.card, e.sub, e); continue; }
      if (e.c) {
        const opts = e.c.filter((op) => op.if == null || test(op.if));
        const i = await G.choose(opts, e);
        const op = opts[i];
        apply(op);
        if (op.do) await op.do();
        if (op.then) await G.run(op.then);
        if (e.after) await G.run(e.after);
        continue;
      }
      if (e.if != null) {
        if (test(e.if)) { if (e.then) await G.run(e.then); } else if (e.else) await G.run(e.else);
        continue;
      }
      apply(e);
      if (e.sfx) G.audio && G.audio.sfx(e.sfx);
      if (e.do) await e.do();
      if (e.wait) await G.wait(e.wait);
    }
  };
})();

// ---- src/audio.js
'use strict';
// Son entièrement synthétisé (Web Audio) : ambiances, musique, bruitages.
// Le contexte audio ne démarre qu'après une première interaction du joueur.
(function () {
  const G = window.G;
  const A = (G.audio = { ctx: null, muted: false });
  let ac = null, master, musicBus, sfxBus, ambBus, noiseBuf;
  let wantAmb = [], wantSong = null;

  A.unlock = () => {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    try { ac = new Ctx(); } catch (_) { return; }
    A.ctx = ac;
    master = ac.createGain();
    master.gain.value = A.muted ? 0 : 0.85;
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -14;
    comp.ratio.value = 3;
    master.connect(comp).connect(ac.destination);
    musicBus = ac.createGain(); musicBus.gain.value = 0.5; musicBus.connect(master);
    sfxBus = ac.createGain(); sfxBus.gain.value = 0.75; sfxBus.connect(master);
    ambBus = ac.createGain(); ambBus.gain.value = 0.55; ambBus.connect(master);
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    A.amb(wantAmb, true);
    if (wantSong) A.song(wantSong);
  };

  A.toggleMute = () => {
    A.muted = !A.muted;
    if (master) master.gain.setTargetAtTime(A.muted ? 0 : 0.85, ac.currentTime, 0.05);
    return A.muted;
  };

  // ------------------------------------------------------------------ briques
  const now = () => ac.currentTime;
  function noise(dest, t0, dur, o = {}) {
    const src = ac.createBufferSource();
    src.buffer = noiseBuf;
    src.loop = true;
    let node = src;
    if (o.type) {
      const f = ac.createBiquadFilter();
      f.type = o.type;
      f.frequency.setValueAtTime(o.f || 1000, t0);
      if (o.f2) f.frequency.exponentialRampToValueAtTime(o.f2, t0 + dur);
      f.Q.value = o.q || 0.8;
      node.connect(f);
      node = f;
    }
    const g = ac.createGain();
    env(g.gain, t0, dur, o.vol || 0.3, o.a || 0.005, o.r);
    node.connect(g).connect(dest);
    src.start(t0, Math.random() * 1.5);
    src.stop(t0 + dur + 0.05);
    return g;
  }
  function tone(dest, t0, dur, freq, o = {}) {
    const osc = ac.createOscillator();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    if (o.f2) osc.frequency.exponentialRampToValueAtTime(o.f2, t0 + (o.glide || dur));
    const g = ac.createGain();
    env(g.gain, t0, dur, o.vol || 0.2, o.a || 0.005, o.r);
    osc.connect(g).connect(dest);
    osc.start(t0);
    osc.stop(t0 + dur + 0.05);
    return osc;
  }
  // Enveloppe : attaque linéaire, décroissance exponentielle.
  function env(p, t0, dur, vol, a, r) {
    p.setValueAtTime(0.0001, t0);
    p.linearRampToValueAtTime(vol, t0 + a);
    if (r === 'hold') { p.setValueAtTime(vol, t0 + dur - 0.05); p.linearRampToValueAtTime(0.0001, t0 + dur); }
    else p.exponentialRampToValueAtTime(0.0001, t0 + dur);
  }

  // Corde pincée (Karplus-Strong), mise en cache par note et instrument.
  const ksCache = new Map();
  function ks(midi, inst) {
    const key = inst + midi;
    if (ksCache.has(key)) return ksCache.get(key);
    const sr = ac.sampleRate;
    const freq = 440 * Math.pow(2, (midi - 69) / 12);
    const cfg = {
      banjo: { dur: 1.1, decay: 0.993, bright: 0.95 },
      dulcimer: { dur: 2.6, decay: 0.9975, bright: 0.6 },
      guitar: { dur: 1.6, decay: 0.996, bright: 0.45 },
    }[inst] || { dur: 1.2, decay: 0.995, bright: 0.7 };
    const N = Math.max(2, Math.round(sr / freq));
    const len = Math.round(sr * cfg.dur);
    const buf = ac.createBuffer(1, len, sr);
    const out = buf.getChannelData(0);
    const ring = new Float32Array(N);
    let prev = 0;
    for (let i = 0; i < N; i++) {
      const w = Math.random() * 2 - 1;
      prev = prev + cfg.bright * (w - prev);
      ring[i] = prev;
    }
    let idx = 0;
    for (let i = 0; i < len; i++) {
      const a = ring[idx], b = ring[(idx + 1) % N];
      ring[idx] = cfg.decay * 0.5 * (a + b);
      out[i] = a;
      idx = (idx + 1) % N;
    }
    for (let i = 0; i < 400; i++) out[len - 1 - i] *= i / 400;
    ksCache.set(key, buf);
    return buf;
  }
  function pluck(dest, t0, midi, inst, vol = 0.5) {
    const src = ac.createBufferSource();
    src.buffer = ks(midi, inst);
    const g = ac.createGain();
    g.gain.value = vol;
    src.connect(g).connect(dest);
    src.start(t0);
  }
  // Violon : deux dents de scie, filtre, vibrato tardif.
  function fiddle(dest, t0, dur, midi, vol = 0.12) {
    const f = 440 * Math.pow(2, (midi - 69) / 12);
    const lp = ac.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 2600; lp.Q.value = 1.2;
    const body = ac.createBiquadFilter();
    body.type = 'peaking'; body.frequency.value = 900; body.gain.value = 5; body.Q.value = 1.5;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + 0.05);
    g.gain.setValueAtTime(vol * 0.85, t0 + Math.max(0.06, dur - 0.06));
    g.gain.linearRampToValueAtTime(0.0001, t0 + dur + 0.04);
    const vib = ac.createOscillator();
    vib.frequency.value = 5.6;
    const vibG = ac.createGain();
    vibG.gain.setValueAtTime(0, t0);
    vibG.gain.linearRampToValueAtTime(f * 0.006, t0 + Math.min(0.3, dur));
    vib.connect(vibG);
    for (const det of [-4, 5]) {
      const o = ac.createOscillator();
      o.type = 'sawtooth';
      o.frequency.value = f;
      o.detune.value = det;
      vibG.connect(o.frequency);
      o.connect(lp);
      o.start(t0); o.stop(t0 + dur + 0.1);
    }
    lp.connect(body).connect(g).connect(dest);
    vib.start(t0); vib.stop(t0 + dur + 0.1);
  }

  // ------------------------------------------------------------------ notation
  const NOTE = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  A.midi = (name) => {
    const m = /^([A-G])([#b]?)(-?\d)$/.exec(name);
    if (!m) return null;
    return 12 * (+m[3] + 1) + NOTE[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
  };
  // « D4:1 F#4:.5 r:1 » → [[temps, midi, durée], ...]
  A.seq = (str, start = 0) => {
    const out = [];
    let b = start;
    for (const tok of str.trim().split(/\s+/)) {
      if (tok === '|') continue;
      const [n, d] = tok.split(':');
      const dur = parseFloat(d || '1');
      if (n !== 'r') {
        for (const part of n.split('+')) out.push([b, A.midi(part), dur]);
      }
      b += dur;
    }
    return out;
  };

  // ------------------------------------------------------------------ chansons
  // def : { bpm, len (en temps), loop, tracks: [{ inst, vol, notes: [[temps, midi, durée]] }] }
  // Renvoie une poignée { t0, spb, beatAt(t), timeOf(b), stop() }.
  let current = null;
  A.song = (def, o = {}) => {
    wantSong = def;
    if (!ac) return null;
    if (current) current.stop(o.xfade != null ? o.xfade : 0.8);
    if (!def) { wantSong = null; return null; }
    const spb = 60 / def.bpm;
    const bus = ac.createGain();
    bus.gain.setValueAtTime(0.0001, now());
    bus.gain.linearRampToValueAtTime(def.vol || 1, now() + (o.fadeIn || 0.6));
    bus.connect(musicBus);
    const t0 = now() + (o.delay || 0.12);
    let nextLoop = 0;
    const handle = {
      def, t0, spb, bus, stopped: false,
      beatAt: (t) => (t - t0) / spb,
      timeOf: (b) => t0 + b * spb,
      beatNow: () => (now() - t0) / spb,
      stop(fade = 0.8) {
        if (this.stopped) return;
        this.stopped = true;
        clearInterval(timer);
        bus.gain.cancelScheduledValues(now());
        bus.gain.setValueAtTime(bus.gain.value, now());
        bus.gain.linearRampToValueAtTime(0.0001, now() + fade);
        setTimeout(() => bus.disconnect(), fade * 1000 + 200);
        if (current === handle) current = null;
      },
    };
    // Planification par fenêtre glissante.
    const flat = [];
    for (const tr of def.tracks) for (const n of tr.notes) flat.push({ b: n[0], m: n[1], d: n[2], tr });
    flat.sort((a, b) => a.b - b.b);
    let idx = 0;
    const tick = () => {
      const horizon = now() + 0.2;
      for (;;) {
        if (idx >= flat.length) {
          if (def.loop === false) return;
          idx = 0;
          nextLoop += def.len;
        }
        const n = flat[idx];
        const t = t0 + (nextLoop + n.b) * spb;
        if (t > horizon) break;
        if (t >= now() - 0.02) play(n, t);
        idx++;
      }
    };
    const play = (n, t) => {
      const v = n.tr.vol != null ? n.tr.vol : 0.5;
      if (n.tr.inst === 'fiddle') fiddle(bus, t, n.d * spb * 0.95, n.m, v);
      else if (n.tr.inst === 'drone') tone(bus, t, n.d * spb, 440 * Math.pow(2, (n.m - 69) / 12), { type: 'triangle', vol: v, a: 0.3, r: 'hold' });
      else pluck(bus, t, n.m, n.tr.inst, v);
    };
    const timer = setInterval(tick, 25);
    tick();
    current = handle;
    return handle;
  };
  A.stopSong = (fade) => { wantSong = null; if (current) current.stop(fade); };
  A.current = () => current;

  // Pattern de banjo « bum-ditty » : mélodie au temps, frappe d'accord, 5e corde.
  A.bumDitty = (melody, chords, start = 0) => {
    const out = [];
    const mel = melody.trim().split(/\s+/);
    const chordNotes = { G: ['G3', 'B3', 'D4'], C: ['C4', 'E4', 'G4'], D: ['D4', 'F#4', 'A4'], Em: ['E3', 'G3', 'B3'], A: ['A3', 'C#4', 'E4'] };
    mel.forEach((n, i) => {
      const b = start + i;
      if (n !== 'r') out.push([b, A.midi(n), 0.5]);
      const ch = chordNotes[chords[Math.floor(i / 4) % chords.length]] || chordNotes.G;
      for (const c of ch) out.push([b + 0.5, A.midi(c), 0.25]);
      out.push([b + 0.75, A.midi('G4'), 0.25]);
    });
    return out;
  };

  // ------------------------------------------------------------------ ambiances
  const AMB = {
    wind(dest) {
      const src = ac.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
      const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 380; bp.Q.value = 0.5;
      const g = ac.createGain(); g.gain.value = 0.16;
      const lfo = ac.createOscillator(); lfo.frequency.value = 0.09;
      const lg = ac.createGain(); lg.gain.value = 0.1;
      lfo.connect(lg).connect(g.gain);
      const lfo2 = ac.createOscillator(); lfo2.frequency.value = 0.05;
      const lg2 = ac.createGain(); lg2.gain.value = 160;
      lfo2.connect(lg2).connect(bp.frequency);
      src.connect(bp).connect(g).connect(dest);
      src.start(); lfo.start(); lfo2.start();
      return () => { src.stop(); lfo.stop(); lfo2.stop(); };
    },
    creek(dest) {
      const stops = [];
      for (const [f, q, v] of [[1600, 0.4, 0.08], [520, 0.7, 0.07], [3200, 0.6, 0.025]]) {
        const src = ac.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
        const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = q;
        const g = ac.createGain(); g.gain.value = v;
        const lfo = ac.createOscillator(); lfo.frequency.value = 2 + Math.random() * 3;
        const lg = ac.createGain(); lg.gain.value = v * 0.5;
        lfo.connect(lg).connect(g.gain);
        src.connect(bp).connect(g).connect(dest);
        src.start(Math.random()); lfo.start();
        stops.push(() => { src.stop(); lfo.stop(); });
      }
      return () => stops.forEach((s) => s());
    },
    fire(dest) {
      const src = ac.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
      const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 260;
      const g = ac.createGain(); g.gain.value = 0.05;
      src.connect(lp).connect(g).connect(dest); src.start();
      let alive = true;
      const crack = () => {
        if (!alive) return;
        const t = now();
        noise(dest, t, 0.02 + Math.random() * 0.04, { type: 'highpass', f: 2500 + Math.random() * 3000, vol: 0.05 + Math.random() * 0.1, a: 0.001 });
        setTimeout(crack, 60 + Math.random() * 420);
      };
      crack();
      return () => { alive = false; src.stop(); };
    },
    birds(dest) {
      let alive = true;
      const chirp = () => {
        if (!alive) return;
        const t = now();
        const base = 2400 + Math.random() * 1600;
        const n = 2 + Math.floor(Math.random() * 4);
        for (let i = 0; i < n; i++) tone(dest, t + i * 0.11, 0.07, base, { f2: base * (1.2 + Math.random() * 0.4), vol: 0.025, a: 0.005 });
        setTimeout(chirp, 1500 + Math.random() * 5000);
      };
      setTimeout(chirp, 800);
      return () => { alive = false; };
    },
    night(dest) {
      let alive = true;
      const o = ac.createOscillator(); o.frequency.value = 4400;
      const g = ac.createGain(); g.gain.value = 0;
      const am = ac.createOscillator(); am.type = 'square'; am.frequency.value = 28;
      const amg = ac.createGain(); amg.gain.value = 0.006;
      const gate = ac.createOscillator(); gate.type = 'square'; gate.frequency.value = 1.3;
      const gg = ac.createGain(); gg.gain.value = 0.006;
      am.connect(amg).connect(g.gain); gate.connect(gg).connect(g.gain);
      o.connect(g).connect(dest);
      o.start(); am.start(); gate.start();
      // Engoulevent bois-pourri : trois notes sifflées.
      const call = () => {
        if (!alive) return;
        const t = now();
        tone(dest, t, 0.16, 1500, { f2: 1900, vol: 0.03 });
        tone(dest, t + 0.2, 0.1, 1300, { vol: 0.025 });
        tone(dest, t + 0.32, 0.22, 1700, { f2: 2300, vol: 0.03 });
        setTimeout(call, 7000 + Math.random() * 9000);
      };
      setTimeout(call, 3000);
      return () => { alive = false; o.stop(); am.stop(); gate.stop(); };
    },
    mill(dest) {
      const hum = ac.createOscillator(); hum.type = 'sawtooth'; hum.frequency.value = 46;
      const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 140;
      const g = ac.createGain(); g.gain.value = 0.08;
      hum.connect(lp).connect(g).connect(dest); hum.start();
      let alive = true;
      const saw = () => {
        if (!alive) return;
        const t = now();
        const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.setValueAtTime(820, t);
        o.frequency.linearRampToValueAtTime(700, t + 1.6);
        const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1400; bp.Q.value = 2;
        const sg = ac.createGain();
        sg.gain.setValueAtTime(0.0001, t);
        sg.gain.linearRampToValueAtTime(0.03, t + 0.3);
        sg.gain.linearRampToValueAtTime(0.0001, t + 1.8);
        o.connect(bp).connect(sg).connect(dest);
        o.start(t); o.stop(t + 1.9);
        setTimeout(saw, 2800 + Math.random() * 2500);
      };
      saw();
      return () => { alive = false; hum.stop(); };
    },
    room(dest) {
      let alive = true;
      const tick = () => {
        if (!alive) return;
        noise(dest, now(), 0.012, { type: 'bandpass', f: 3000, q: 3, vol: 0.05, a: 0.001 });
        setTimeout(tick, 1000);
      };
      tick();
      return () => { alive = false; };
    },
  };
  const ambActive = new Map();
  // A.amb(['wind', 'birds']) : fond sonore, avec fondu enchaîné.
  A.amb = (list, force) => {
    wantAmb = list || [];
    if (!ac) return;
    for (const [name, h] of ambActive) {
      if (!wantAmb.includes(name) || force) {
        h.g.gain.setTargetAtTime(0.0001, now(), 0.4);
        setTimeout(() => h.stop(), 2000);
        ambActive.delete(name);
      }
    }
    for (const name of wantAmb) {
      if (ambActive.has(name) || !AMB[name]) continue;
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, now());
      g.gain.setTargetAtTime(1, now(), 0.6);
      g.connect(ambBus);
      const stop = AMB[name](g);
      ambActive.set(name, { g, stop });
    }
  };

  // ------------------------------------------------------------------ bruitages
  const SFX = {
    click: (t, d) => tone(d, t, 0.03, 1700, { type: 'square', vol: 0.03 }),
    coin: (t, d) => { tone(d, t, 0.12, 1568, { vol: 0.12 }); tone(d, t + 0.08, 0.3, 2093, { vol: 0.12 }); },
    clink: (t, d) => { for (const f of [2650, 3970, 5210]) tone(d, t, 0.35, f * (0.98 + Math.random() * 0.04), { vol: 0.06, a: 0.001 }); },
    splash: (t, d) => { noise(d, t, 0.6, { type: 'lowpass', f: 2600, f2: 300, vol: 0.35, a: 0.01 }); },
    plop: (t, d) => { noise(d, t, 0.12, { type: 'bandpass', f: 700, vol: 0.2 }); tone(d, t, 0.12, 320, { f2: 140, vol: 0.12 }); },
    bite: (t, d) => { tone(d, t, 0.08, 240, { f2: 110, vol: 0.2 }); tone(d, t + 0.1, 0.08, 220, { f2: 100, vol: 0.18 }); },
    tick: (t, d) => noise(d, t, 0.015, { type: 'bandpass', f: 4000, q: 2, vol: 0.12, a: 0.001 }),
    dig: (t, d) => { noise(d, t, 0.14, { type: 'lowpass', f: 900, vol: 0.3 }); tone(d, t, 0.08, 110, { f2: 60, vol: 0.15 }); },
    crunch: (t, d) => { for (let i = 0; i < 4; i++) noise(d, t + i * 0.035, 0.03, { type: 'bandpass', f: 2500 + Math.random() * 2000, q: 1.5, vol: 0.18, a: 0.001 }); },
    burn: (t, d) => noise(d, t, 0.7, { type: 'highpass', f: 4500, vol: 0.12, a: 0.05 }),
    thud: (t, d) => { tone(d, t, 0.25, 95, { f2: 45, vol: 0.4 }); noise(d, t, 0.08, { type: 'lowpass', f: 400, vol: 0.2 }); },
    step: (t, d) => noise(d, t, 0.07, { type: 'lowpass', f: 500, vol: 0.12 }),
    knock: (t, d) => { for (let i = 0; i < 3; i++) { tone(d, t + i * 0.18, 0.09, 170, { f2: 120, vol: 0.35 }); noise(d, t + i * 0.18, 0.05, { type: 'lowpass', f: 1200, vol: 0.2 }); } },
    bell: (t, d) => { for (const [f, v] of [[1320, 0.08], [1985, 0.05], [2760, 0.04], [3510, 0.02]]) tone(d, t, 1.4, f, { vol: v, a: 0.002 }); },
    page: (t, d) => noise(d, t, 0.22, { type: 'bandpass', f: 2600, f2: 1800, q: 0.7, vol: 0.12, a: 0.03 }),
    shutter: (t, d) => { tone(d, t, 0.02, 2200, { type: 'square', vol: 0.06 }); noise(d, t + 0.02, 0.06, { type: 'highpass', f: 3000, vol: 0.2, a: 0.001 }); },
    cough: (t, d) => { for (let i = 0; i < 2; i++) noise(d, t + i * 0.28, 0.18, { type: 'bandpass', f: 800, q: 1.5, vol: 0.3, a: 0.01 }); },
    bark: (t, d) => {
      for (let i = 0; i < 2; i++) {
        tone(d, t + i * 0.22, 0.12, 420, { type: 'sawtooth', f2: 230, vol: 0.12 });
        noise(d, t + i * 0.22, 0.1, { type: 'bandpass', f: 1100, q: 1, vol: 0.15 });
      }
    },
    fail: (t, d) => tone(d, t, 0.45, 220, { type: 'triangle', f2: 110, vol: 0.15 }),
    good: (t, d) => { pluck(d, t, 67, 'banjo', 0.4); pluck(d, t + 0.09, 74, 'banjo', 0.4); },
    perfect: (t, d) => { pluck(d, t, 74, 'banjo', 0.4); pluck(d, t + 0.07, 79, 'banjo', 0.4); pluck(d, t + 0.14, 86, 'banjo', 0.3); },
    pour: (t, d) => { noise(d, t, 0.3, { type: 'lowpass', f: 700, f2: 300, vol: 0.25, a: 0.02 }); tone(d, t + 0.05, 0.1, 180, { f2: 120, vol: 0.08 }); },
    whoosh: (t, d) => noise(d, t, 0.35, { type: 'bandpass', f: 600, f2: 2400, q: 0.8, vol: 0.18, a: 0.08 }),
    creak: (t, d) => tone(d, t, 0.4, 210, { type: 'sawtooth', f2: 160, vol: 0.03, a: 0.08 }),
    train: (t, d) => { for (const f of [392, 494]) tone(d, t, 1.6, f, { type: 'triangle', vol: 0.06, a: 0.1 }); },
  };
  // vol : volume relatif (1 par défaut), utile pour les sons répétés à chaque temps.
  A.sfx = (name, delay = 0, vol = 1) => {
    if (!ac || A.muted || !SFX[name]) return;
    let dest = sfxBus;
    if (vol !== 1) {
      dest = ac.createGain();
      dest.gain.value = vol;
      dest.connect(sfxBus);
      setTimeout(() => dest.disconnect(), 3000);
    }
    SFX[name](now() + delay, dest);
  };

  // Sifflet à vapeur de l'usine : un accord tenu, avec la vapeur.
  A.whistle = (dur = 2.5, vol = 0.12) => {
    if (!ac) return;
    const t = now();
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.35);
    g.gain.setValueAtTime(vol, t + dur);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 1.4);
    lp.connect(g).connect(sfxBus);
    for (const f of [311, 370, 466]) {
      const o = ac.createOscillator(); o.type = 'sawtooth';
      o.frequency.setValueAtTime(f * 0.9, t);
      o.frequency.linearRampToValueAtTime(f, t + 0.4);
      o.frequency.setValueAtTime(f, t + dur);
      o.frequency.linearRampToValueAtTime(f * 0.86, t + dur + 1.4);
      o.connect(lp); o.start(t); o.stop(t + dur + 1.5);
    }
    noise(sfxBus, t, dur + 1.2, { type: 'bandpass', f: 2200, q: 0.6, vol: vol * 0.6, a: 0.3 });
  };

  // ------------------------------------------------------------------ musiques de l'épisode 1
  const S = (A.SONGS = {});
  // Thème de la vallée : dulcimer lent, ré mixolydien, à trois temps.
  S.valley = {
    bpm: 66, len: 48, vol: 0.9,
    tracks: [
      { inst: 'dulcimer', vol: 0.55, notes: A.seq('A3:1 D4:1 E4:1 F#4:2 E4:1 D4:1 E4:1 F#4:1 A4:3 B4:1 A4:1 F#4:1 A4:2 F#4:1 E4:1 D4:1 B3:1 A3:3 A3:1 D4:1 E4:1 F#4:2 A4:1 B4:1 D5:1 B4:1 A4:3 F#4:1 E4:1 D4:1 E4:2 F#4:1 D4:3 D4:3') },
      { inst: 'dulcimer', vol: 0.28, notes: A.seq('D3+A3:3 D3+A3:3 D3+A3:3 D3+A3:3 G3+B3:3 D3+A3:3 G3+B3:3 A3+E3:3 D3+A3:3 D3+A3:3 G3+B3:3 D3+A3:3 D3+A3:3 A3+E3:3 D3+A3:3 D3+A3:3') },
    ],
  };
  // Air de banjo du camp (sol majeur).
  S.camp = {
    bpm: 100, len: 32, vol: 0.75,
    tracks: [
      { inst: 'banjo', vol: 0.32, notes: A.bumDitty('G4 A4 B4 D5 B4 A4 G4 E4 D4 E4 G4 A4 B4 A4 G4 G4 B4 D5 E5 D5 B4 A4 G4 E4 D4 E4 G4 B4 A4 G4 G4 r', ['G', 'C', 'G', 'D', 'G', 'C', 'D', 'G']) },
    ],
  };
  // Air triste : dulcimer seul, mi dorien.
  S.sad = {
    bpm: 56, len: 32, vol: 0.85,
    tracks: [
      { inst: 'dulcimer', vol: 0.5, notes: A.seq('E4:2 G4:1 A4:1 B4:3 A4:1 G4:1 E4:1 D4:1 E4:1 E4:4 B4:2 D5:1 B4:1 A4:2 G4:1 A4:1 B4:1 A4:1 G4:1 E4:1 E4:4') },
      { inst: 'drone', vol: 0.04, notes: [[0, A.midi('E2'), 32]] },
    ],
  };
  // Reel du beurre de pommes (ré majeur), violon + banjo + basse. tempo réglable.
  const reelA = 'D4:.5 F#4:.5 A4:.5 F#4:.5 D5:.5 A4:.5 F#4:.5 A4:.5 G4:.5 B4:.5 D5:.5 B4:.5 A4:.5 F#4:.5 D4:.5 F#4:.5 '
    + 'E4:.5 F#4:.5 G4:.5 A4:.5 B4:.5 A4:.5 G4:.5 F#4:.5 E4:.5 D4:.5 E4:.5 F#4:.5 E4:.5 C#4:.5 A3:.5 C#4:.5 '
    + 'D4:.5 F#4:.5 A4:.5 F#4:.5 D5:.5 A4:.5 F#4:.5 A4:.5 G4:.5 B4:.5 D5:.5 B4:.5 A4:.5 F#4:.5 A4:.5 D5:.5 '
    + 'E5:.5 D5:.5 C#5:.5 B4:.5 A4:.5 G4:.5 F#4:.5 E4:.5 D4:.5 F#4:.5 E4:.5 C#4:.5 D4:1 r:1';
  const reelChords = ['D', 'G', 'A', 'A', 'D', 'G', 'A', 'D'];
  const bassLine = (() => {
    const roots = { D: ['D3', 'A2'], G: ['G2', 'D3'], A: ['A2', 'E3'] };
    const out = [];
    reelChords.forEach((c, bar) => {
      out.push([bar * 4, A.midi(roots[c][0]), 1]);
      out.push([bar * 4 + 2, A.midi(roots[c][1]), 1]);
    });
    return out;
  })();
  A.reel = (bpm) => ({
    bpm, len: 32, vol: 0.85,
    tracks: [
      { inst: 'fiddle', vol: 0.085, notes: A.seq(reelA) },
      { inst: 'banjo', vol: 0.18, notes: A.bumDitty('r r r r r r r r r r r r r r r r r r r r r r r r r r r r r r r r', reelChords.map((c) => c)) },
      { inst: 'guitar', vol: 0.5, notes: bassLine },
    ],
  });
})();

// ---- src/walk.js
'use strict';
// Scène d'exploration de profil : Henry marche (clic/toucher ou flèches) et
// interagit avec des personnages ou des objets (« things »).
//
// cfg = {
//   width: largeur du monde, floor: y du sol, bounds: [xmin, xmax], start, dir,
//   amb: ['wind'], song: def | null,
//   drawBg(ctx, camX, scene), drawFg(ctx, camX, scene), drawUI(uctx, scene),
//   things: [{ id, x, y, char, o, label, w, h, act: async (scene) => {}, visible: () => bool,
//              draw(ctx, sx, scene), layer: 'back'|'front', side: -1|1, solid }],
//   followers: [{ char, gap, o }],  triggers: [{ x, act, once }],
//   onEnter: async (scene) => {}, onUpdate(dt, scene), player: { char, o },
// }
(function () {
  const G = window.G;
  const U = G.U;
  const I = G.input;
  const ui = G.ui;

  G.Scenes.walk = (cfg) => G.makeScene({
    cfg,
    colorOverride: cfg.colorOverride,
    enter() {
      this.px = cfg.start != null ? cfg.start : 200;
      this.dir = cfg.dir || 1;
      this.phase = 0;
      this.moving = false;
      this.target = null;
      this.busy = false;
      this.floor = cfg.floor || 560;
      this.width = cfg.width || G.W;
      this.bounds = cfg.bounds || [60, this.width - 60];
      this.cam = this.camTarget();
      this.followers = (cfg.followers || []).map((f) => Object.assign({ x: this.px - (f.gap || 90), phase: 0, moving: false, dir: this.dir }, f));
      this.triggers = (cfg.triggers || []).map((t) => Object.assign({ fired: false }, t));
      this.player = Object.assign({ char: 'henry' }, cfg.player || {});
      if (cfg.amb) G.audio.amb(cfg.amb);
      if (cfg.song !== undefined) cfg.song ? G.audio.song(cfg.song) : G.audio.stopSong();
      if (cfg.hud) Object.assign(G.hud, cfg.hud);
      if (cfg.onEnter) this.runAct(cfg.onEnter);
    },
    camTarget() {
      return U.clamp(this.px - G.W / 2, 0, Math.max(0, this.width - G.W));
    },
    things() {
      return (cfg.things || []).filter((t) => !t.visible || t.visible(this));
    },
    // Lance une action asynchrone en bloquant les déplacements.
    async runAct(fn, thing) {
      this.busy = true;
      this.target = null;
      this.moving = false;
      try { await fn(this, thing); } finally { this.busy = false; }
    },
    hitThing(wx, wy) {
      let best = null;
      for (const t of this.things()) {
        if (!t.act && !t.label) continue;
        const w = t.w || (t.char ? 70 : 80);
        const h = t.h || (t.char ? (G.CHARS[t.char] || {}).h || 140 : 100);
        const y = t.y != null ? t.y : this.floor;
        if (Math.abs(wx - t.x) <= w / 2 + 6 && wy <= y + 14 && wy >= y - h - 20) {
          if (!best || Math.abs(wx - t.x) < Math.abs(wx - best.x)) best = t;
        }
      }
      return best;
    },
    nearest() {
      let best = null, bd = 1e9;
      for (const t of this.things()) {
        if (!t.act) continue;
        const d = Math.abs(t.x - this.px);
        if (d < (t.range || 110) && d < bd) { best = t; bd = d; }
      }
      return best;
    },
    update(dt) {
      if (cfg.onUpdate) cfg.onUpdate(dt, this);
      let vx = 0;
      if (!this.busy && !G.blocked) {
        const left = I.key('ArrowLeft') || I.key('KeyA') || I.key('KeyQ');
        const right = I.key('ArrowRight') || I.key('KeyD');
        if (left || right) { this.target = null; vx = right ? 1 : -1; }
        if (I.pressed) {
          const wx = I.x + this.cam;
          const hit = this.hitThing(wx, I.y);
          if (hit && hit.act) this.target = { thing: hit, x: this.standX(hit) };
          else if (I.y > 120) this.target = { x: U.clamp(wx, this.bounds[0], this.bounds[1]) };
        }
        if (I.hit('KeyE') || I.hit('Space') || I.hit('Enter')) {
          const n = this.nearest();
          if (n) this.target = { thing: n, x: this.standX(n) };
        }
        if (this.target && !vx) {
          const dx = this.target.x - this.px;
          if (Math.abs(dx) < 6) {
            const th = this.target.thing;
            this.target = null;
            if (th) {
              this.dir = th.x >= this.px ? 1 : -1;
              if (th.x === this.px) this.dir = th.side ? -th.side : this.dir;
              this.runAct(th.act, th);
            }
          } else vx = Math.sign(dx);
        }
      }
      const speed = cfg.speed || 230;
      this.moving = vx !== 0;
      if (vx) {
        this.dir = vx;
        const nx = U.clamp(this.px + vx * speed * dt, this.bounds[0], this.bounds[1]);
        const moved = Math.abs(nx - this.px);
        const prevHalf = Math.floor(this.phase * 2);
        this.phase = (this.phase + moved / 150) % 1;
        if (moved < 0.01 && this.target) this.target = null;
        this.px = nx;
        if (Math.floor(this.phase * 2) !== prevHalf) G.audio.sfx('step', 0, 0.6); // un pas par demi-cycle
      }
      // Ceux qui suivent Henry (Granny dans la montagne, par exemple).
      let lead = this.px;
      for (const f of this.followers) {
        const want = lead - this.dir * (f.gap || 90);
        const dx = want - f.x;
        f.moving = Math.abs(dx) > 8;
        if (f.moving) {
          const sp = (f.speed || speed * 0.95) * dt;
          const step = Math.sign(dx) * Math.min(Math.abs(dx), sp);
          f.x += step;
          f.dir = Math.sign(step) || f.dir;
          f.phase = (f.phase + Math.abs(step) / 150) % 1;
        } else f.dir = this.px >= f.x ? 1 : -1;
        lead = f.x;
      }
      for (const tr of this.triggers) {
        if (tr.fired || this.busy) continue;
        if ((tr.dir || 1) > 0 ? this.px >= tr.x : this.px <= tr.x) {
          if (tr.if && !G.test(tr.if)) continue;
          tr.fired = true;
          this.runAct(tr.act, tr);
          break;
        }
      }
      const ct = this.camTarget();
      this.cam = U.lerp(this.cam, ct, 1 - Math.pow(0.02, dt));
    },
    standX(t) {
      if (t.standAt != null) return t.standAt;
      const side = t.side || (this.px < t.x ? -1 : 1);
      const off = t.reach != null ? t.reach : (t.char ? 72 : 30);
      return U.clamp(t.x + side * off, this.bounds[0], this.bounds[1]);
    },
    drawThing(ctx, t) {
      const sx = t.x - this.cam;
      if (sx < -300 || sx > G.W + 300) return;
      const y = t.y != null ? t.y : this.floor;
      if (t.draw) t.draw(ctx, sx, this, y);
      else if (t.char) G.art.char(ctx, t.char, sx, y, Object.assign({ seed: t.x }, t.o || {}));
    },
    draw(ctx) {
      const cam = Math.round(this.cam);
      if (cfg.drawBg) cfg.drawBg(ctx, cam, this);
      const things = this.things();
      for (const t of things) if (t.layer !== 'front') this.drawThing(ctx, t);
      for (const f of this.followers) {
        G.art.char(ctx, f.char, f.x - cam, this.floor, Object.assign({ dir: f.dir, pose: f.moving ? 'walk' : 'stand', phase: f.phase, seed: 3 }, f.o || {}));
      }
      G.art.char(ctx, this.player.char, this.px - cam, this.floor, Object.assign({
        dir: this.dir, pose: this.moving ? 'walk' : 'stand', phase: this.phase, rim: cfg.rim !== false,
      }, this.player.o || {}));
      for (const t of things) if (t.layer === 'front') this.drawThing(ctx, t);
      if (cfg.drawFg) cfg.drawFg(ctx, cam, this);
      G.art.finish(ctx, cfg.finish);
    },
    drawUI(uctx) {
      const cam = this.cam;
      if (!this.busy && !G.blocked) {
        const near = this.nearest();
        const hov = I.mouse ? this.hitThing(I.x + cam, I.y) : null;
        for (const t of this.things()) {
          if (!t.label || (t !== near && t !== hov)) continue;
          const y = t.y != null ? t.y : this.floor;
          const h = t.h || (t.char ? (G.CHARS[t.char] || {}).h || 140 : 100);
          ui.tag(uctx, t.label, t.x - cam, (t.tagY != null ? t.tagY : y - h - 12), { active: t === near });
        }
      }
      if (cfg.drawUI) cfg.drawUI(uctx, this);
      ui.drawHud(uctx);
    },
  });
})();

// ---- src/scenes/places.js
'use strict';
// Décors partagés de l'épisode 1 : maison en coupe, camp, scierie, magasin,
// montagne, bourg. Les couches statiques sont mises en cache.
(function () {
  const G = window.G;
  const U = G.U;
  const P = G.PAL;
  const A = G.art;
  const PL = (G.places = G.places || {});
  G.DEV = G.DEV || {};

  // ------------------------------------------------------------------ ambiances de lumière
  PL.SKY = {
    summer: [[0, '#6F93B0'], [0.6, '#A9C0C8'], [1, '#E3D9B5']],
    dawn: [[0, '#39465A'], [0.55, '#8E8A8A'], [1, '#E2B48A']],
    day: [[0, '#7E9AAE'], [0.65, '#B9C0B4'], [1, '#E2C48E']],
    dusk: [[0, '#4F5864'], [0.55, '#9AA5A0'], [1, '#D9A86A']],
    night: [[0, '#0B1120'], [0.6, '#1B263B'], [1, '#33405A']],
    rain: [[0, '#55606A'], [1, '#9AA2A2']],
  };
  PL.LEAVES = {
    summer: ['#3F5E2E', '#5E7A3A', '#6F8F3F', '#4A6B35', '#7C9A4A', '#56713A'],
    autumn: P.autumn,
  };
  const RIDGE = {
    summer: { far: '#6F8A8A', mid: '#3F5636', ground: '#3C3526' },
    autumn: { far: '#7F8580', mid: '#5C4A33', ground: '#3E3123' },
  };

  // Ciel + deux crêtes + feuillage : la couche lointaine, parallaxe 0,5.
  function backLayer(cx, w, h, o) {
    A.sky(cx, w, h, PL.SKY[o.time] || PL.SKY.day);
    if (o.time === 'night') {
      const rnd = U.rng(5);
      cx.fillStyle = '#E8E4D0';
      for (let i = 0; i < 140; i++) { cx.globalAlpha = 0.3 + rnd() * 0.6; cx.fillRect(rnd() * w, rnd() * h * 0.5, 1.6, 1.6); }
      cx.globalAlpha = 1;
      cx.fillStyle = '#EDE6CC';
      cx.beginPath(); cx.arc(w * 0.72, 110, 30, 0, Math.PI * 2); cx.fill();
      A.glow(cx, w * 0.72, 110, 140, 'rgba(230,226,200,0.6)', 0.35);
    }
    const c = RIDGE[o.season] || RIDGE.autumn;
    const far = A.makeRidge(o.seed || 3, w, o.farY || 300, 45, 170);
    A.ridge(cx, far, c.far, h);
    const mid = A.makeRidge((o.seed || 3) + 6, w, o.midY || 380, 34, 130);
    A.ridge(cx, mid, c.mid, h);
    A.dots(cx, (o.seed || 3) + 11, Math.round(w * 0.16), -20, w + 20,
      (x) => [A.ridgeY(mid, x) + 2, A.ridgeY(mid, x) + 150], PL.LEAVES[o.season] || P.autumn, 7, 16, 0.55, 0.92);
    A.texture(cx, w, h, 0.16);
    if (o.time === 'night') { cx.fillStyle = 'rgba(8,12,26,0.5)'; cx.fillRect(0, 0, w, h); }
    if (o.time === 'dawn') { cx.fillStyle = 'rgba(200,190,200,0.12)'; cx.fillRect(0, 0, w, h); }
  }

  // Dessine une couche lointaine (cache) avec parallaxe.
  PL.drawBack = (ctx, cam, worldW, o) => {
    const k = o.parallax != null ? o.parallax : 0.5;
    const w = Math.ceil(G.W + Math.max(0, worldW - G.W) * k) + 4;
    const key = `back:${o.key}:${w}`;
    const layer = A.cached(key, w, G.H, (cx, cw, ch) => backLayer(cx, cw, ch, o), 1);
    A.blit(ctx, layer, -Math.round(cam * k), 0);
  };

  // ------------------------------------------------------------------ éléments
  // Façade du magasin de la compagnie. x = bord gauche, ground = sol.
  PL.storeFront = (ctx, x, ground, o = {}) => {
    const w = 360, h = 190;
    ctx.fillStyle = '#5E4A36';
    ctx.fillRect(x, ground - h - 40, w, h);
    // fronton à faux-front (typique des magasins de compagnie)
    ctx.fillRect(x - 6, ground - h - 92, w + 12, 60);
    ctx.fillStyle = '#E3D6B8';
    ctx.fillRect(x + 20, ground - h - 82, w - 40, 38);
    G.ui.text(ctx, 'HOLLIS LUMBER & STAVE CO.', x + w / 2, ground - h - 69, { size: 15, color: '#2B2420', align: 'center', base: 'middle', bold: true });
    G.ui.text(ctx, 'MAGASIN DE LA COMPAGNIE', x + w / 2, ground - h - 52, { size: 12, color: '#5C4A33', align: 'center', base: 'middle' });
    ctx.strokeStyle = 'rgba(30,22,16,0.4)'; ctx.lineWidth = 2;
    for (let bx = x + 14; bx < x + w; bx += 18) { ctx.beginPath(); ctx.moveTo(bx, ground - h - 40); ctx.lineTo(bx, ground - 40); ctx.stroke(); }
    // vitrines et porte
    ctx.fillStyle = o.night ? '#E9B35A' : '#2C2A28';
    ctx.fillRect(x + 30, ground - h + 20, 90, 90);
    ctx.fillRect(x + w - 120, ground - h + 20, 90, 90);
    ctx.fillStyle = '#2B2016';
    ctx.fillRect(x + w / 2 - 34, ground - h + 10, 68, h - 50);
    // auvent et perron
    ctx.fillStyle = P.tin;
    ctx.beginPath(); ctx.moveTo(x - 20, ground - h + 4); ctx.lineTo(x + w + 20, ground - h + 4); ctx.lineTo(x + w + 34, ground - h + 34); ctx.lineTo(x - 34, ground - h + 34); ctx.fill();
    A.boards(ctx, x - 30, ground - 40, w + 60, 14, '#4A3826');
    ctx.fillStyle = P.beam;
    for (const px of [x - 24, x + w + 18]) ctx.fillRect(px, ground - h + 30, 7, h - 70);
    ctx.fillRect(x - 10, ground - 26, 14, 26);
    ctx.fillRect(x + w - 4, ground - 26, 14, 26);
    // marches
    ctx.fillStyle = '#3A2C1E';
    ctx.fillRect(x + w / 2 - 50, ground - 26, 100, 13);
    ctx.fillRect(x + w / 2 - 60, ground - 13, 120, 13);
    // affiches
    ctx.fillStyle = '#D9CFB6';
    ctx.fillRect(x + 140, ground - h + 40, 34, 46);
    ctx.fillRect(x + 186, ground - h + 52, 28, 36);
  };

  // Scierie : grand hangar ouvert, cheminée de brique avec le sifflet.
  PL.mill = (ctx, x, ground) => {
    // cheminée
    ctx.fillStyle = '#6A3B2A';
    ctx.beginPath(); ctx.moveTo(x + 560, ground - 120); ctx.lineTo(x + 572, ground - 520); ctx.lineTo(x + 606, ground - 520); ctx.lineTo(x + 618, ground - 120); ctx.fill();
    ctx.fillStyle = '#4A2A1E';
    ctx.fillRect(x + 566, ground - 532, 46, 16);
    // sifflet à vapeur (sur le toit)
    ctx.fillStyle = '#B8A16A';
    ctx.fillRect(x + 300, ground - 300, 10, 36);
    ctx.beginPath(); ctx.ellipse(x + 305, ground - 302, 9, 5, 0, 0, Math.PI * 2); ctx.fill();
    // hangar
    ctx.fillStyle = '#4B3A2B';
    ctx.fillRect(x, ground - 260, 700, 260);
    ctx.fillStyle = P.tin;

    const front = A.cached(`mtn-front-${time}`, W, G.H, (cx) => {

      // rangée lointaine : troncs fins et pâles, feuillage clair
      for (let i = 0; i < 34; i++) {
        const tx = i * 80 + rnd() * 50;
        A.tree(cx, tx, 520 + rnd() * 20, 220 + rnd() * 140, 'rgba(70,56,44,0.55)', ['rgba(200,150,80,0.5)', 'rgba(170,90,50,0.45)', 'rgba(210,180,100,0.45)'], i + 50);
      }
      cx.fillStyle = 'rgba(210,200,185,0.18)';
      cx.fillRect(0, 380, W, 160);
      // rangée proche : gros troncs irréguliers, houppiers qui sortent du cadre
      for (let i = 0; i < 15; i++) {
        const tx = i * 180 + rnd() * 120;
        const h = 420 + rnd() * 260;
        A.tree(cx, tx, 575 + rnd() * 20, h, '#2E241D', P.autumn, i + 3);
      }
      cx.fillStyle = '#4A3B2A';
      cx.fillRect(0, 568, W, 160);
      cx.fillStyle = '#6B5640';
      cx.beginPath(); cx.moveTo(0, 576); cx.quadraticCurveTo(W / 2, 562, W, 578); cx.lineTo(W, 602); cx.quadraticCurveTo(W / 2, 588, 0, 604); cx.fill();
      A.dots(cx, 88, 700, 0, W, () => [600, 716], ['#9C4A22', '#B8732A', '#7A2E1A', '#5C4A33', '#C98F3A'], 2, 5, 0.5, 0.9);
      for (let i = 0; i < 46; i++) {
        const fx = (i * 61 + rnd() * 40) % W;
        cx.strokeStyle = i % 2 ? '#7C6A3A' : '#8E7A42'; cx.lineWidth = 2;
        for (let k = -3; k <= 3; k++) { cx.beginPath(); cx.moveTo(fx, 602); cx.quadraticCurveTo(fx + k * 6, 574, fx + k * 12, 570 + Math.abs(k) * 4); cx.stroke(); }
      }
      A.texture(cx, W, G.H, 0.14);
      if (time === 'dusk') { cx.fillStyle = 'rgba(40,20,10,0.22)'; cx.fillRect(0, 0, W, G.H); }
    }, 1);
    A.blit(ctx, front, -cam, 0);
    // rais de lumière entre les arbres
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 4; i++) {
      const bx = ((i * 520 + 200) - cam * 0.9) % (G.W + 400) - 200;
      const g = ctx.createLinearGradient(bx, 0, bx + 160, G.H);
      g.addColorStop(0, 'rgba(255,230,170,0.10)');
      g.addColorStop(1, 'rgba(255,230,170,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.moveTo(bx, 0); ctx.lineTo(bx + 70, 0); ctx.lineTo(bx + 260, G.H); ctx.lineTo(bx + 120, G.H); ctx.fill();
    }
    ctx.restore();
  };
  // L'alambic de Dow, dans un creux.
  PL.still = (ctx, x, ground) => {
    ctx.fillStyle = '#9C5A2E';
    ctx.beginPath(); ctx.ellipse(x, ground - 50, 34, 40, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#7A4424';
    ctx.fillRect(x - 8, ground - 104, 16, 20);
    ctx.strokeStyle = '#7A4424'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(x, ground - 98); ctx.quadraticCurveTo(x + 60, ground - 120, x + 90, ground - 60); ctx.stroke();
    ctx.fillStyle = '#4A3826'; ctx.fillRect(x + 80, ground - 64, 40, 64);
    ctx.fillStyle = '#5A4128'; ctx.fillRect(x - 46, ground - 14, 92, 14);
    ctx.fillStyle = '#E37A2C'; ctx.fillRect(x - 20, ground - 12, 40, 8);
    A.glow(ctx, x, ground - 10, 70, 'rgba(227,122,44,0.9)', 0.3);
    PL.smoke(ctx, x, ground - 110, 7);
  };

  // ------------------------------------------------------------------ le bourg (perron du magasin), en automne
  PL.townWidth = 1600;
  PL.town = (ctx, cam, o = {}) => {
    const W = PL.townWidth;
    PL.drawBack(ctx, cam, W, { key: 'town', season: 'autumn', time: o.time || 'day', seed: 12 });
    const front = A.cached(`town-front-${o.time || 'day'}`, W, G.H, (cx) => {
      cx.fillStyle = '#4E3E2B';
      cx.beginPath(); cx.moveTo(0, 480); cx.quadraticCurveTo(W / 2, 450, W, 486); cx.lineTo(W, G.H); cx.lineTo(0, G.H); cx.fill();
      A.campHouse(cx, 60, 500, { smoke: false, w: 200, h: 96 });
      PL.storeFront(cx, 560, 600);
      A.campHouse(cx, 1260, 500, { smoke: false, w: 200, h: 96 });
      cx.fillStyle = '#5E4C36'; cx.fillRect(0, 590, W, 130);
      // flaques de la pluie de mercredi
      cx.fillStyle = 'rgba(150,170,180,0.35)';
      for (const [px, pw] of [[180, 120], [700, 90], [1180, 140]]) { cx.beginPath(); cx.ellipse(px, 650, pw, 9, 0, 0, Math.PI * 2); cx.fill(); }
      // camion de l'acheteur de racines
      cx.fillStyle = '#2E3236';
      cx.fillRect(1010, 520, 150, 60); cx.fillRect(1160, 540, 60, 40);
      cx.fillStyle = '#1A1A1C';
      for (const wx of [1040, 1180]) { cx.beginPath(); cx.arc(wx, 584, 18, 0, Math.PI * 2); cx.fill(); }
      cx.fillStyle = '#D9CFB6'; cx.fillRect(1018, 530, 126, 22);
      G.ui.text(cx, 'THORNBURY · RACINES', 1080, 541, { size: 10, color: '#2B2420', align: 'center', base: 'middle', bold: true });
      A.texture(cx, W, G.H, 0.12);
    }, 1);
    A.blit(ctx, front, -cam, 0);
  };

  // Test : la maison au petit matin avec la famille.
  G.DEV.house = () => G.play(G.Scenes.walk({
    width: G.W, floor: PL.houseFloor, start: 850, bounds: [110, 990],
    hud: { date: 'Lundi 17 octobre 1932', goal: 'Parler à M\'man', money: true },
    drawBg: (ctx) => PL.house(ctx, { time: 'dawn', lamp: true }),
    things: [
      { char: 'kenneth', x: 140, label: 'Papa', o: { dir: -1 } },
      { char: 'hattie', x: 262, label: 'Granny', o: { pose: 'sit', seatH: 37, carry: 'pipe' } },
      { char: 'ida', x: 522, label: "M'man", o: { dir: -1, arms: [0.1, 1.2] } },
      { char: 'ruth', x: 655, label: 'Ruth', o: { pose: 'sit', seatH: 25, carry: 'book' } },
      { char: 'pearl', x: 700, label: 'Pearl' },
      { char: 'wes', x: 800, label: 'Wes', o: { carry: 'fiddle', arms: [0.9, 1.3] } },
      { char: 'clay', x: 930, label: 'Clay', o: { pose: 'sit', seatH: 30, dir: -1 } },
    ],
  }));
  G.DEV.camp = () => G.play(G.Scenes.walk({
    width: PL.campWidth, floor: 640, start: 200,
    drawBg: (ctx, cam) => PL.camp(ctx, cam, { season: 'summer', time: 'summer' }),
    things: [{ char: 'nora', x: 420, label: 'Mrs. Napier', o: { dir: -1 } }],
  }));
  G.DEV.walktest = () => G.DEV.camp();
  G.DEV.mill = () => G.play(G.Scenes.walk({
    width: PL.millWidth, floor: 640, start: 200,
    drawBg: (ctx, cam) => PL.millYard(ctx, cam),
    things: [{ char: 'kenneth', x: 900, label: 'Papa', o: { pose: 'sit', seatH: 40 } }],
  }));
  G.DEV.mountain = () => G.play(G.Scenes.walk({
    width: PL.mountainWidth, floor: 590, start: 200, followers: [{ char: 'hattie', gap: 90, o: { carry: 'pipe' } }],
    drawBg: (ctx, cam) => { PL.mountain(ctx, cam); PL.still(ctx, 2300 - cam, 590); },
  }));
  G.DEV.town = () => G.play(G.Scenes.walk({
    width: PL.townWidth, floor: 640, start: 300,
    drawBg: (ctx, cam) => PL.town(ctx, cam),
    things: [{ char: 'thornbury', x: 940, label: 'M. Thornbury', o: { dir: -1 } }, { char: 'whitcomb', x: 480, label: 'M. Whitcomb' }],
  }));
  G.DEV.store = () => G.play(G.makeScene({ draw(ctx) { PL.storeInside(ctx); G.art.char(ctx, 'pruitt', 650, 560, { dir: -1 }); PL.storeCounter(ctx); G.art.finish(ctx); } }));

// ---- src/scenes/title.js
'use strict';
// Écran d'accueil (« Clique pour entrer », nécessaire pour le son) puis écran titre.
(function () {
  const G = window.G;
  const U = G.U;
  const I = G.input;
  const ui = G.ui;
  const A = G.art;
  const P = G.PAL;

  // Vallée au crépuscule, en couches de plus en plus sombres.
  function valley(ctx) {
    const bg = A.cached('title-valley', G.W, G.H, (cx) => {
      A.sky(cx, G.W, G.H, [[0, '#2A3346'], [0.5, '#6C6F78'], [0.78, '#C99A6A'], [1, '#D9A86A']]);
      const layers = [
        { y: 330, amp: 40, c: '#5E6672', seed: 4 },
        { y: 380, amp: 46, c: '#4A4A50', seed: 8 },
        { y: 440, amp: 36, c: '#3A332E', seed: 13 },
        { y: 520, amp: 30, c: '#2A221D', seed: 19 },
      ];
      layers.forEach((l, i) => {
        const pts = A.makeRidge(l.seed, G.W, l.y, l.amp, 160);
        A.ridge(cx, pts, l.c, G.H);
        if (i >= 1) A.dots(cx, l.seed + 1, 90 + i * 30, 0, G.W, (x) => [A.ridgeY(pts, x) + 2, A.ridgeY(pts, x) + 60], i === 1 ? ['#6A5A50', '#7A6656'] : ['#7A2E1A', '#9C4A22', '#5C4A33', '#B8732A'], 5, 11, 0.35, 0.7);
      });
      // cheminée de l'usine, éteinte
      cx.fillStyle = '#231C18';
      cx.beginPath(); cx.moveTo(930, 470); cx.lineTo(938, 300); cx.lineTo(954, 300); cx.lineTo(962, 470); cx.fill();
      cx.fillRect(934, 292, 24, 10);
      A.texture(cx, G.W, G.H, 0.16);
    }, Math.min(G.dpr, 1.5));
    A.blit(ctx, bg, 0, 0);
    // maison éclairée sur sa pente
    A.campHouse(ctx, 250, 560, { lit: true, w: 170, h: 80, wall: '#3A2E24', roof: '#252A32', stilt: 30 });
    // lucioles tardives
    for (let i = 0; i < 14; i++) {
      const t = G.time * 0.4 + i * 1.7;
      const x = 120 + ((i * 97) % 1040) + Math.sin(t) * 18;
      const y = 520 + ((i * 53) % 160) + Math.cos(t * 1.3) * 10;
      const a = 0.4 + 0.4 * Math.sin(t * 2.3 + i);
      A.glow(ctx, x, y, 10, 'rgba(233,226,122,1)', Math.max(0, a) * 0.6);
    }
  }

  G.Scenes.title = (opts = {}) => G.makeScene({
    colorOverride: { sat: 1, sepia: 0.08 },
    enter() {
      this.phase = G.audio.ctx ? 'menu' : 'gate';
      this.k = 0;
      this.hasSave = !!opts.hasSave;
      this.focus = 0;
      if (this.phase === 'menu') this.startMusic();
    },
    startMusic() {
      G.audio.amb(['wind', 'night']);
      G.audio.song(G.audio.SONGS.valley, { fadeIn: 3 });
    },
    buttons() {
      const list = [];
      if (this.hasSave) list.push({ id: 'continue', t: 'Reprendre' });
      list.push({ id: 'new', t: this.hasSave ? 'Recommencer l\'épisode' : 'Commencer' });
      list.push({ id: 'sound', t: G.audio.muted ? 'Son : coupé' : 'Son : activé' });
      return list.map((b, i) => Object.assign(b, { r: { x: G.W / 2 - 160, y: 452 + i * 62, w: 320, h: 50 } }));
    },
    update(dt) {
      this.k = Math.min(1, this.k + dt * 0.5);
      if (G.blocked) return;
      if (this.phase === 'gate') {
        if (I.confirm()) {
          I.consume();
          G.audio.unlock();
          this.phase = 'menu';
          this.k = 0;
          this.startMusic();
        }
        return;
      }
      const bs = this.buttons();
      if (I.hit('ArrowDown')) this.focus = (this.focus + 1) % bs.length;
      if (I.hit('ArrowUp')) this.focus = (this.focus - 1 + bs.length) % bs.length;
      let pick = null;
      bs.forEach((b, i) => { if (ui.hit(b.r)) pick = b; if (ui.hover(b.r)) this.focus = i; });
      if (!pick && (I.hit('Enter') || I.hit('Space'))) pick = bs[this.focus];
      if (!pick) return;
      G.audio.sfx('click');
      if (pick.id === 'sound') { G.audio.toggleMute(); return; }
      this.finish({ action: pick.id });
    },
    draw(ctx) {
      valley(ctx);
      A.finish(ctx, { grain: 0.05 });
    },
    drawUI(c) {
      if (this.phase === 'gate') {
        c.fillStyle = 'rgba(10,8,7,0.72)';
        c.fillRect(0, 0, G.W, G.H);
        const a = 0.55 + 0.45 * Math.sin(G.time * 2.4);
        ui.text(c, 'Clique ou appuie sur Espace pour entrer', G.W / 2, G.H / 2, { size: 28, italic: true, align: 'center', base: 'middle', color: `rgba(232,223,204,${a})` });
        ui.text(c, 'Avec un casque, c\'est mieux.', G.W / 2, G.H / 2 + 46, { size: 19, italic: true, align: 'center', color: 'rgba(232,223,204,0.5)' });
        return;
      }
      const a = U.smooth(this.k);
      c.globalAlpha = a;
      ui.caps(c, 'Kentucky · 1932', G.W / 2, 170, { align: 'center', size: 16, color: 'rgba(232,223,204,0.7)', spacing: 6 });
      ui.text(c, 'Tant qu’on est là', G.W / 2, 262, { size: 92, align: 'center', base: 'alphabetic', shadow: true });
      ui.text(c, 'Épisode 1 · Le dernier sifflet', G.W / 2, 322, { size: 30, italic: true, align: 'center', color: '#E2CFA8', shadow: true });
      const bs = this.buttons();
      bs.forEach((b, i) => ui.button(c, b.r, b.t, { hover: this.focus === i && (I.mouse ? ui.hover(b.r) || !bs.some((o) => ui.hover(o.r)) : true), size: 24 }));
      ui.text(c, 'Souris, clavier ou toucher. Échap pour le menu en cours de partie.', G.W / 2, G.H - 34, { size: 16, italic: true, align: 'center', color: 'rgba(232,223,204,0.45)' });
      c.globalAlpha = 1;
    },
  });

  G.DEV = G.DEV || {};
  G.DEV.title = () => G.play(G.Scenes.title({ hasSave: false }));
})();

// ---- src/scenes/footbridge.js
'use strict';
// Mini-jeu « La passerelle » : traverser le pont suspendu avec trois gamelles
// sans en faire tomber dans le ruisseau. Équilibre : flèches, ou maintenir le
// pointeur à gauche ou à droite de l'écran.
(function () {
  const G = window.G;
  const U = G.U;
  const I = G.input;
  const ui = G.ui;
  const A = G.art;
  const P = G.PAL;

  const X0 = 150, X1 = 1130;          // départ et arrivée d'Henry sur le tablier
  const DECK = 470, SAG = 46;         // hauteur du tablier aux piles, flèche au milieu
  const LIMIT = 0.55;                 // angle au-delà duquel une gamelle glisse
  const OWNERS = ['de Wes', 'de Clay', 'de Papa'];

  const deckY = (x, bounce) => {
    const t = U.clamp((x - 100) / (1180 - 100), 0, 1);
    return DECK + SAG * 4 * t * (1 - t) + bounce * 4 * t * (1 - t);
  };

  function scenery(ctx) {
    const bg = A.cached('footbridge-bg', G.W, G.H, (cx) => {
      A.sky(cx, G.W, G.H, [[0, '#6F93B0'], [0.6, '#A9C0C8'], [1, '#E3D9B5']]);
      const far = A.makeRidge(41, G.W, 250, 40, 170);
      A.ridge(cx, far, '#6F8A8A', G.H);
      const mid = A.makeRidge(47, G.W, 330, 30, 140);
      A.ridge(cx, mid, '#3F5636', G.H);
      A.dots(cx, 49, 220, 0, G.W, (x) => [A.ridgeY(mid, x), A.ridgeY(mid, x) + 140], ['#3F5E2E', '#5E7A3A', '#6F8F3F', '#4A6B35', '#7C9A4A'], 7, 15);
      // berges
      cx.fillStyle = '#46552F';
      cx.beginPath(); cx.moveTo(0, 440); cx.quadraticCurveTo(80, 450, 130, 520); cx.lineTo(170, G.H); cx.lineTo(0, G.H); cx.fill();
      cx.beginPath(); cx.moveTo(G.W, 440); cx.quadraticCurveTo(1200, 450, 1150, 520); cx.lineTo(1110, G.H); cx.lineTo(G.W, G.H); cx.fill();
      // l'eau
      const g = cx.createLinearGradient(0, 560, 0, G.H);
      g.addColorStop(0, '#7E9DAA'); g.addColorStop(1, '#4E6E7A');
      cx.fillStyle = g;
      cx.fillRect(150, 590, 980, G.H - 590);
      // rochers
      cx.fillStyle = '#5E5A52';
      for (const [rx, ry, rw] of [[300, 640, 46], [520, 660, 30], [760, 630, 56], [980, 655, 36]]) {
        cx.beginPath(); cx.ellipse(rx, ry, rw, rw * 0.45, 0, Math.PI, 0); cx.fill();
      }
      A.texture(cx, G.W, G.H, 0.14);
    }, Math.min(G.dpr, 1.5));
    A.blit(ctx, bg, 0, 0);
    // reflets mouvants
    ctx.strokeStyle = 'rgba(230,240,240,0.35)';
    ctx.lineWidth = 2;
    for (let i = 0; i < 14; i++) {
      const y = 610 + (i % 7) * 15;
      const x = 180 + ((i * 131 + G.time * 40) % 920);
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 26, y); ctx.stroke();
    }
  }

  G.Scenes.footbridge = (opts = {}) => G.makeScene({
    colorOverride: { sat: 1.05, sepia: 0.05 },
    enter() {
      this.x = X0;
      this.th = 0;          // angle d'Henry
      this.om = 0;          // vitesse angulaire
      this.pails = 3;
      this.lost = [];
      this.falling = [];    // gamelles qui tombent
      this.nextGust = 2.5;
      this.gustText = 0;
      this.bounce = 0;
      this.bounceV = 0;
      this.phase = 'intro';
      this.introT = 0;
      this.qte = null;
      this.kid = null;
      this.kidDone = false;
      this.stumble = 0;
      this.walkPhase = 0;
      G.audio.amb(['creek', 'wind', 'birds']);
    },
    input() {
      let dir = 0;
      if (I.key('ArrowLeft') || I.key('KeyA') || I.key('KeyQ')) dir -= 1;
      if (I.key('ArrowRight') || I.key('KeyD')) dir += 1;
      if (I.down && !G.blocked) dir += I.x < G.W / 2 ? -1 : 1;
      return U.clamp(dir, -1, 1);
    },
    losePail() {
      if (this.pails <= 0) { this.th = 0; this.om = 0; this.stumble = 0.8; return; }
      const who = OWNERS[3 - this.pails];
      this.pails--;
      this.lost.push(who);
      const y = deckY(this.x, this.bounce);
      this.falling.push({ x: this.x + (this.th > 0 ? 40 : -40), y: y - 60, vy: -80, vx: this.th > 0 ? 60 : -60, rot: 0 });
      ui.toast(`La gamelle ${who} est tombée à l'eau !`, { color: '#F2B6A0' });
      G.audio.sfx('whoosh');
      this.th = 0;
      this.om = 0;
      this.stumble = 0.8;
    },
    update(dt) {
      // animation de l'eau et des gamelles qui tombent, même en pause
      for (const f of this.falling) {
        if (f.done) continue;
        f.vy += 900 * dt; f.x += f.vx * dt; f.y += f.vy * dt; f.rot += dt * 6;
        if (f.y > 610) { f.done = true; G.audio.sfx('splash'); f.splash = 0; }
      }
      for (const f of this.falling) if (f.splash != null) f.splash += dt;
      this.bounceV += (-this.bounce * 40 - this.bounceV * 3) * dt;
      this.bounce += this.bounceV * dt;
      if (G.blocked) return;

      if (this.phase === 'intro') {
        this.introT += dt;
        if (this.introT > 0.4 && (I.confirm() || this.introT > 6)) { I.consume(); this.phase = 'walk'; }
        return;
      }
      if (this.phase === 'end') {
        this.endT += dt;
        if (this.endT > 1.4) this.finish({ pails: this.pails, lost: this.lost });
        return;
      }

      // QTE « Accroche-toi au câble ! »
      if (this.qte) {
        this.qte.t += dt;
        this.th += Math.sign(this.qte.side) * dt * 0.35;
        if (I.confirm()) {
          I.consume();
          G.audio.sfx('good');
          ui.toast('Rattrapé de justesse.');
          this.qte = null;
          this.th = 0; this.om = 0;
          return;
        }
        if (this.qte.t > 0.95) { this.qte = null; this.losePail(); }
        return;
      }

      const dir = this.input();
      // pendule inversé : l'équilibre s'écroule tout seul si on ne le corrige pas
      const sway = Math.sin(this.t * 1.7) * 0.32 + Math.sin(this.t * 0.63 + 1) * 0.18;
      this.om += (this.th * 2.4 + sway * 0.55 + dir * 2.7) * dt;
      this.nextGust -= dt;
      if (this.nextGust <= 0) {
        const s = Math.random() < 0.5 ? -1 : 1;
        this.om += s * U.rand(0.6, 1.0);
        this.nextGust = U.rand(1.8, 3.4);
        this.gustText = 1.2;
        this.gustSide = s;
        G.audio.sfx('whoosh');
      }
      this.gustText = Math.max(0, this.gustText - dt);
      this.om *= 1 - 1.5 * dt;
      this.th += this.om * dt;
      if (Math.abs(this.th) > LIMIT) this.losePail();

      // avance : plus lent quand Henry vacille
      this.stumble = Math.max(0, this.stumble - dt);
      const steady = Math.abs(this.th) < 0.28 && this.stumble <= 0;
      const speed = this.stumble > 0 ? 0 : steady ? 44 : 20;
      this.x += speed * dt;
      this.walkPhase = (this.walkPhase + speed * dt / 120) % 1;
      if (speed > 0 && Math.random() < dt * 1.2) G.audio.sfx('creak');

      // le petit Napier déboule sur la passerelle au milieu
      if (!this.kidDone && this.x > 560) {
        this.kidDone = true;
        this.kid = { x: 1180, t: 0 };
      }
      if (this.kid) {
        this.kid.t += dt;
        this.kid.x -= 260 * dt;
        if (!this.kid.hit && this.kid.x < this.x + 260) {
          this.kid.hit = true;
          this.bounceV = 260;
          const side = this.th >= 0 ? 1 : -1;
          this.om += side * 1.4;
          this.qte = { t: 0, side };
          G.audio.sfx('thud');
        }
        if (this.kid.x < this.x + 70 && !this.kid.jumped) {
          this.kid.jumped = true;
          ui.toast('« Pardon, Henry ! »');
        }
        if (this.kid.x < 60) this.kid = null;
      }

      if (this.x >= X1) { this.x = X1; this.phase = 'end'; this.endT = 0; }
    },
    draw(ctx) {
      scenery(ctx);
      // pylônes et câbles
      ctx.fillStyle = P.beam;
      for (const px of [96, 1176]) ctx.fillRect(px - 6, 300, 12, 260);
      const rail = (x, k) => deckY(x, this.bounce) - 125 + k + 3 * Math.sin(x / 90 + this.t * 1.3);
      ctx.strokeStyle = '#2B2420';
      ctx.lineWidth = 3;
      for (const k of [0, 22]) {
        ctx.beginPath();
        for (let x = 96; x <= 1176; x += 12) (x === 96 ? ctx.moveTo(x, rail(x, k)) : ctx.lineTo(x, rail(x, k)));
        ctx.stroke();
      }
      // suspentes et tablier
      ctx.lineWidth = 1.5;
      for (let x = 120; x < 1170; x += 36) {
        ctx.beginPath(); ctx.moveTo(x, deckY(x, this.bounce)); ctx.lineTo(x, rail(x, 0)); ctx.stroke();
      }
      for (let x = 100; x < 1180; x += 16) {
        const y = deckY(x, this.bounce);
        ctx.fillStyle = (x / 16) % 3 ? '#6A4C30' : '#4A3826';
        ctx.fillRect(x, y - 2, 14, 10);
        ctx.fillStyle = '#2E241B';
        ctx.fillRect(x, y + 8, 14, 2);
      }
      // gamelles qui tombent
      for (const f of this.falling) {
        if (!f.done) {
          ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.rot);
          ctx.fillStyle = '#6E6A64'; ctx.fillRect(-7, -7, 14, 14);
          ctx.restore();
        } else if (f.splash < 0.8) {
          ctx.strokeStyle = `rgba(230,240,240,${0.8 - f.splash})`;
          ctx.lineWidth = 2;
          ctx.beginPath(); ctx.ellipse(f.x, 612, 10 + f.splash * 50, 3 + f.splash * 8, 0, 0, Math.PI * 2); ctx.stroke();
        }
      }
      // le petit Napier
      if (this.kid) A.char(ctx, 'napierKid', this.kid.x, deckY(this.kid.x, this.bounce), { dir: -1, pose: 'walk', phase: (this.kid.t * 2.6) % 1 });
      // Henry
      const y = deckY(this.x, this.bounce);
      A.char(ctx, 'henry', this.x, y, {
        dir: 1, pose: this.phase === 'walk' && !this.stumble ? 'walk' : 'stand', phase: this.walkPhase,
        tilt: this.th * 0.9, carry: 'pails', pails: this.pails, rim: true, arms: [-0.6 - this.th, 0.5 + this.th],
      });
      A.finish(ctx);
    },
    drawUI(c) {
      if (this.phase === 'intro') {
        ui.hint(c, 'Garde l\'équilibre : ← → ou maintiens le doigt à gauche / à droite');
        ui.text(c, 'Trois gamelles. Celle au nœud rouge, c\'est celle de Papa.', G.W / 2, 110, { size: 24, italic: true, align: 'center', shadow: true });
        ui.text(c, 'Clique pour y aller', G.W / 2, 150, { size: 18, italic: true, align: 'center', color: 'rgba(232,223,204,0.7)', shadow: true });
      }
      // jauge d'équilibre en arc
      const cx = G.W / 2, cy = 120, r = 70;
      c.save();
      c.lineCap = 'round';
      c.lineWidth = 10;
      c.strokeStyle = 'rgba(20,16,13,0.6)';
      c.beginPath(); c.arc(cx, cy, r, Math.PI * 1.2, Math.PI * 1.8); c.stroke();
      c.strokeStyle = 'rgba(94,122,58,0.9)';
      c.beginPath(); c.arc(cx, cy, r, Math.PI * 1.5 - 0.16, Math.PI * 1.5 + 0.16); c.stroke();
      const a = Math.PI * 1.5 + U.clamp(this.th / LIMIT, -1, 1) * Math.PI * 0.3;
      c.strokeStyle = Math.abs(this.th) > LIMIT * 0.7 ? P.ember : P.paper;
      c.lineWidth = 4;
      c.beginPath(); c.moveTo(cx, cy); c.lineTo(cx + Math.cos(a) * (r + 8), cy + Math.sin(a) * (r + 8)); c.stroke();
      c.restore();
      if (this.phase !== 'intro') ui.text(c, `Gamelles : ${this.pails} / 3`, 40, 60, { size: 24, shadow: true });
      if (this.gustText > 0) ui.text(c, this.gustSide > 0 ? 'Coup de vent →' : '← Coup de vent', cx, 170, { size: 20, italic: true, align: 'center', alpha: Math.min(1, this.gustText * 2), shadow: true });
      if (this.qte) {
        const k = 1 + 0.08 * Math.sin(G.time * 20);
        c.save(); c.translate(G.W / 2, 290); c.scale(k, k);
        ui.text(c, 'Accroche-toi au câble !', 0, 0, { size: 44, align: 'center', base: 'middle', color: P.rim, shadow: true });
        c.restore();
        ui.text(c, 'Clique ou appuie sur Espace', G.W / 2, 330, { size: 20, italic: true, align: 'center', shadow: true });
        ui.bar(c, G.W / 2 - 120, 350, 240, 8, 1 - this.qte.t / 0.95, { color: P.ember });
      }
      // zones tactiles
      if (!I.mouse && this.phase === 'walk') {
        c.globalAlpha = 0.18;
        c.fillStyle = P.paper;
        c.beginPath(); c.roundRect(20, G.H - 140, 120, 120, 16); c.fill();
        c.beginPath(); c.roundRect(G.W - 140, G.H - 140, 120, 120, 16); c.fill();
        c.globalAlpha = 0.7;
        ui.text(c, '←', 80, G.H - 80, { size: 50, align: 'center', base: 'middle' });
        ui.text(c, '→', G.W - 80, G.H - 80, { size: 50, align: 'center', base: 'middle' });
        c.globalAlpha = 1;
      }
    },
  });

  G.DEV = G.DEV || {};
  G.DEV.footbridge = () => G.play(G.Scenes.footbridge({}));
})();
